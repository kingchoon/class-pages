  <!--
    ⚡ 빠른 시작
    - 위 화면 코드(JSX)를 매번 Babel로 번역하면 느리다(번역기 3MB + 번역 1~3초).
    - 한 번 번역한 결과를 이 브라우저 안(IndexedDB 'modong-jsx-cache')에 넣어 두고, 코드가 그대로면 번역 없이 바로 실행한다.
    - 코드가 한 글자라도 바뀌면(지문 값이 달라지면) 자동으로 다시 번역한다. 최근 2개만 보관한다.
    - 저장본이 고장 나 있거나 IndexedDB를 못 쓰면 예전처럼 Babel로 번역한다. 그래도 안 되면 #root에 안내를 띄운다.
  -->
  <script>
    (function () {
      var BABEL_URL = 'https://unpkg.com/@babel/standalone@7/babel.min.js';
      var FORMAT = 'jsx1|react|strict';   // 번역 방식이 바뀌면 이 글자를 바꾼다 → 예전 저장본은 안 쓰게 됨
      var DB_NAME = 'modong-jsx-cache', STORE = 'code', KEEP = 2;
      var NOCACHE_FLAG = 'MODONG_JSX_NOCACHE';
      var t0 = (window.performance && performance.now) ? performance.now() : Date.now();
      function now() { return (window.performance && performance.now) ? performance.now() : Date.now(); }

      var srcEl = document.getElementById('app-src');
      var src = srcEl ? srcEl.textContent : '';

      // 지문(해시): FNV-1a 두 번(시작값 다르게) + 글자 수
      function fnv(s, seed) {
        var h = seed >>> 0;
        for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193); }
        return (h >>> 0).toString(16);
      }
      var key = FORMAT + ':' + fnv(src, 0x811c9dc5) + fnv(src, 0x01234567) + ':' + src.length;

      function rootEl() { return document.getElementById('root'); }
      function showProblem(title, detail, retry) {
        var r = rootEl(); if (!r) return;
        r.innerHTML = '';
        var box = document.createElement('div');
        box.setAttribute('role', 'alert');
        box.style.cssText = 'min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;background:#04111c;color:#d8f6ff;font-family:\'IBM Plex Sans KR\',system-ui,sans-serif;text-align:center';
        var inner = document.createElement('div');
        inner.style.cssText = 'max-width:560px;border:1.5px solid #4fe3ff;border-radius:18px;padding:28px 24px;background:rgba(79,227,255,.06);box-shadow:0 0 30px rgba(79,227,255,.18)';
        var h = document.createElement('div'); h.textContent = title; h.style.cssText = 'font-size:20px;font-weight:800;margin-bottom:10px';
        var p = document.createElement('div'); p.textContent = detail; p.style.cssText = 'font-size:15px;color:#8fb7c7;line-height:1.6;white-space:pre-line';
        var b = document.createElement('button'); b.type = 'button'; b.textContent = '다시 시도';
        b.style.cssText = 'margin-top:18px;padding:12px 26px;min-height:48px;border-radius:12px;border:0;background:#4fe3ff;color:#04111c;font-weight:800;font-size:16px;cursor:pointer';
        b.onclick = function () { b.disabled = true; b.textContent = '다시 여는 중…'; retry(); };
        inner.appendChild(h); inner.appendChild(p); inner.appendChild(b); box.appendChild(inner); r.appendChild(box);
      }

      // ---- IndexedDB (실패하면 조용히 null) ----
      function openDb() {
        return new Promise(function (resolve) {
          var done = false;
          var finish = function (v) { if (!done) { done = true; resolve(v); } };
          setTimeout(function () { finish(null); }, 1500);   // 어떤 브라우저는 IndexedDB가 멈춰 있을 때가 있다
          try {
            var rq = indexedDB.open(DB_NAME, 1);
            rq.onupgradeneeded = function () { var db = rq.result; if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE, { keyPath: 'key' }); };
            rq.onsuccess = function () { finish(rq.result); };
            rq.onerror = function () { finish(null); };
            rq.onblocked = function () { finish(null); };
          } catch (e) { finish(null); }
        });
      }
      function dbGet(db, k) {
        return new Promise(function (resolve) {
          try {
            var rq = db.transaction(STORE, 'readonly').objectStore(STORE).get(k);
            rq.onsuccess = function () { resolve(rq.result || null); };
            rq.onerror = function () { resolve(null); };
          } catch (e) { resolve(null); }
        });
      }
      function dbPut(db, rec) {
        return new Promise(function (resolve) {
          try {
            var tx = db.transaction(STORE, 'readwrite');
            var st = tx.objectStore(STORE);
            st.put(rec);
            var all = st.getAll();
            all.onsuccess = function () {
              var list = (all.result || []).sort(function (a, b) { return (b.t || 0) - (a.t || 0); });
              for (var i = KEEP; i < list.length; i++) st['delete'](list[i].key);
            };
            tx.oncomplete = function () { resolve(true); };
            tx.onerror = tx.onabort = function () { resolve(false); };
          } catch (e) { resolve(false); }
        });
      }
      function dbDelete(db, k) {
        return new Promise(function (resolve) {
          try { var tx = db.transaction(STORE, 'readwrite'); tx.objectStore(STORE)['delete'](k); tx.oncomplete = tx.onerror = tx.onabort = function () { resolve(); }; }
          catch (e) { resolve(); }
        });
      }

      // ---- 실행: Babel이 하던 것처럼 <script> 요소로 붙인다 (오류 위치 표시도 그대로) ----
      function execute(code) {
        window.__APP_BOOTED__ = false;
        var err = null;
        var onErr = function (ev) { if (!err) err = ev.error || new Error(ev.message || 'script error'); };
        window.addEventListener('error', onErr);
        var s = document.createElement('script');
        s.setAttribute('data-app-compiled', '1');
        s.textContent = code + '\n;window.__APP_BOOTED__ = true;\n//# sourceURL=app.jsx.js';
        try { document.body.appendChild(s); } finally { window.removeEventListener('error', onErr); }
        return window.__APP_BOOTED__ === true ? null : (err || new Error('화면 코드가 끝까지 실행되지 않았어요'));
      }

      // ---- Babel로 번역 ----
      var babelPromise = null;
      function loadBabel() {
        if (window.Babel && window.Babel.transform) return Promise.resolve(window.Babel);
        if (babelPromise) return babelPromise;
        babelPromise = new Promise(function (resolve, reject) {
          var s = document.createElement('script');
          s.src = BABEL_URL;
          s.onload = function () { window.Babel && window.Babel.transform ? resolve(window.Babel) : reject(new Error('Babel 없음')); };
          s.onerror = function () { s.remove(); reject(new Error('Babel을 받지 못함')); };
          document.head.appendChild(s);
        });
        babelPromise.catch(function () { babelPromise = null; });
        return babelPromise;
      }
      function compile(B) {
        // 예전 text/babel 과 같은 결과: JSX → React.createElement, 엄격 모드("use strict")
        var out = B.transform(src, { presets: ['react'], filename: 'app.jsx', sourceType: 'script', retainLines: true }).code;
        return '"use strict";' + out;   // 줄 번호를 원본과 같게(오류 위치 찾기 쉽게)
      }

      function report(source) {
        var ms = Math.round(now() - t0);
        window.__FAST_START__ = { source: source, ms: ms, key: key };
        try { console.info('[빠른 시작] ' + (source === 'cache' ? '저장본으로 바로 실행' : 'Babel로 새로 번역') + ' · ' + ms + 'ms'); } catch (e) {}
      }

      function fresh(db) {
        return loadBabel().then(function (B) {
          var code;
          try { code = compile(B); }
          catch (e) {
            console.error(e);
            showProblem('화면 코드에 문법 오류가 있어요', String(e && e.message || e).slice(0, 400), function () { location.reload(); });
            return;
          }
          var r = rootEl(); if (r) r.innerHTML = '';
          var err = execute(code);
          if (err) {
            console.error(err);
            showProblem('화면을 여는 중 문제가 생겼어요', String(err && err.message || err).slice(0, 400), function () { location.reload(); });
            return;
          }
          report('babel');
          if (db) dbPut(db, { key: key, code: code, t: Date.now() });
        }, function () {
          var r = rootEl(); if (r) r.innerHTML = '';
          showProblem('처음 한 번은 인터넷이 필요해요',
            '화면을 만드는 프로그램(Babel)을 받지 못했어요.\n와이파이·인터넷 연결을 확인한 뒤 「다시 시도」를 눌러 주세요.',
            function () { fresh(db); });
        });
      }

      function start(db) {
        // React가 없으면(CDN을 못 받음) 저장본·Babel 둘 다 소용없다 → 저장본은 지우지 말고 안내만
        if (!window.React || !window.ReactDOM) {
          showProblem('인터넷 연결이 필요해요',
            '화면을 그리는 프로그램(React)을 받지 못했어요.\n와이파이·인터넷 연결을 확인한 뒤 「다시 시도」를 눌러 주세요.',
            function () { location.reload(); });
          return;
        }
        var skipCache = false;
        try { skipCache = sessionStorage.getItem(NOCACHE_FLAG) === key; sessionStorage.removeItem(NOCACHE_FLAG); } catch (e) {}
        if (!db || skipCache) { fresh(db); return; }
        dbGet(db, key).then(function (rec) {
          if (!rec || typeof rec.code !== 'string' || rec.code.indexOf('"use strict";') !== 0) { fresh(db); return; }
          var err = execute(rec.code);
          if (!err) { report('cache'); return; }
          // 저장본이 고장: 지우고, 저장본 없이 다시 연다 (이미 일부 실행돼서 같은 이름이 남아 있으므로 새로고침)
          console.warn('[빠른 시작] 저장본 실행 실패 → 새로 번역합니다', err);
          dbDelete(db, key).then(function () {
            try { sessionStorage.setItem(NOCACHE_FLAG, key); location.reload(); }
            catch (e) { showProblem('화면을 여는 중 문제가 생겼어요', String(err && err.message || err), function () { location.reload(); }); }
          });
        });
      }

      // IndexedDB 조회는 지금 바로 시작하고, 실행은 예전 Babel처럼 문서를 다 읽은 뒤(DOMContentLoaded)에 한다
      var dbReady = (window.indexedDB ? openDb() : Promise.resolve(null));
      function go() { dbReady.then(start, function () { fresh(null); }); }
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', go);
      else go();
    })();
  </script>
</body>
</html>
