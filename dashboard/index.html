<body>
  <div id="wallpaper"></div>
  <div id="root"></div>

  <!--
    대시보드 데이터 파일 저장소 연동
    - 시작할 때 run.pyw 폴더(MYBOX)의 backup_data/dashboard_backup.json을 먼저 읽어 localStorage에 채운다.
      (React 앱보다 먼저 실행되어야 각 위젯이 복원된 값으로 시작한다.)
    - 이후 아래 KEYS 중 하나가 바뀌면 1초 뒤 자동으로 파일에 저장한다.
    - 파일을 읽지 못한 경우에는 기존 데이터를 덮어쓰지 않도록 저장을 멈춘다.
  -->
  <script>
    (function () {
      if (window.__TABLET_APP__) {   // 📲 갤탭 앱: 데이터는 갤탭 안 + 구글 시트 동기화로만 보관
        window.__flushDashboardState = function () { return Promise.resolve(true); };
        return;
      }
      var KEYS = [
        'MODONG_TODOS', 'MODONG_GCAL_EVENTS', 'MODONG_BOOKMARKS', 'MODONG_FOLDERS',
        'MODONG_THEME', 'MODONG_LATEST_DOC_DIGEST',
        'MODONG_GAS_URL', 'MODONG_GCAL_CLIENT_ID', 'MODONG_GCAL_EMAIL',
        'GCAL_USER_EMAIL',
        'MODONG_WIDGET_LAYOUTS', 'MODONG_WIDGETS_LOCKED', 'MODONG_ACTIVE_WIDGETS',
        'MODONG_MY_TIMETABLE', 'MODONG_LESSON_PLANS', 'MODONG_CLASS_PROGRESS',
        'MODONG_SYNC_KEYTIMES', 'MODONG_LESSON_VIDEOS', 'MODONG_SAVED_VIDEOS'
      ];
      // Gemini 키는 백업 파일이 아니라 서버의 config.json에 따로 영구 보관한다(아래 4번).
      var token = window.__DASHBOARD_TOKEN__ || '';
      var ls = window.localStorage;
      var origSet = Storage.prototype.setItem;
      var origRemove = Storage.prototype.removeItem;
      var ready = false;
      var timer = null;
      var DIRTY_KEY = 'MODONG_STATE_DIRTY';   // 파일에 아직 못 보낸 변경이 있다는 표시(KEYS에 넣지 않음 = 파일에 저장 안 됨)
      var failCount = 0;                      // 연속 저장 실패 횟수(3번까지만 다시 시도)
      var shownNotice = {};                   // 같은 안내는 한 번만 보여 주기

      function notice(msg) {
        var show = function () {
          var d = document.createElement('div');
          d.textContent = msg;
          d.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:99999;' +
            'background:#7f1d1d;color:#fff;padding:12px 18px;border-radius:10px;font:14px sans-serif;' +
            'box-shadow:0 8px 24px rgba(0,0,0,.5);max-width:90vw;';
          document.body.appendChild(d);
          setTimeout(function () { d.remove(); }, 12000);
        };
        if (document.body) show(); else document.addEventListener('DOMContentLoaded', show);
      }

      // 1) 시작 시 파일에서 불러오기 (동기 요청: 로컬 서버라 매우 빠름)
      try {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', '/api/state', false);
        xhr.setRequestHeader('X-Dashboard-Token', token);
        xhr.send(null);
        var res = xhr.status === 200 ? JSON.parse(xhr.responseText) : null;
        if (res && res.success) {
          if (res.data && typeof res.data === 'object') {
            // 지난번에 파일로 못 보낸 변경(DIRTY 표시)이 브라우저에 남아 있으면, 파일 값으로 덮어쓰지 않고 브라우저 값을 파일로 보낸다.
            //  (단, 파일이 그 뒤에 저장됐으면(갤탭 리모컨 등) 파일 쪽이 더 새것이므로 평소처럼 파일 값을 쓴다)
            var dirtyAt = parseInt(ls.getItem(DIRTY_KEY) || '0', 10) || 0;
            var savedAtMs = res.savedAt ? Date.parse(res.savedAt) : NaN;   // 같은 PC의 현지 시각(초 단위)
            var wasDirty = dirtyAt > 0 && !(savedAtMs > dirtyAt);
            if (dirtyAt && !wasDirty) { try { origRemove.call(ls, DIRTY_KEY); } catch (e) {} }
            if (!wasDirty) {
              KEYS.forEach(function (k) {
                if (typeof res.data[k] === 'string') origSet.call(ls, k, res.data[k]);
                else origRemove.call(ls, k);
              });
            }
            ready = true;
            if (wasDirty) setTimeout(function () { saveNow(); }, 0);
          } else {
            // 저장 파일이 아직 없음(첫 실행): 지금 브라우저에 남아 있는 데이터로 파일을 새로 만든다.
            ready = true;
            setTimeout(function () { saveNow(); }, 0);
          }
        } else {
          notice('⚠️ 저장 파일(backup_data)을 읽지 못해 이번 실행의 변경 사항은 파일에 저장되지 않습니다. dashboard.log를 확인해주세요.');
        }
      } catch (e) {
        notice('⚠️ 저장 파일을 불러오는 중 오류가 발생했습니다: ' + e.message);
      }

      // 4) Gemini 키: config.json에 저장된 키를 시작할 때 불러온다.
      //    서버에 키가 없고 브라우저에만 남아 있으면(예전 버전 사용자) 서버로 옮겨 저장한다.
      try {
        var kx = new XMLHttpRequest();
        kx.open('GET', '/api/gemini/key', false);
        kx.setRequestHeader('X-Dashboard-Token', token);
        kx.send(null);
        var kres = kx.status === 200 ? JSON.parse(kx.responseText) : null;
        if (kres && kres.success) {
          if (kres.apiKey) {
            origSet.call(ls, 'GEMINI_API_KEY', kres.apiKey);
          } else if (kres.hasKey) {
            // 서버(config.json)에 키가 있으면 키는 서버만 갖는다.
            // 브라우저에 남은 예전 키가 서버의 새 키를 덮어쓰지 않도록 지운다. (제미나이 호출은 서버가 자기 키로 함)
            try { ls.removeItem('GEMINI_API_KEY'); } catch (e2) {}
            window.__GEMINI_SERVER_KEY__ = { hasKey: true, masked: kres.masked || '' };
          } else {
            var localKey = (ls.getItem('GEMINI_API_KEY') || '').trim();
            if (localKey) {
              fetch('/api/gemini/key', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-Dashboard-Token': token },
                body: JSON.stringify({ apiKey: localKey, verify: false })
              }).catch(function () {});
            }
          }
        }
      } catch (e) {
        console.warn('Gemini 키 불러오기 실패', e);
      }

      function collect() {
        var o = {};
        KEYS.forEach(function (k) {
          var v = ls.getItem(k);
          if (v !== null) o[k] = v;
        });
        return o;
      }

      function noticeOnce(kind, msg) {
        if (shownNotice[kind]) return;
        shownNotice[kind] = true;
        notice(msg);
      }

      function retryLater() {
        failCount++;
        if (failCount < 3) schedule();
      }

      function saveNow(keepalive) {
        if (!ready) return Promise.resolve(false);
        if (timer) { clearTimeout(timer); timer = null; }
        var dirtyAtStart = ls.getItem(DIRTY_KEY);
        var body = JSON.stringify({ data: collect() });
        return fetch('/api/state', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Dashboard-Token': token },
          body: body,
          keepalive: !!keepalive && body.length < 60000   // 크롬은 64KB가 넘는 keepalive 요청을 거부한다
        }).then(function (r) {
          if (r.ok) {
            failCount = 0;
            // 저장하는 동안 새 변경이 없었을 때만 DIRTY 표시를 지운다.
            try { if (!timer && ls.getItem(DIRTY_KEY) === dirtyAtStart) origRemove.call(ls, DIRTY_KEY); } catch (e) {}
            return true;
          }
          if (r.status === 400) noticeOnce('big', '⚠️ 데이터가 너무 커서 파일에 저장하지 못했어요. 오래된 자료를 조금 지워 주세요.');
          else if (r.status === 401) noticeOnce('auth', '⚠️ 저장 권한이 만료됐어요. 대시보드를 다시 켜 주세요.');
          retryLater();
          return false;
        }).catch(function (e) { console.warn('대시보드 저장 실패', e); retryLater(); return false; });
      }

      function schedule() {
        if (!ready) return;
        try { origSet.call(ls, DIRTY_KEY, String(Date.now())); } catch (e) {}
        if (timer) clearTimeout(timer);
        timer = setTimeout(function () { saveNow(); }, 1000);
      }

      // 2) localStorage 변경을 감지해서 자동 저장
      Storage.prototype.setItem = function (k, v) {
        origSet.call(this, k, v);
        if (this === ls && KEYS.indexOf(k) !== -1) schedule();
      };
      Storage.prototype.removeItem = function (k) {
        origRemove.call(this, k);
        if (this === ls && KEYS.indexOf(k) !== -1) schedule();
      };

      // 3) 종료·창 숨김 직전에 밀린 저장을 즉시 처리
      window.__flushDashboardState = function () { return saveNow(false); };
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'hidden' && timer) saveNow(true);
      });
      window.addEventListener('pagehide', function () { if (timer) saveNow(true); });
    })();
  </script>

  <script>
    // 작업표시줄이 차지하는 만큼(위·아래·왼쪽·오른쪽)을 계산해서 CSS 변수로 넘긴다.
    // screen.avail* = 작업표시줄을 뺀 화면 영역. 창이 이미 그 영역에 맞춰져 있으면 0이 된다.
    (function () {
      if (window.__TABLET_APP__) { window.__safeArea = { top: 0, left: 0, bottom: 0, right: 0 }; return; }
      function update() {
        try {
          var s = window.screen;
          if (typeof s.availTop !== 'number' || typeof s.availLeft !== 'number') return;
          var cap = function (v) { return Math.max(0, Math.min(240, Math.round(v))); };
          // 웹 화면의 실제 화면 위치 (크롬 제목줄을 잘라 냈어도 정확하게: 바깥 창 - 안쪽 화면 차이를 더한다)
          var side = Math.max(0, (window.outerWidth - window.innerWidth) / 2);
          var top0 = window.screenY + Math.max(0, (window.outerHeight - window.innerHeight) - side);
          var left0 = window.screenX + side;
          var t = cap(s.availTop - top0);
          var l = cap(s.availLeft - left0);
          var b = cap((top0 + window.innerHeight) - (s.availTop + s.availHeight));
          var r = cap((left0 + window.innerWidth) - (s.availLeft + s.availWidth));
          var key = [t, l, b, r].join(',');
          if (key === window.__safeAreaKey) return;
          window.__safeAreaKey = key;
          var st = document.documentElement.style;
          st.setProperty('--safe-top', t + 'px');
          st.setProperty('--safe-left', l + 'px');
          st.setProperty('--safe-bottom', b + 'px');
          st.setProperty('--safe-right', r + 'px');
          window.__safeArea = { top: t, left: l, bottom: b, right: r };
          window.dispatchEvent(new Event('resize'));   // 위젯 배치를 새 크기에 맞게 다시 계산
        } catch (e) {}
      }
      window.__safeArea = { top: 0, left: 0, bottom: 0, right: 0 };
      update();
      window.addEventListener('resize', update);
      setInterval(update, 2000);   // 작업표시줄을 옮기거나 크기를 바꿔도 따라간다
    })();
    // 바탕화면 그림을 대시보드 자리에 맞춰 깔기 (1분마다 바뀌었는지 확인)
    (function () {
      if (window.__TABLET_APP__) return;   // 갤탭에는 윈도우 바탕화면 그림이 없다
      var lastKey = '';
      function place() {
        try {
          var token = window.__DASHBOARD_TOKEN__ || '';
          fetch('/api/wallpaper/info', { headers: { 'X-Dashboard-Token': token } }).then(function (r) { return r.json(); }).then(function (d) {
            if (!d || !d.success) return;
            var el = document.getElementById('wallpaper');
            var c = d.color || [11, 18, 32];
            document.body.style.setProperty('background-color', 'rgb(' + c.join(',') + ')', 'important');
            if (!d.has || !d.dash) { el.style.backgroundImage = 'none'; return; }
            var k = window.devicePixelRatio || 1;
            var mw = d.mon.w / k, mh = d.mon.h / k;
            var ox = (d.dash.x - d.mon.x) / k, oy = (d.dash.y - d.mon.y) / k;
            var size = { '10': 'cover', '22': 'cover', '6': 'contain', '2': '100% 100%', '0': 'auto' }[String(d.style)] || 'cover';
            if (String(d.tile) === '1') size = 'auto';
            el.style.left = (-ox) + 'px'; el.style.top = (-oy) + 'px';
            el.style.width = mw + 'px'; el.style.height = mh + 'px';
            el.style.backgroundSize = size;
            el.style.backgroundPosition = 'center';
            el.style.backgroundRepeat = String(d.tile) === '1' ? 'repeat' : 'no-repeat';
            var key = '/wallpaper?v=' + d.v;
            if (key !== lastKey) { lastKey = key; el.style.backgroundImage = 'url(' + key + ')'; }
          }).catch(function () {});
        } catch (e) {}
      }
      window.addEventListener('load', place);
      window.addEventListener('resize', function () { setTimeout(place, 400); });
      setInterval(place, 60000);
    })();

    // 🖱️ 앱처럼: 오른쪽 클릭 메뉴(뒤로·새로고침·검사 등)를 막는다. 글자 입력칸에서는 붙여넣기를 위해 그대로 둔다.
    document.addEventListener('contextmenu', function (e) {
      var t = e.target;
      if (t && t.closest && t.closest('input, textarea, [contenteditable="true"], .allow-context')) return;
      e.preventDefault();
    });

    // 대시보드가 실제로 쓸 수 있는 크기
    function dashViewW() { var a = window.__safeArea || {}; return Math.max(320, window.innerWidth - (a.left || 0) - (a.right || 0)); }
    function dashViewH() { var a = window.__safeArea || {}; return Math.max(240, window.innerHeight - (a.top || 0) - (a.bottom || 0)); }
  </script>

  <script type="text/x-jsx" id="app-src">
    const { useState, useEffect, useRef, useCallback } = React;

    // 로컬 백엔드(run.pyw) 전용 API 호출 래퍼.
    // 서버가 페이지 로드 시 심어준 1회성 토큰(window.__DASHBOARD_TOKEN__)을
    // X-Dashboard-Token 헤더로 함께 보내, 외부 웹페이지가 흉내 낼 수 없게 한다.
    function dApiFetch(input, init = {}) {
      const headers = new Headers(init.headers || {});
      if (window.__DASHBOARD_TOKEN__) {
        headers.set('X-Dashboard-Token', window.__DASHBOARD_TOKEN__);
      }
      return fetch(input, { ...init, headers });
    }

    // Gemini 키를 프로그램 폴더의 config.json에 영구 저장한다. 성공하면 true.
    async function saveGeminiKeyToServer(val, verify = true) {
      try {
        const res = await dApiFetch('/api/gemini/key', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ apiKey: val, verify })
        });
        const data = await res.json().catch(() => ({}));
        return { ok: res.ok && data.success, error: data.error, key: data.apiKey, warning: data.warning };
      } catch (e) {
        return { ok: false, error: e.message };
      }
    }

    const THEMES = [
      { id: 'jarvis', name: '🧠 자비스 HUD (기본)' },
      { id: 'workbench', name: '🔧 기술실 작업대' },
      { id: 'sepia', name: '☕ 웜 세피아 (블루라이트 차단)' },
      { id: 'sage', name: '🌿 세이지 그린 (안구 피로 완화)' },
      { id: 'slate', name: '🌌 슬레이트 네이비 (저반사 집중)' },
      { id: 'olive', name: '🍃 다크 올리브 (칠판 톤 편안함)' },
      { id: 'zen', name: '🌑 어반 젠 차콜 (무채색 저자극)' }
    ];

    // 학교 종 시간표. 실제 학사일정과 다르면 아래 시각(HH:MM)만 학교 시간표에 맞게 수정하면 된다.
    const PERIOD_SCHEDULE = [
      { label: '1교시', start: '08:50', end: '09:35' },
      { label: '2교시', start: '09:45', end: '10:30' },
      { label: '3교시', start: '10:40', end: '11:25' },
      { label: '4교시', start: '11:35', end: '12:20' },
      { label: '점심시간', start: '12:20', end: '13:20', isBreak: true },
      { label: '5교시', start: '13:20', end: '14:05' },
      { label: '6교시', start: '14:15', end: '15:00' },
      { label: '7교시', start: '15:10', end: '15:55' }
    ];

    function getPeriodStatus(now) {
      const toMin = (hhmm) => {
        const [h, m] = hhmm.split(':').map(Number);
        return h * 60 + m;
      };
      const nowMin = now.getHours() * 60 + now.getMinutes();

      for (let i = 0; i < PERIOD_SCHEDULE.length; i++) {
        const p = PERIOD_SCHEDULE[i];
        const s = toMin(p.start), e = toMin(p.end);
        if (nowMin >= s && nowMin < e) {
          const next = PERIOD_SCHEDULE[i + 1];
          return {
            key: p.label,
            label: p.isBreak ? `🍚 ${p.label}` : `🔔 ${p.label} 수업중`,
            isBreak: !!p.isBreak,
            isClassTime: true,
            remainingMin: e - nowMin,
            nextLabel: next ? next.label : null
          };
        }
        // 쉬는 시간(이번 교시 종료 ~ 다음 교시 시작 사이)
        const next = PERIOD_SCHEDULE[i + 1];
        if (next) {
          const ns = toMin(next.start);
          if (nowMin >= e && nowMin < ns) {
            return {
              key: `break-${i}`,
              label: `☕ 쉬는시간`,
              isBreak: true,
              isClassTime: false,
              remainingMin: ns - nowMin,
              nextLabel: next.label
            };
          }
        }
      }

      const first = PERIOD_SCHEDULE[0];
      const last = PERIOD_SCHEDULE[PERIOD_SCHEDULE.length - 1];
      if (nowMin < toMin(first.start)) {
        return { key: 'before-school', label: '🌅 등교 전', isBreak: true, isClassTime: false, remainingMin: toMin(first.start) - nowMin, nextLabel: first.label };
      }
      return { key: 'after-school', label: '🌆 방과 후', isBreak: true, isClassTime: false, remainingMin: null, nextLabel: null };

    // 📏 하루 시간자: 1교시 시작부터 마지막 교시 끝까지를 자처럼 펼치고, 지금 위치를 바늘로 보여 준다.
    //    내가 들어가는 수업 칸에는 반 이름을 적는다.
    function PeriodRuler({ now, myClasses }) {
      const toMin = (hhmm) => { const [h, m] = hhmm.split(':').map(Number); return h * 60 + m; };
      const dayStart = toMin(PERIOD_SCHEDULE[0].start);
      const dayEnd = toMin(PERIOD_SCHEDULE[PERIOD_SCHEDULE.length - 1].end);
      const span = dayEnd - dayStart;
      const pct = (min) => Math.max(0, Math.min(100, ((min - dayStart) / span) * 100));
      const nowMin = now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60;
      const inDay = nowMin >= dayStart && nowMin <= dayEnd;
      const tick = (10 / span) * 100;   // 눈금 하나 = 10분
      return (
        <div className="wb-ruler" aria-label="오늘 교시 시간자">
          <div className="wb-ruler-track" style={{ '--tick': `${tick}%` }}>
            {PERIOD_SCHEDULE.map(p => {
              const s = toMin(p.start), e = toMin(p.end);
              const on = nowMin >= s && nowMin < e;
              const done = nowMin >= e;
              const mine = !p.isBreak && myClasses && myClasses[p.label];
              return (
                <div key={p.label}
                  className={`wb-seg ${p.isBreak ? 'is-break' : ''} ${on ? 'is-on' : ''} ${done ? 'is-done' : ''} ${mine ? 'is-mine' : ''}`}
                  style={{ left: `${pct(s)}%`, width: `${pct(e) - pct(s)}%` }}
                  title={`${p.label} ${p.start}~${p.end}${mine ? ` · ${mine}` : ''}`}>
                  <span className="wb-seg-num">{p.isBreak ? '점심' : p.label.replace('교시', '')}</span>
                  {mine && <span className="wb-seg-cls">{mine}</span>}
                </div>
              );
            })}
            {inDay && <div className="wb-needle" style={{ left: `${pct(nowMin)}%` }} />}
          </div>
          <div className="wb-ruler-ends">
            <span>{PERIOD_SCHEDULE[0].start}</span>
            <span>{PERIOD_SCHEDULE[PERIOD_SCHEDULE.length - 1].end}</span>
          </div>
        </div>
      );
    }

    // 🧠 자비스 테마 배경: 천천히 도는 '뇌 모양 신경망'. 신호가 선을 따라 달리고, 닿은 점이 반짝이며 옆으로 퍼진다.
    //    바탕화면에 늘 켜 두는 프로그램이라 초당 24장만 그린다.
    //    바탕화면에 붙은 창은 크롬이 '가려졌다'고 착각해 requestAnimationFrame 을 멈추므로, 타이머(setTimeout)로 그린다.
    function NeuralBackdrop({ enabled }) {
      const ref = useRef(null);
      useEffect(() => {
        const cv = ref.current; if (!cv) return;
        const ctx = cv.getContext('2d');
        // 윈도우의 '애니메이션 효과 끄기'는 따르지 않는다 (학교 PC는 대개 꺼져 있음). 끄고 싶으면 ⚙ 설정의 '배경 신경망 움직임 끄기'.
        const reduce = false;
        let W = 0, H = 0, dpr = 1;
        const resize = () => {
          dpr = Math.min(window.devicePixelRatio || 1, 1.5);
          W = cv.clientWidth; H = cv.clientHeight;
          cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        };
        resize();
        window.addEventListener('resize', resize);

        // 점 만들기: 왼쪽·오른쪽 반구 + 소뇌 (단위 공간 -1~1)
        let seed = 7;
        const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
        const pts = [];
        const inEll = (x, y, z, cx, cy, cz, rx, ry, rz) => ((x - cx) / rx) ** 2 + ((y - cy) / ry) ** 2 + ((z - cz) / rz) ** 2 <= 1;
        while (pts.length < 230) {
          const x = rnd() * 2 - 1, y = rnd() * 1.6 - 0.8, z = rnd() * 2 - 1;
          const hemi = inEll(x, y, z, -0.27, -0.05, 0, 0.62, 0.55, 0.9) || inEll(x, y, z, 0.27, -0.05, 0, 0.62, 0.55, 0.9);
          const cereb = inEll(x, y, z, 0, 0.46, 0.55, 0.42, 0.2, 0.28);
          const gap = Math.abs(x) < 0.035;   // 두 반구 사이 틈
          if ((hemi || cereb) && !gap) pts.push({ x, y, z, glow: 0, sx: 0, sy: 0, sz: 0 });
        }
        // 가까운 점 3개씩 잇기
        const edges = []; const adj = pts.map(() => []);
        pts.forEach((a, i) => {
          const near = pts.map((b, j) => [j, (a.x - b.x) ** 2 + (a.y - b.y) ** 2 + (a.z - b.z) ** 2]).filter(d => d[0] !== i).sort((u, v) => u[1] - v[1]).slice(0, 3);
          near.forEach(([j]) => { if (!adj[i].includes(j)) { edges.push([i, j]); adj[i].push(j); adj[j].push(i); } });

          const cx = W * 0.5, cy = H * 0.52;
          const ca = Math.cos(ang), sa = Math.sin(ang), tilt = 0.28, ct = Math.cos(tilt), st = Math.sin(tilt);
          for (const p of pts) {
            const x1 = p.x * ca + p.z * sa, z1 = -p.x * sa + p.z * ca;
            const y2 = p.y * ct - z1 * st, z2 = p.y * st + z1 * ct;
            const persp = 2.6 / (2.6 + z2);

            p.glow = Math.max(0, p.glow - dt * 1.6);
          }
          // 선
          ctx.lineWidth = 0.9;
          for (const [i, j] of edges) {
            const a = pts[i], b = pts[j];
            const depth = 0.5 - (a.sz + b.sz) * 0.25;
            const g = Math.max(a.glow, b.glow);
            ctx.strokeStyle = `rgba(79, 227, 255, ${0.14 + depth * 0.3 + g * 0.5})`;
            ctx.beginPath(); ctx.moveTo(a.sx, a.sy); ctx.lineTo(b.sx, b.sy); ctx.stroke();
          }
          // 점
          for (const p of pts) {
            const depth = 0.5 - p.sz * 0.5;
            const r = 1.1 + depth * 1.8 + p.glow * 2.6;
            ctx.fillStyle = p.glow > 0.05 ? `rgba(190, 248, 255, ${0.5 + p.glow * 0.5})` : `rgba(110, 235, 255, ${0.5 + depth * 0.5})`;

            }

          // 신호
          if (rnd() < 0.35 && pulses.length < 26) fire(Math.floor(rnd() * pts.length));
          for (let k = pulses.length - 1; k >= 0; k--) {
            const q = pulses[k]; q.t += q.sp * (dt * 24);
            const a = pts[q.a], b = pts[q.b];
            const x = a.sx + (b.sx - a.sx) * Math.min(1, q.t), y = a.sy + (b.sy - a.sy) * Math.min(1, q.t);

            ctx.beginPath(); ctx.arc(x, y, 1.7, 0, 6.283); ctx.fill();
            ctx.strokeStyle = 'rgba(120, 236, 255, 0.55)'; ctx.lineWidth = 1.2;
            const tx = a.sx + (b.sx - a.sx) * Math.max(0, q.t - 0.35), ty = a.sy + (b.sy - a.sy) * Math.max(0, q.t - 0.35);
            ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(x, y); ctx.stroke();
            if (q.t >= 1) {
              pulses.splice(k, 1);
              b.glow = 1;
              if (q.hop < 3 && rnd() < 0.7) { const nb = adj[q.b].filter(n => n !== q.a); if (nb.length) pulses.push({ a: q.b, b: nb[Math.floor(rnd() * nb.length)], t: 0, sp: q.sp, hop: q.hop + 1 }); }
            }
          }
        };
        const loop = () => {
          if (stopped) return;
          // 창이 숨겨져 있으면(최소화·다른 탭) 그리지 않고 가끔만 확인한다
          if (document.hidden) { timer = setTimeout(loop, 500); return; }
          try { draw(performance.now()); } catch (e) {}
          timer = setTimeout(loop, 42);   // 약 24장/초
        };
        if (reduce || !enabled) {
          // 움직임을 꺼도 신경망 그림은 남긴다 (신호가 몇 개 켜진 모습으로 한 장)
          for (let i = 0; i < 40; i++) draw(i * 42);
        } else loop();
        return () => { stopped = true; clearTimeout(timer); window.removeEventListener('resize', resize); };
      }, [enabled]);
      return <canvas ref={ref} className="jv-neural" aria-hidden="true" />;
    }

    // ⭕ 교시 링: 지금 교시(또는 쉬는 시간)가 얼마나 지났는지 원으로 보여 준다.
    function PeriodRing({ now }) {
      const toMin = (hhmm) => { const [h, m] = hhmm.split(':').map(Number); return h * 60 + m; };
      const nowMin = now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60;
      let label = '', sub = '', frac = 0, live = false;
      for (let i = 0; i < PERIOD_SCHEDULE.length; i++) {
        const p = PERIOD_SCHEDULE[i], s = toMin(p.start), e = toMin(p.end);
        if (nowMin >= s && nowMin < e) { label = p.isBreak ? '점심' : p.label.replace('교시', ''); sub = p.isBreak ? '' : '교시'; frac = (nowMin - s) / (e - s); live = !p.isBreak; break; }
        const nx = PERIOD_SCHEDULE[i + 1];
        if (nx && nowMin >= e && nowMin < toMin(nx.start)) { label = '쉬는'; sub = '시간'; frac = (nowMin - e) / (toMin(nx.start) - e); break; }
      }
      if (!label) { label = '—'; sub = nowMin < toMin(PERIOD_SCHEDULE[0].start) ? '수업 전' : '수업 끝'; }

      return (
        <div className={`jv-ring ${live ? 'is-live' : ''}`} aria-label={`${label}${sub} 진행 ${Math.round(frac * 100)}%`}>

            <circle className="jv-ring-track" cx="60" cy="60" r={R} />
            <circle className="jv-ring-bar" cx="60" cy="60" r={R} strokeDasharray={`${C * frac} ${C}`} transform="rotate(-90 60 60)" />

        const rnd = (a, b) => a + Math.random() * (b - a);
        const pickPoint = () => { const { w, h } = R(); return { x: rnd(20, Math.max(40, w - 100)), y: rnd(70, Math.max(90, h - 110)) }; };
        const mk = (el, speed) => { const p = pickPoint(); return { el, x: p.x, y: p.y, tx: p.x, ty: p.y, speed, idleUntil: performance.now() + rnd(500, 2500), dir: 1 }; };

          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ payload, apiKey })
        });
      } catch (e) {
        throw new Error('대시보드 서버에 연결할 수 없습니다. 프로그램을 다시 실행해주세요.');
      }
      const data = await res.json().catch(() => ({}));
      if (res.ok) return data;
      throw new Error(data?.error?.message || `Gemini 요청 실패 (HTTP ${res.status})`);
    }

    function safeCopyToClipboard(text, onSuccess) {
      try {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.left = '-9999px';
        textarea.style.top = '0';
        document.body.appendChild(textarea);
        textarea.focus();
        textarea.select();
        const success = document.execCommand('copy');
        document.body.removeChild(textarea);
        if (success && onSuccess) onSuccess();
      } catch (err) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(() => { if (onSuccess) onSuccess(); });
        }
      }
    }

    function parseScheduleDates(dateStr, timeStr) {
      const currentYear = new Date().getFullYear();
      let sDate = (dateStr || '').trim();
      let sTime = (timeStr || '').trim();

      let matchYMD = sDate.match(/(\d{4})[-./](\d{1,2})[-./](\d{1,2})/);
      let year, month, day;
      if (matchYMD) {
        year = matchYMD[1];
        month = String(matchYMD[2]).padStart(2, '0');
        day = String(matchYMD[3]).padStart(2, '0');
      } else {
        let matchShort = sDate.match(/(\d{1,2})월\s*(\d{1,2})일/);
        if (matchShort) {
          year = String(currentYear);
          month = String(matchShort[1]).padStart(2, '0');
          day = String(matchShort[2]).padStart(2, '0');
        } else {
          const now = new Date();
          year = String(now.getFullYear());
          month = String(now.getMonth() + 1).padStart(2, '0');
          day = String(now.getDate()).padStart(2, '0');
        }
      }

      let hour = '09', minute = '00';
      if (sDate.includes('T')) {
        const timePart = sDate.split('T')[1];
        const matchT = timePart.match(/(\d{1,2}):(\d{1,2})/);
        if (matchT) {
          hour = String(matchT[1]).padStart(2, '0');
          minute = String(matchT[2]).padStart(2, '0');
        }
      } else if (sTime) {
        const matchTime = sTime.match(/(\d{1,2}):(\d{1,2})/);
        if (matchTime) {
          hour = String(matchTime[1]).padStart(2, '0');
          minute = String(matchTime[2]).padStart(2, '0');
        }
      }

      return {
        formattedDate: `${year}-${month}-${day}`,
        formattedTime: `${hour}:${minute}`,
        rawYMD: `${year}${month}${day}`,
        rawTime: `${hour}${minute}00`
      };
    }

    function buildAccurateGoogleCalendarUrl(title, dateStr, timeStr, details, locationStr, userEmail) {
      const p = parseScheduleDates(dateStr, timeStr);
      const isAllDay = !timeStr && !dateStr.includes('T') && !dateStr.includes(':');

      let datesParam = '';
      if (isAllDay) {
        const dt = new Date(parseInt(p.rawYMD.slice(0, 4), 10), parseInt(p.rawYMD.slice(4, 6), 10) - 1, parseInt(p.rawYMD.slice(6, 8), 10) + 1);
        const nextYMD = `${dt.getFullYear()}${String(dt.getMonth() + 1).padStart(2, '0')}${String(dt.getDate()).padStart(2, '0')}`;
        datesParam = `${p.rawYMD}/${nextYMD}`;
      } else {
        const startDT = `${p.rawYMD}T${p.rawTime}`;
        const endHour = String(Math.min(23, parseInt(p.formattedTime.split(':')[0], 10) + 1)).padStart(2, '0');
        const endMin = p.formattedTime.split(':')[1];
        const endDT = `${p.rawYMD}T${endHour}${endMin}00`;
        datesParam = `${startDT}/${endDT}`;
      }

      const params = new URLSearchParams({
        action: 'TEMPLATE',
        text: `[모동중] ${title || '업무 일정'}`,
        dates: datesParam,
        details: `${details || ''}\n\n(모동중 기술 교육 OS 연동)`,
        location: locationStr || '모동중학교',
        ctz: 'Asia/Seoul'
      });
      if (userEmail) params.append('add', userEmail);
      return `https://calendar.google.com/calendar/render?${params.toString()}`;
    }

    // 화면 크기에 맞춘 기본 배치 (자주 보는 것일수록 크게)
    //  ┌ 시계(작게)  ┬ 할 일(크게) ┬ AI 비서     ┬ 폴더    ┐
    //  └ 학교 정보   ┴ 캘린더      ┴ 단어장      ┴ 북마크  ┘
    // 남긴 위젯 4개 (나머지는 삭제하거나 따로 뺐음)
    //  ┌ 시계      ┬ 오늘 할 일   ┐
    //  └ 모동중 정보 ┴ 구글 캘린더 ┘
    const DEFAULT_WIDGETS = ['clock', 'tasks', 'school', 'gcal'];
    const LAYOUT_TOP = 60;      // 상단 바(52px) + 여백
    const LAYOUT_BOTTOM = 84;   // 하단 도구 막대 + 여백
    function calculateExactLayouts() {
      const sw = dashViewW() || 960;
      const sh = dashViewH() || 1080;
      const padX = 12, gap = 12;
      const top = LAYOUT_TOP;
      const availH = sh - top - LAYOUT_BOTTOM;
      const availW = sw - padX * 2 - gap;
      // 작업대 배치 (v3)
      //  ┌──────── 오늘 (시계 · 시간자 · 다음 수업) ────────┐
      //  ├── 작업 지시서(할 일) ──┬── 학교 정보 ───────────┤
      //  ├── 구글 캘린더 ─────────┤                        │
      //  └────────────────────────┴────────────────────────┘
      const fullW = sw - padX * 2;
      const hBand = Math.max(190, Math.min(320, Math.floor(availH * 0.34)));
      const yRest = top + hBand + gap, hRest = availH - hBand - gap;
      const wL = Math.floor((fullW - gap) * 0.54), wR = fullW - gap - wL;
      const xL = padX, xR = padX + wL + gap;
      const hTask = Math.floor((hRest - gap) * 0.56), hCal = hRest - gap - hTask;
      return {
        clock: { x: padX, y: top, width: fullW, height: hBand },
        tasks: { x: xL, y: yRest, width: wL, height: hTask },
        gcal: { x: xL, y: yRest + hTask + gap, width: wL, height: hCal },
        school: { x: xR, y: yRest, width: wR, height: hRest }
      };
    }

    // 저장해 둔 배치 불러오기 — 화면 크기가 바뀌었거나 화면 밖으로 나간 위젯이 있으면 기본 배치로
    function loadSavedLayouts() {
      try {
        const raw = localStorage.getItem('MODONG_WIDGET_LAYOUTS');
        if (!raw) return null;
        const all = JSON.parse(raw);
        const sw = dashViewW(), sh = dashViewH();
        // 모니터(해상도)마다 배치를 따로 기억한다 → 보조 모니터로 옮겨도 그 모니터용 배치가 그대로 나온다
        if (!all || all.v !== 3) return null;   // 예전 배치는 버리고 새 작업대 배치로 시작
        const obj = all && all.byRes ? all.byRes[`${sw}x${sh}`] : null;
        if (!obj || !obj.layouts) return null;
        const def = calculateExactLayouts();
        const out = {};
        for (const id of Object.keys(def)) {
          const l = obj.layouts[id];
          if (!l || [l.x, l.y, l.width, l.height].some(v => typeof v !== 'number' || !isFinite(v))) { out[id] = def[id]; continue; }
          if (l.x < -20 || l.y < 0 || l.x + 80 > sw || l.y + 60 > sh) { out[id] = def[id]; continue; }
          out[id] = l;
        }
        return out;
      } catch (e) { return null; }
    }
    function loadSavedActiveWidgets() {
      try {
        const arr = JSON.parse(localStorage.getItem('MODONG_ACTIVE_WIDGETS') || 'null');
        if (Array.isArray(arr) && arr.length > 0 && arr.every(id => DEFAULT_WIDGETS.includes(id))) return arr;
      } catch (e) {}
      return DEFAULT_WIDGETS.slice();
    }

    let globalAudioCtx = null;
    function getAudioCtx() {
      if (!globalAudioCtx) globalAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (globalAudioCtx.state === 'suspended') globalAudioCtx.resume();
      return globalAudioCtx;
    }

    function playBeepSound(freq = 700, dur = 0.04) {
      try {
        const ctx = getAudioCtx();
        const osc = ctx.createOscillator(), g = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        g.gain.setValueAtTime(0.25, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
        osc.connect(g); g.connect(ctx.destination);
        osc.start(); osc.stop(ctx.currentTime + dur);
      } catch (e) {}
    }

    function playChimeSound() {
      try {
        const ctx = getAudioCtx();
        [523.25, 659.25, 783.99, 1046.50].forEach((f, idx) => {
          const osc = ctx.createOscillator(), g = ctx.createGain();
          const t = ctx.currentTime + (idx * 0.16);
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(f, t);
          g.gain.setValueAtTime(0, t);
          g.gain.linearRampToValueAtTime(0.35, t + 0.04);
          g.gain.exponentialRampToValueAtTime(0.0001, t + 1.6);
          osc.connect(g); g.connect(ctx.destination);
          osc.start(t); osc.stop(t + 1.6);
        });
      } catch (e) {}
    }

    function playFanfareSound() {
      try {
        const ctx = getAudioCtx();
        const notes = [{ f: 523.25, d: 0.1, t: 0 }, { f: 659.25, d: 0.1, t: 0.1 }, { f: 783.99, d: 0.1, t: 0.2 }, { f: 1046.5, d: 0.45, t: 0.35 }];
        notes.forEach(n => {
          const osc = ctx.createOscillator(), g = ctx.createGain();
          const st = ctx.currentTime + n.t;
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(n.f, st);
          g.gain.setValueAtTime(0, st);
          g.gain.linearRampToValueAtTime(0.4, st + 0.02);
          g.gain.exponentialRampToValueAtTime(0.001, st + n.d);
          osc.connect(g); g.connect(ctx.destination);
          osc.start(st); osc.stop(st + n.d);
        });
      } catch (e) {}
    }

    function NoiseMeterMiniTool() {
      const [isListening, setIsListening] = useState(false);
      const [level, setLevel] = useState(0);
      const [peakLevel, setPeakLevel] = useState(0);
      const [errorMsg, setErrorMsg] = useState('');
      const audioCtxRef = useRef(null);
      const analyserRef = useRef(null);
      const streamRef = useRef(null);
      const rafRef = useRef(null);
      const dataArrayRef = useRef(null);

      const stopListening = useCallback(() => {
        if (rafRef.current) cancelAnimationFrame(rafRef.current);
        rafRef.current = null;
        if (streamRef.current) {
          streamRef.current.getTracks().forEach(t => t.stop());
          streamRef.current = null;
        }
        if (audioCtxRef.current) {
          try { audioCtxRef.current.close(); } catch (e) {}
          audioCtxRef.current = null;
        }
        analyserRef.current = null;
        dataArrayRef.current = null;
        setIsListening(false);
        setLevel(0);
        setPeakLevel(0);
      }, []);

      const tick = useCallback(() => {
        if (!analyserRef.current || !dataArrayRef.current) return;
        analyserRef.current.getByteTimeDomainData(dataArrayRef.current);
        let sumSquares = 0;
        for (let i = 0; i < dataArrayRef.current.length; i++) {
          const v = (dataArrayRef.current[i] - 128) / 128;
          sumSquares += v * v;
        }
        const rms = Math.sqrt(sumSquares / dataArrayRef.current.length);
        const pct = Math.max(0, Math.min(100, Math.round(Math.pow(rms, 0.55) * 150)));
        setLevel(pct);
        setPeakLevel(prev => Math.max(prev * 0.95, pct));
        rafRef.current = requestAnimationFrame(tick);
      }, []);

      const startListening = async () => {
        setErrorMsg('');
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          streamRef.current = stream;
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          audioCtxRef.current = ctx;
          const source = ctx.createMediaStreamSource(stream);
          const analyser = ctx.createAnalyser();
          analyser.fftSize = 1024;
          source.connect(analyser);
          analyserRef.current = analyser;
          dataArrayRef.current = new Uint8Array(analyser.fftSize);
          setIsListening(true);
          rafRef.current = requestAnimationFrame(tick);
        } catch (e) {
          setErrorMsg('마이크 접근이 거부되었거나 사용할 수 없습니다. 브라우저의 마이크 권한을 확인해 주세요.');
        }
      };

      useEffect(() => () => stopListening(), [stopListening]);

      const getZone = (pct) => {
        if (pct < 30) return { label: '🙂 조용해요', color: 'bg-emerald-500', text: 'text-emerald-300' };
        if (pct < 60) return { label: '😐 적당해요', color: 'bg-amber-500', text: 'text-amber-300' };
        if (pct < 80) return { label: '😬 시끄러워요', color: 'bg-orange-500', text: 'text-orange-300' };
        return { label: '🚨 너무 시끄러워요!', color: 'bg-rose-600', text: 'text-rose-300' };
      };
      const zone = getZone(level);

      return (
        <div className="flex flex-col items-center gap-4 py-3">
          {!isListening ? (
            <>
              <div className="text-6xl">🎙️</div>
              <button onClick={startListening} className="px-7 py-4 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black rounded-2xl text-base shadow-lg transition">
                측정 시작
              </button>
              {errorMsg && <div role="status" className="jv-msg jv-msg-ico jv-msg-err text-xs text-rose-400 text-center px-4">{errorMsg}</div>}
              <div className="text-xs text-slate-500 text-center px-6">마이크 권한을 허용하면 실시간 교실 소음 수준을 보여줍니다.<br/>측정한 소리는 저장·전송되지 않고 화면 표시에만 사용됩니다.</div>
            </>
          ) : (
            <>
              <div className={`jv-noise-label text-lg font-black ${zone.text}`} role="status">{zone.label}</div>
              <div className="w-full px-2">
                <div className="w-full h-8 bg-slate-900 rounded-full overflow-hidden border border-slate-700 relative">
                  <div className={`h-full ${zone.color} transition-all duration-100`} style={{ width: `${level}%` }} />
                  <div className="absolute top-0 h-full border-r-2 border-white/70" style={{ left: `${Math.min(100, peakLevel)}%` }} />
                </div>
                <div className="flex justify-between text-[11px] text-slate-500 mt-1.5">
                  <span>조용</span><span>보통</span><span>시끄러움</span><span>매우 시끄러움</span>
                </div>
              </div>
              <button onClick={stopListening} className="px-6 py-3 bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm font-bold rounded-2xl border border-slate-700">
                측정 중지
              </button>
            </>
          )}
        </div>
      );
    }

    function WhiteboardMiniTool() {
      const canvasRef = useRef(null);
      const containerRef = useRef(null);
      const isDrawingRef = useRef(false);
      const lastPosRef = useRef({ x: 0, y: 0 });
      const [color, setColor] = useState('#111827');
      const [brushSize, setBrushSize] = useState(4);
      const [isEraser, setIsEraser] = useState(false);

      const PAPER_BG = '#fdf8ee';
      const COLORS = ['#111827', '#dc2626', '#2563eb', '#16a34a', '#d97706', '#7c3aed'];

      const fillBackground = () => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = PAPER_BG;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      };

      useEffect(() => { fillBackground(); }, []);

      const getPos = (e) => {
        const canvas = canvasRef.current;
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        return { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY };
      };

      const handlePointerDown = (e) => {
        e.preventDefault();
        isDrawingRef.current = true;
        lastPosRef.current = getPos(e);
        try { e.target.setPointerCapture(e.pointerId); } catch (err) {}
      };

      const handlePointerMove = (e) => {
        if (!isDrawingRef.current) return;
        e.preventDefault();
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        const pos = getPos(e);
        ctx.strokeStyle = isEraser ? PAPER_BG : color;
        ctx.lineWidth = isEraser ? brushSize * 4 : brushSize;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.moveTo(lastPosRef.current.x, lastPosRef.current.y);
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
        lastPosRef.current = pos;
      };

      const handlePointerUp = () => { isDrawingRef.current = false; };
      const handleClear = () => fillBackground();

      return (
        <div ref={containerRef} className="flex flex-col h-full gap-2">
          <div className="flex items-center gap-1.5 flex-shrink-0 flex-wrap">
            {COLORS.map(c => (
              <button
                key={c}
                onClick={() => { setColor(c); setIsEraser(false); }}
                aria-pressed={!isEraser && color === c}
                aria-label="펜 색"
                className={`jv-swatch w-6 h-6 rounded-full border-2 transition ${!isEraser && color === c ? 'border-amber-300 scale-110' : 'border-slate-700'}`}
                style={{ backgroundColor: c }}
              />
            ))}
            <div className="w-px h-6 bg-slate-700 mx-1" />
            {[2, 4, 8].map(s => (
              <button
                key={s}
                onClick={() => setBrushSize(s)}
                aria-pressed={brushSize === s}
                aria-label={`굵기 ${s}`}
                className={`jv-wbtool w-7 h-7 rounded-lg flex items-center justify-center border transition ${brushSize === s ? 'border-amber-400 bg-slate-800' : 'border-slate-700'}`}
              >
                <span className="rounded-full bg-slate-300 block" style={{ width: s + 2, height: s + 2 }} />
              </button>
            ))}
            <button
              onClick={() => setIsEraser(!isEraser)}
              aria-pressed={isEraser}
              className={`jv-wbtool px-2.5 py-1.5 rounded-lg text-xs font-bold border transition ${isEraser ? 'border-amber-400 bg-slate-800 text-amber-300' : 'border-slate-700 text-slate-400'}`}
            >
              🧽 지우개
            </button>
            <button
              onClick={handleClear}
              className="jv-wbtool ml-auto px-2.5 py-1.5 rounded-lg text-xs font-bold bg-slate-800 hover:bg-rose-900/60 text-slate-300 hover:text-rose-300 border border-slate-700 transition"
            >
              전체 지우기
            </button>
          </div>

          <div className="flex-1 min-h-0 rounded-xl overflow-hidden border border-slate-700">
            <canvas
              ref={canvasRef}
              width={1400}
              height={800}
              style={{ touchAction: 'none' }}
              className="w-full h-full cursor-crosshair"
              onPointerDown={handlePointerDown}
              onPointerMove={handlePointerMove}
              onPointerUp={handlePointerUp}
              onPointerLeave={handlePointerUp}
            />
          </div>
        </div>
      );
    }

    // ------------------------------------------------------------------ 🏫 학교 정보(NEIS) 연결 설정

    // 대시보드 코드(index.html)에는 키를 적지 않는다. 화면에도 키 전체는 다시 보여 주지 않는다.
    const NEIS_EVENT = 'neis-config-changed';
    function useNeisConfig() {
      const [cfg, setCfg] = useState(null);
      useEffect(() => {
        let alive = true;
        const load = () => dApiFetch('/api/neis/config').then(r => r.json()).then(d => { if (alive && d && d.success) setCfg(d); }).catch(() => {});

        window.addEventListener(NEIS_EVENT, load);
        return () => { alive = false; window.removeEventListener(NEIS_EVENT, load); };

        setSearching(true); setMsg({ type: '', text: '' });
        try {
          const d = await (await dApiFetch(`/api/neis/search?name=${encodeURIComponent(q.trim())}`)).json();
          if (!d.success) { setRows([]); setMsg({ type: 'err', text: d.error || '찾지 못했어요.' }); }
          else { setRows(d.rows || []); if (!d.rows || !d.rows.length) setMsg({ type: 'err', text: d.note || '그 이름의 학교를 찾지 못했어요.' }); }
        } catch (e) { setRows([]); setMsg({ type: 'err', text: 'NEIS에 연결하지 못했어요. 인터넷을 확인해 주세요.' }); }
        setSearching(false);
      };
      const pick = (r) => { setOffice(r.office); setSchool(r.school); setName(r.name); setRegion(r.region || ''); setRows(null); setMsg({ type: 'ok', text: `${r.name}을(를) 골랐어요. 아래 [저장]을 눌러야 바뀌어요.` }); };

      const save = async (extra = {}) => {
        setBusy(true); setMsg({ type: '', text: '' });
        try {
          const body = { office: office.trim().toUpperCase(), school: school.trim(), name: name.trim(), region: region.trim(), ...extra };
          if (keyDraft.trim() && !extra.clearKey) body.apiKey = keyDraft.trim();
          const res = await dApiFetch('/api/neis/config', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
          const d = await res.json();
          if (!d.success) { setMsg({ type: 'err', text: d.error || '저장하지 못했어요.' }); setBusy(false); return; }
          setKeyDraft(''); setShowKey(false); setName(d.name || '');
          window.dispatchEvent(new Event(NEIS_EVENT));
          if (d.warning) setMsg({ type: 'warn', text: d.warning });
          else setMsg({ type: 'ok', text: extra.clearKey ? '인증키를 지웠어요.' : '저장했어요. 학교 정보 위젯을 새로 불러와요.' });
          onShowToast && onShowToast(extra.clearKey ? '🏫 NEIS 인증키를 지웠어요' : `🏫 ${d.name || '학교'} 정보로 저장했어요`);
        } catch (e) { setMsg({ type: 'err', text: '저장하지 못했어요. 대시보드 프로그램이 켜져 있는지 확인해 주세요.' }); }
        setBusy(false);
      };

      const tablet = !!window.__TABLET_APP__;
      const msgCls = msg.type === 'err' ? 'text-rose-300' : msg.type === 'warn' ? 'text-amber-300' : 'text-emerald-300';
      return (
        <div className="jv-scrim fixed inset-0 z-[10016] bg-black/80 backdrop-blur-md flex items-center justify-center p-4" onPointerDown={(e) => { if (e.target === e.currentTarget) onClose(); }}>
          <div role="dialog" aria-modal="true" aria-labelledby="neis-title" className="jv-dialog w-[600px] max-w-full max-h-[92vh] overflow-y-auto custom-scroll bg-slate-950 border border-sky-500/70 rounded-3xl p-5 sm:p-6 shadow-2xl flex flex-col gap-5 select-text">
            <div className="jv-dialog-head flex items-center justify-between pb-3 border-b border-slate-800">
              <h3 id="neis-title" className="text-lg font-black text-slate-100">🏫 학교 정보(NEIS) 연결</h3>
              <button onClick={onClose} className="jv-btn-ghost px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm font-bold">닫기</button>
            </div>

            <section className="flex flex-col gap-2">
              <div className="jv-sec text-sm font-black text-slate-200">1. 우리 학교 고르기</div>
              <div className="text-sm text-slate-300">
                지금: <b className="text-sky-300">{cfg ? (cfg.region ? `${cfg.region} ` : '') + (cfg.name || '정해지지 않음') : '불러오는 중…'}</b>
                {cfg && <span className="text-slate-500"> (교육청 {cfg.office} · 학교 {cfg.school})</span>}
              </div>
              <div className="flex gap-2">
                <input value={q} onChange={(e) => setQ(e.target.value)} onKeyDown={(e) => { if (e.key === 'Enter') search(); }}
                  placeholder="학교 이름으로 찾기 (예: 모동중)" aria-label="학교 이름"
                  className="flex-1 min-w-0 bg-slate-900 border border-slate-700 focus:border-sky-400 rounded-xl px-3 py-2.5 text-sm text-slate-100 outline-none" />
                <button onClick={search} disabled={searching} className="jv-btn-primary px-4 py-2.5 rounded-xl bg-sky-600 hover:bg-sky-500 text-white text-sm font-bold disabled:opacity-60 whitespace-nowrap">{searching ? '찾는 중…' : '찾기'}</button>
              </div>
              {rows && rows.length > 0 && (
                <div className="max-h-48 overflow-y-auto custom-scroll flex flex-col gap-1 rounded-xl border border-slate-800 p-1">
                  {rows.map(r => (
                    <button key={r.office + r.school} onClick={() => pick(r)} className="text-left px-3 py-2 rounded-lg hover:bg-slate-800">
                      <div className="text-sm font-bold text-slate-100">{r.name} <span className="text-xs text-slate-400 font-normal">{r.region} · {r.kind}</span></div>
                      <div className="text-xs text-slate-500 truncate">{r.addr}</div>
                    </button>
                  ))}
                </div>
              )}
              <details className="text-xs text-slate-400">
                <summary className="cursor-pointer py-1">코드를 직접 넣기</summary>
                <div className="mt-2 grid grid-cols-1 sm:grid-cols-3 gap-2">
                  <label className="flex flex-col gap-1">교육청 코드<input value={office} onChange={(e) => setOffice(e.target.value)} placeholder="C10" className="bg-slate-900 border border-slate-700 rounded-lg px-2 py-1.5 text-sm text-slate-100 outline-none" /></label>
                  <label className="flex flex-col gap-1">학교 코드<input value={school} onChange={(e) => setSchool(e.target.value)} placeholder="7201026" className="bg-slate-900 border border-slate-700 rounded-lg px-2 py-1.5 text-sm text-slate-100 outline-none" /></label>
                  <label className="flex flex-col gap-1">학교 이름<input value={name} onChange={(e) => setName(e.target.value)} placeholder="모동중학교" className="bg-slate-900 border border-slate-700 rounded-lg px-2 py-1.5 text-sm text-slate-100 outline-none" /></label>
                </div>
              </details>
            </section>

            <section className="flex flex-col gap-2">
              <div className="jv-sec text-sm font-black text-slate-200">2. NEIS 인증키</div>
              <div className="text-sm">
                {cfg && cfg.hasKey
                  ? <span className="text-emerald-300 font-bold">✔ 저장된 키 있음 <span className="font-mono text-slate-400 font-normal">({cfg.masked})</span></span>
                  : <span className="text-amber-300 font-bold">아직 키가 없어요 — 키가 없으면 시간표가 5교시까지만 보여요</span>}
              </div>
              {cfg && cfg.keyFromEnv ? (
                <div className="text-xs text-slate-400">이 PC는 윈도우 환경변수(NEIS_API_KEY)에 넣은 키를 쓰고 있어서 여기서 바꿀 수 없어요.</div>
              ) : (
                <>
                  <div className="flex gap-2">
                    <input type={showKey ? 'text' : 'password'} value={keyDraft} onChange={(e) => setKeyDraft(e.target.value)}
                      placeholder={cfg && cfg.hasKey ? '새 키로 바꿀 때만 붙여 넣기' : 'NEIS 오픈API 인증키 붙여 넣기'} aria-label="NEIS 인증키"
                      autoComplete="off" spellCheck={false}
                      className="flex-1 min-w-0 bg-slate-900 border border-slate-700 focus:border-sky-400 rounded-xl px-3 py-2.5 text-sm text-slate-100 font-mono outline-none" />
                    <button onClick={() => setShowKey(v => !v)} className="jv-btn-ghost px-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold whitespace-nowrap">{showKey ? '가리기' : '보기'}</button>
                  </div>
                  <div className="text-xs text-slate-500 leading-relaxed">
                    키는 open.neis.go.kr → 마이페이지 → 인증키 발급에서 받아요.
                    {tablet ? ' 이 키는 이 갤탭 안에만 저장돼요.' : ' 이 키는 프로그램 폴더의 config.json 에만 저장되고, 대시보드 코드나 구글 시트에는 들어가지 않아요.'}
                  </div>
                </>
              )}
            </section>

            <div className="flex flex-wrap items-center gap-2 pt-3 border-t border-slate-800">
              <button onClick={() => save()} disabled={busy || !cfg} className="jv-btn-primary px-6 py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 text-sm font-black disabled:opacity-60">{busy ? '확인하는 중…' : '저장'}</button>
              {cfg && cfg.hasKey && !cfg.keyFromEnv && (
                <button onClick={() => save({ clearKey: true })} disabled={busy} className="jv-btn-ghost px-4 py-2.5 rounded-xl bg-slate-800 hover:bg-rose-900/70 text-slate-300 text-sm font-bold">키 지우기</button>
              )}
              <span role="status" className={`jv-msg jv-msg-ico jv-msg-${msg.type || 'none'} text-sm font-bold ${msgCls} min-w-0`}>{msg.text}</span>
            </div>
          </div>
        </div>
      );
    }

    function SchoolInfoWidget({ onCloseWidget, onShowToast, onDragStart, isLocked }) {
      const [tab, setTab] = useState('schedule');
      const [currentDate, setCurrentDate] = useState(() => new Date());
      const [loading, setLoading] = useState(false);
      const [neisError, setNeisError] = useState('');
      
      const [selectedGrade, setSelectedGrade] = useState('2');
      const [selectedClass, setSelectedClass] = useState('1');
      const neisCfg = useNeisConfig();
      const [cfgTick, setCfgTick] = useState(0);
      useEffect(() => {
        const bump = () => setCfgTick(t => t + 1);
        window.addEventListener(NEIS_EVENT, bump);
        return () => window.removeEventListener(NEIS_EVENT, bump);
      }, []);
      const schoolShort = neisCfg ? (neisCfg.name || '학교').replace(/학교$/, '') : '학교';

      const [meals, setMeals] = useState(null);
      const [todaySchedules, setTodaySchedules] = useState([]);
      const [upcomingSchedule, setUpcomingSchedule] = useState(null);
      const [timetable, setTimetable] = useState([]);

      const formatDateYMD = (d) => {
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${y}${m}${day}`;
      };

      const getExpectedPeriodCount = (d) => {
        const dow = d.getDay();
        if (dow === 1 || dow === 3 || dow === 5) return 6;
        if (dow === 2 || dow === 4) return 7;
        return 0;
      };

      const fetchNeisData = useCallback(async (targetD, grade, classNm) => {
        setLoading(true);
        const errs = [];
        const noteErr = (j) => { if (j && (j._error || j._warning)) errs.push(j._error || j._warning); };
        const ymd = formatDateYMD(targetD);
        const year = targetD.getFullYear();
        const month = String(targetD.getMonth() + 1).padStart(2, '0');

        try {
          const mealRes = await dApiFetch(`/api/neis/meal?date=${ymd}`);
          const mealJson = await mealRes.json(); noteErr(mealJson);
          if (mealJson.mealServiceDietInfo?.[1]?.row?.[0]) {
            const row = mealJson.mealServiceDietInfo[1].row[0];
            const cleanDish = row.DDISH_NM.replace(/<br\/>/g, '\n').replace(/\([0-9.]+\)/g, '').split('\n').map(s => s.trim()).filter(Boolean);
            setMeals({
              menu: cleanDish,
              cal: row.CAL_INFO || '정보 없음',
              origin: row.ORPLC_INFO ? row.ORPLC_INFO.replace(/<br\/>/g, ', ') : '국내산 식자재 준수'
            });
          } else {
            setMeals(null);
          }
        } catch (e) {
          setMeals(null);
        }

        try {
          const fromYmd = `${year}${month}01`;
          const toYmd = `${year}${month}31`;
          const schRes = await dApiFetch(`/api/neis/schedule?from_ymd=${fromYmd}&to_ymd=${toYmd}`);
          const schJson = await schRes.json(); noteErr(schJson);
          if (schJson.SchoolSchedule?.[1]?.row) {
            const allRows = schJson.SchoolSchedule[1].row;
            const matchToday = allRows.filter(r => r.AA_YMD === ymd);
            setTodaySchedules(matchToday);

            const nextUpcoming = allRows.find(r => r.AA_YMD > ymd);
            if (nextUpcoming) {
              setUpcomingSchedule({
                date: `${nextUpcoming.AA_YMD.slice(4,6)}월 ${nextUpcoming.AA_YMD.slice(6,8)}일`,
                event: nextUpcoming.EVENT_NM
              });
            } else {
              setUpcomingSchedule(null);
            }
          } else {
            setTodaySchedules([]);
            setUpcomingSchedule(null);
          }
        } catch (e) {
          setTodaySchedules([]);
          setUpcomingSchedule(null);
        }

        const expectedPeriods = getExpectedPeriodCount(targetD);
        try {
          const ttRes = await dApiFetch(`/api/neis/timetable?date=${ymd}&grade=${grade}&class=${classNm}`);
          const ttJson = await ttRes.json(); noteErr(ttJson);

          if (expectedPeriods === 0) {
            setTimetable([]);
          } else if (ttJson.misTimetable?.[1]?.row?.length) {
            const byPeriod = {};
            ttJson.misTimetable[1].row.forEach(r => {
              byPeriod[parseInt(r.PERIO, 10)] = r.ITRT_CNTNT;
            });
            const maxPeriodInData = Math.max(expectedPeriods, ...Object.keys(byPeriod).map(Number));
            const rows = [];
            for (let p = 1; p <= maxPeriodInData; p++) {
              rows.push({
                period: `${p}교시`,
                subject: byPeriod[p] || (ttJson._limited ? '(인증키 문제로 못 받음)' : '(NEIS 미등록 교시)')
              });
            }
            setTimetable(rows);
          } else {
            const placeholderTimetable = Array.from({ length: expectedPeriods }, (_, i) => ({
              period: `${i + 1}교시`,
              subject: 'NEIS 시간표 미공개'
            }));
            setTimetable(placeholderTimetable);
          }
        } catch (e) {
          setTimetable([]);
          errs.push('대시보드 서버에 연결하지 못했어요');
        }

        setNeisError(errs[0] || '');
        setLoading(false);
      }, []);

      useEffect(() => {
        fetchNeisData(currentDate, selectedGrade, selectedClass);
      }, [currentDate, selectedGrade, selectedClass, fetchNeisData, cfgTick]);

      const changeDay = (offset) => {
        const next = new Date(currentDate);
        next.setDate(next.getDate() + offset);
        setCurrentDate(next);
      };

      const setToday = () => {
        setCurrentDate(new Date());
      };

      const dateDisplay = currentDate.toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'short' });

      return (
        <div className="flex flex-col h-full justify-between select-none">
          <div className="flex items-center justify-between pb-2 border-b border-slate-700/60 flex-shrink-0">
            <div className="flex items-center gap-2">
              <span onPointerDown={onDragStart} className={`drag-handle text-xs px-2 py-1 rounded bg-slate-900/80 border border-slate-800 transition ${isLocked ? 'opacity-40 cursor-not-allowed text-slate-600' : 'text-slate-300 hover:text-amber-300'}`}>⠿ 이동</span>
              <span className="wb-title font-bold text-sky-300 text-sm flex items-center gap-1.5">
                <i className="fa-solid fa-school text-sky-400"></i>
                <span>{schoolShort} 정보</span>
              </span>
            </div>
            <div className="flex items-center gap-1.5">
              <div className="jv-seg flex flex-shrink-0 whitespace-nowrap bg-slate-900/90 rounded-lg p-0.5 border border-slate-800 text-[11px]" role="group" aria-label="학교 정보 보기">
                <button onClick={() => setTab('schedule')} aria-pressed={tab === 'schedule'} className={`px-2 py-0.5 rounded font-bold transition ${tab === 'schedule' ? 'bg-sky-600 text-white' : 'text-slate-400 hover:text-slate-200'}`}>학사일정</button>
                <button onClick={() => setTab('meal')} aria-pressed={tab === 'meal'} className={`px-2 py-0.5 rounded font-bold transition ${tab === 'meal' ? 'bg-sky-600 text-white' : 'text-slate-400 hover:text-slate-200'}`}>급식</button>
                <button onClick={() => setTab('timetable')} aria-pressed={tab === 'timetable'} className={`px-2 py-0.5 rounded font-bold transition ${tab === 'timetable' ? 'bg-sky-600 text-white' : 'text-slate-400 hover:text-slate-200'}`}>시간표</button>
              </div>
              {onCloseWidget && (
                <button onClick={onCloseWidget} title="위젯 숨기기" className="widget-close w-6 h-6 rounded hover:bg-rose-900/60 text-slate-400 hover:text-rose-300 text-sm flex items-center justify-center">✕</button>
              )}
            </div>
          </div>

          <div className="flex items-center justify-between py-1 px-1 bg-slate-950/40 rounded-xl my-1 border border-slate-800/80 text-xs">
            <button onClick={() => changeDay(-1)} className="px-2 py-0.5 rounded hover:bg-slate-800 text-slate-300 text-[11px]">◀ 이전</button>
            <div className="flex items-center gap-2">
              <span className="font-bold text-amber-200 font-mono">{dateDisplay}</span>
              <button onClick={setToday} className="px-1.5 py-0.2 bg-slate-800 hover:bg-slate-700 text-sky-300 rounded text-[10px] font-bold">오늘</button>
            </div>
            <button onClick={() => changeDay(1)} className="px-2 py-0.5 rounded hover:bg-slate-800 text-slate-300 text-[11px]">다음 ▶</button>
          </div>

          {neisError && (
            <div role="status" className="jv-alert mb-1 px-2.5 py-1.5 rounded-xl bg-rose-950/80 border border-rose-700/70 text-[11px] text-rose-200 leading-snug break-all">
              ⚠️ NEIS: {neisError}
            </div>
          )}
          {tab === 'timetable' && (
            <div className="flex items-center justify-between px-2.5 py-1 bg-slate-900/80 rounded-xl border border-sky-800/40 mb-1 text-xs">
              <span className="font-bold text-sky-300 flex items-center gap-1">
                <i className="fa-solid fa-chalkboard"></i>
                <span>조회 기준:</span>
              </span>
              <div className="flex items-center gap-2">
                <select
                  value={selectedGrade}
                  onChange={(e) => setSelectedGrade(e.target.value)}
                  className="bg-slate-950 text-amber-300 border border-slate-700 rounded-lg px-2 py-0.5 font-bold outline-none cursor-pointer"
                >
                  <option value="1">1학년</option>
                  <option value="2">2학년 (메인)</option>
                  <option value="3">3학년</option>
                </select>
                <select
                  value={selectedClass}
                  onChange={(e) => setSelectedClass(e.target.value)}
                  className="bg-slate-950 text-sky-300 border border-slate-700 rounded-lg px-2 py-0.5 font-bold outline-none cursor-pointer"
                >
                  <option value="1">1반 (기본)</option>
                  <option value="2">2반</option>
                  <option value="3">3반</option>
                  <option value="4">4반</option>
                </select>
              </div>
            </div>
          )}

          <div className="flex-1 overflow-y-auto custom-scroll pr-1 my-1">
            {loading ? (
              <div className="jv-loading h-full flex flex-col items-center justify-center text-sky-300 gap-2 text-xs py-8">
                <i className="fa-solid fa-circle-notch fa-spin text-lg"></i>
                <span>나이스(NEIS) 데이터를 동기화하는 중...</span>
              </div>
            ) : (
              <>
                {tab === 'schedule' && (
                  <div className="h-full flex flex-col justify-between py-1">
                    {todaySchedules.length > 0 ? (
                      <div className="flex-1 flex flex-col justify-center items-center text-center p-3 bg-slate-900/80 rounded-2xl border border-amber-500/50 shadow-inner">
                        <span className="text-xs px-2.5 py-0.5 rounded-full bg-amber-500/20 text-amber-300 font-bold border border-amber-500/30 mb-2">
                          📌 해당 일자 학사 일정
                        </span>
                        {todaySchedules.map((sc, i) => (
                          <div key={i} className="my-1">
                            <h3 className="text-xl font-black text-amber-300 leading-tight">
                              {sc.EVENT_NM}
                            </h3>
                            <div className="text-xs text-slate-300 mt-1 font-medium">
                              대상: <span className="text-sky-300 font-bold">{sc.SBTR_DD_SC_NM || '전교생'}</span>
                            </div>
                          </div>
                        ))}
                      </div>
                    ) : (
                      <div className="flex-1 flex flex-col justify-center items-center text-center p-3 bg-slate-900/50 rounded-2xl border border-slate-800">
                        <i className="fa-regular fa-calendar-check text-3xl text-slate-500 mb-2"></i>
                        <h4 className="text-base font-black text-slate-200">
                          해당 일자 공식 행사 없음
                        </h4>
                        <p className="text-xs text-slate-400 mt-1">정규 교육과정 수업일입니다.</p>
                      </div>
                    )}

                    {upcomingSchedule && (
                      <div className="mt-2 p-2 bg-slate-950/70 rounded-xl border border-slate-800 flex items-center justify-between text-xs">
                        <span className="text-slate-400">📅 다음 예정 학사일정</span>
                        <div className="flex items-center gap-1.5 font-bold">
                          <span className="text-sky-300 font-mono">{upcomingSchedule.date}</span>
                          <span className="text-slate-200 truncate max-w-[140px]">{upcomingSchedule.event}</span>
                        </div>
                      </div>
                    )}
                  </div>
                )}

                {tab === 'meal' && (
                  <div className="space-y-2">
                    {meals ? (
                      <>
                        <div className="flex items-center justify-between bg-slate-900/80 px-2.5 py-1.5 rounded-xl border border-slate-800 text-xs">
                          <span className="text-amber-300 font-bold">🍱 오늘의 식단</span>
                          <span className="text-[11px] font-mono text-slate-400">{meals.cal}</span>
                        </div>
                        <div className="grid grid-cols-2 gap-1.5">
                          {meals.menu.map((m, i) => (
                            <div key={i} className="p-2 rounded-xl bg-slate-900/60 border border-slate-800 text-xs text-slate-200 font-medium flex items-center gap-1.5">
                              <span className="text-amber-400 text-[10px]">●</span>
                              <span className="truncate">{m}</span>
                            </div>
                          ))}

    function formatGcalEventTime(ev) {
      if (!ev.start) return '';
      if (ev.allDay) {
        const d = new Date(ev.start + 'T00:00:00');
        return d.toLocaleDateString('ko-KR', { month: 'numeric', day: 'numeric', weekday: 'short' }) + ' (종일)';
      }
      const d = new Date(ev.start);
      const dateStr = d.toLocaleDateString('ko-KR', { month: 'numeric', day: 'numeric', weekday: 'short' });
      const timeStr = d.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', hour12: false });
      return `${dateStr} ${timeStr}`;
    }

    function TimerMiniTool({ onChime, onBeep }) {
      const [totalSec, setTotalSec] = useState(180);
      const [remSec, setRemSec] = useState(180);
      const [isRunning, setIsRunning] = useState(false);
      const timerRef = useRef(null);

      const fmt = (s) => `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
      const setPreset = (s) => {
        clearInterval(timerRef.current);
        setIsRunning(false);
        setTotalSec(s); setRemSec(s);
        onBeep(600);
      };
      const toggleTimer = () => {
        if (isRunning) {
          clearInterval(timerRef.current);
          setIsRunning(false);
        } else {
          let curr = remSec <= 0 ? totalSec : remSec;
          setRemSec(curr);
          setIsRunning(true);
          timerRef.current = setInterval(() => {
            setRemSec(prev => {
              if (prev <= 1) {
                clearInterval(timerRef.current);
                setIsRunning(false);
                onChime();
                return 0;
              }
              if (prev <= 6 && prev > 1) onBeep(900);
              return prev - 1;
            });
          }, 1000);
        }
      };
      const resetTimer = () => {
        clearInterval(timerRef.current);
        setIsRunning(false);
        setRemSec(totalSec);
        onBeep(450);
      };
      useEffect(() => () => clearInterval(timerRef.current), []);
      return (
        <div className="flex flex-col items-center gap-3.5 py-3">
          <div className="jv-bignum font-mono text-7xl font-black text-amber-400 leading-none" role="timer">{fmt(remSec)}</div>
          <div className="grid grid-cols-4 gap-3 w-full mt-2">
            {[60, 180, 300, 600].map(sec => (
              <button key={sec} onClick={() => setPreset(sec)} className="py-3 bg-slate-900 hover:bg-slate-800 text-sm font-bold text-slate-200 rounded-xl border border-slate-800">{sec/60}분</button>
            ))}
          </div>
          <div className="flex gap-3 w-full mt-3">
            <button onClick={toggleTimer} className={`flex-1 py-4 rounded-2xl text-base font-black shadow-lg transition ${isRunning ? 'bg-rose-600 text-white' : 'bg-amber-500 text-slate-950'}`}>{isRunning ? '일시정지' : '시작'}</button>
            <button onClick={resetTimer} className="px-7 py-4 bg-slate-800 text-slate-200 text-sm font-bold rounded-2xl border border-slate-700">초기화</button>
          </div>
        </div>
      );
    }

    function StopwatchMiniTool({ onBeep }) {
      const [elapsed, setElapsed] = useState(0);
      const [isRunning, setIsRunning] = useState(false);
      const [laps, setLaps] = useState([]);
      const swRef = useRef(null);
      const startRef = useRef(0);

      const fmtSw = (ms) => {
        const m = Math.floor(ms/60000), s = Math.floor((ms%60000)/1000), c = Math.floor((ms%1000)/10);
        return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${String(c).padStart(2,'0')}`;
      };

      const toggleSw = () => {
        if (isRunning) {
          clearInterval(swRef.current);
          setIsRunning(false);
        } else {
          setIsRunning(true);
          startRef.current = Date.now() - elapsed;
          swRef.current = setInterval(() => setElapsed(Date.now() - startRef.current), 50);
        }
      };
      const recordLap = () => { if (isRunning) { setLaps(prev => [elapsed, ...prev]); onBeep(1000); } };
      const resetSw = () => { clearInterval(swRef.current); setIsRunning(false); setElapsed(0); setLaps([]); onBeep(450); };
      useEffect(() => () => clearInterval(swRef.current), []);
      return (
        <div className="flex flex-col items-center gap-3.5 py-3">
          <div className="jv-bignum font-mono text-7xl font-black text-emerald-400 leading-none" role="timer">{fmtSw(elapsed)}</div>
          <div className="w-full h-64 overflow-y-auto custom-scroll bg-slate-900/90 rounded-2xl p-3.5 border border-slate-800 space-y-2">

    function PickerMiniTool({ onFanfare, onTick, onToast, onSendToStudent, studentOpen }) {
      const [toStudent, setToStudent] = useState(true);
      const [startNum, setStartNum] = useState(1);
      const [endNum, setEndNum] = useState(30);
      const [winner, setWinner] = useState('?');
      const [isRolling, setIsRolling] = useState(false);
      const [history, setHistory] = useState([]);

      const rollWinner = () => {
        if (isRolling) return;
        const s = parseInt(startNum, 10) || 1, e = parseInt(endNum, 10) || 30;
        let pool = [];
        for (let i = s; i <= e; i++) { if (!history.includes(i)) pool.push(i); }
        if (pool.length === 0) { onToast('⚠️ 모든 번호가 추첨되었습니다.'); return; }
        setIsRolling(true);
        // 결과를 먼저 정하고, 학생 화면도 같은 시간만큼 돌다가 같은 번호에서 멈추게 보낸다
        const finalPick = pool[Math.floor(Math.random() * pool.length)];
        const totalMs = 2516;   // 아래 18단계 애니메이션 길이(52+64+…+244)
        if (toStudent && onSendToStudent) onSendToStudent({ n: finalPick, from: s, to: e, at: Date.now(), dur: totalMs, history: [finalPick, ...history] });
        let count = 0, speed = 40;
        function step() {
          setWinner(pool[Math.floor(Math.random() * pool.length)]);
          onTick(600 + (count * 25), 0.03);
          count++;
          if (count < 18) { speed += 12; setTimeout(step, speed); }
          else {
            const finalWin = finalPick;
            setWinner(finalWin);
            setHistory(prev => [finalWin, ...prev]);
            onFanfare();
            setIsRolling(false);
          }
        }
        step();
      };

      return (
        <div className="flex flex-col items-center gap-4 py-3">
          <div className="grid grid-cols-2 gap-3 w-full">
            <input type="number" aria-label="시작 번호" value={startNum} onChange={(e) => setStartNum(e.target.value)} className="bg-slate-900 px-4 py-3 rounded-xl border border-slate-800 font-bold text-white text-sm outline-none" placeholder="시작 번호" />
            <input type="number" aria-label="끝 번호" value={endNum} onChange={(e) => setEndNum(e.target.value)} className="bg-slate-900 px-4 py-3 rounded-xl border border-slate-800 font-bold text-white text-sm outline-none" placeholder="끝 번호" />
          </div>
          <div className="w-full py-12 bg-slate-900/90 rounded-2xl border-2 border-pink-500/50 text-center flex flex-col items-center justify-center">
            <div className="jv-bignum jv-bignum-xl font-mono text-9xl font-black text-pink-400 leading-none" aria-live="polite">{winner}</div>
            <span className="text-xs text-pink-300 font-bold mt-4 tracking-widest uppercase">Lucky Number</span>
          </div>
          <button onClick={rollWinner} disabled={isRolling} className="w-full py-4 bg-pink-500 hover:bg-pink-400 text-slate-950 text-base font-black rounded-2xl shadow-xl transition">
            🎲 발표자 번호 추첨하기
          </button>
          {onSendToStudent && (
            <label className="flex items-center gap-2 text-sm font-bold text-slate-300 cursor-pointer select-none">
              <input type="checkbox" checked={toStudent} onChange={(e) => setToStudent(e.target.checked)} className="w-4 h-4 accent-pink-500" />
              📺 학생 화면에도 보이기 {studentOpen ? <span className="text-emerald-300 text-xs">(켜져 있음)</span> : <span className="text-slate-500 text-xs">(학생 화면 꺼짐)</span>}
            </label>
          )}
        </div>
      );
    }

    function GroupMiniTool({ onBeep, onToast, onSendToStudent }) {
      const [totalStu, setTotalStu] = useState(28);
      const [groupCnt, setGroupCnt] = useState(6);
      const [groups, setGroups] = useState([]);

      const generate = () => {
        const tot = parseInt(totalStu, 10) || 28, numGrp = parseInt(groupCnt, 10) || 6;
        if (tot < numGrp) { onToast('⚠️ 학생 수가 모둠 수보다 커야 합니다.'); return; }
        let arr = Array.from({ length: tot }, (_, i) => `${i + 1}번`);
        for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }
        const res = Array.from({ length: numGrp }, () => []);
        arr.forEach((item, idx) => res[idx % numGrp].push(item));
        setGroups(res);
        onBeep(700, 0.08);

        groups.forEach((g, i) => { txt += `■ ${i + 1}모둠 (${g.length}명): ${g.join(', ')}\n`; });
        safeCopyToClipboard(txt, () => onToast('📋 모둠 편성 결과가 복사되었습니다!'));
