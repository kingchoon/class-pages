<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>모동중 기술 교육 OS</title>
  <!--
    📲 갤탭 앱 모드
    - 이 파일을 교무실 PC 프로그램(127.0.0.1)이 아니라 인터넷 주소(https://…)로 열면 '갤탭 앱 모드'가 된다.
    - PC 프로그램(run.pyw)이 해 주던 일(/api/…)을 이 화면 안에서 대신 처리한다.
      · 데이터 저장: 갤탭 안(localStorage) + 구글 시트 동기화(원래 있던 기능)로 PC와 같은 데이터를 쓴다.
      · 급식·시간표·학사일정(NEIS), 제미나이, 유튜브: 갤탭이 직접 불러온다.
      · 폴더 열기·창 고정·모니터·학생 화면처럼 윈도우 PC에서만 되는 기능은 숨기거나 안내만 한다.
    - PC에서는 아무것도 바뀌지 않는다(이 블록은 PC 주소에서는 바로 끝난다).
  -->
  <script>
    (function () {
      var host = location.hostname;
      var onPc = host === '127.0.0.1' || host === 'localhost' || location.protocol === 'file:';
      if (/[?&]tablet=1\b/.test(location.search)) onPc = false;   // 시험용
      window.__TABLET_APP__ = !onPc;
      if (onPc) return;

      var html = document.documentElement;
      html.classList.add('tablet-app');
      var ls = window.localStorage;
      var origFetch = window.fetch.bind(window);

      // ---- 설정값 (갤탭에만 저장) ----
      function getS(k) { try { return (ls.getItem(k) || '').trim(); } catch (e) { return ''; } }
      // 학교는 ⚙ 설정 → 학교 정보(NEIS) 연결에서 고른다 (처음엔 모동중)
      function neisOffice() { return getS('TABLET_NEIS_OFFICE') || 'C10'; }
      function neisSchool() { return getS('TABLET_NEIS_SCHOOL') || '7201026'; }
      function neisName() { return getS('TABLET_NEIS_NAME') || (neisSchool() === '7201026' ? '모동중학교' : '우리 학교'); }
      function setS(k, v) { try { if (v) ls.setItem(k, v); else ls.removeItem(k); } catch (e) {} }
      function cleanKey(v) { return String(v || '').replace(/[\s​-‏⁠﻿]/g, '').replace(/^["'`]+|["'`]+$/g, ''); }

      function J(obj, status) {
        return new Response(JSON.stringify(obj), { status: status || 200, headers: { 'Content-Type': 'application/json; charset=utf-8' } });
      }
      var PC_ONLY = '이 기능은 교무실 PC 대시보드에서만 돼요. (갤탭 앱에서는 안 돼요)';
      function bodyJson(init) { try { return JSON.parse((init && init.body) || '{}') || {}; } catch (e) { return {}; } }
      function ymd(d) { return d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0'); }
      function okYmd(v, def) { return /^\d{8}$/.test(v || '') ? v : def; }
      function okDigit(v, def) { return /^\d{1,2}$/.test(v || '') ? v : def; }

      // ---- 🏫 NEIS: 먼저 직접, 막히면(CORS) 구글 중계 주소로 ----
      function neisCode(obj) {
        if (!obj || typeof obj !== 'object') return '';
        if (obj.RESULT && obj.RESULT.CODE) return String(obj.RESULT.CODE);
        for (var k in obj) {
          var v = obj[k];
          if (Array.isArray(v) && v[0] && v[0].head) {
            for (var i = 0; i < v[0].head.length; i++) { var h = v[0].head[i]; if (h && h.RESULT) return String(h.RESULT.CODE || ''); }
          }
        }
        return '';
      }
      function neisGetRaw(url) {
        return origFetch(url).then(function (r) { return r.json(); }).catch(function (e) {
          var relay = getS('TABLET_RELAY_URL');
          if (!relay) throw new Error('NEIS에 직접 연결이 안 돼요. ⚙ 설정 → 📲 갤탭 앱 설정에서 「구글 중계 주소」를 넣어 주세요.');
          return origFetch(relay + (relay.indexOf('?') < 0 ? '?' : '&') + 'u=' + encodeURIComponent(url), { redirect: 'follow' })
            .then(function (r) { return r.json(); })
            .then(function (o) { if (o && o.__relayError) throw new Error('구글 중계 오류 — ' + o.__relayError); return o; });
        });
      }
      function neisFetch(baseUrl) {
        var key = getS('TABLET_NEIS_KEY');
        var first = key ? baseUrl + '&KEY=' + encodeURIComponent(key) : baseUrl;
        return neisGetRaw(first).then(function (obj) {
          var code = neisCode(obj);
          if (key && (/^ERROR-29/.test(code) || code === 'ERROR-300' || code === 'INFO-300')) {
            return neisGetRaw(baseUrl).then(function (o2) {
              o2._limited = true; o2._warning = 'NEIS 인증키를 NEIS가 받아 주지 않아요 — 키 없이 받아서 5개까지만 보여요'; return o2;
            });
          }
          if (!key) { obj._limited = true; obj._warning = 'NEIS 인증키가 없어서 5개까지만 받아요 (6·7교시가 안 보여요) — ⚙ 설정 → 학교 정보(NEIS) 연결에서 키를 넣어 주세요'; }
          return obj;
        }).catch(function (e) {
          var msg = (e && e.message) || 'NEIS 불러오기 실패';
          return { RESULT: { CODE: 'INFO-200', MESSAGE: msg }, _error: msg };
        });
      }
      var NEIS = 'https://open.neis.go.kr/hub/';
      function school() { return '&ATPT_OFCDC_SC_CODE=' + neisOffice() + '&SD_SCHUL_CODE=' + neisSchool(); }
      function neisPublic(extra) {
        var k = getS('TABLET_NEIS_KEY');
        var o = { success: true, hasKey: !!k, masked: k ? (k.length > 8 ? k.slice(0, 4) + '…' + k.slice(-4) : '…') : '', keyFromEnv: false,
          office: neisOffice(), school: neisSchool(), name: neisName(), region: getS('TABLET_NEIS_REGION') };
        for (var x in (extra || {})) o[x] = extra[x];
        return o;
      }
      function neisRows(obj) {
        try { return (obj.schoolInfo[1].row || []); } catch (e) { return []; }
      }

      function myTimetable(q) {
        var grades = (q.get('grades') || '2').split(/[,\s]+/).filter(function (g) { return /^[1-6]$/.test(g); }).slice(0, 6);
        if (!grades.length) grades = ['2'];
        var kw = (q.get('kw') || '기술').replace(/\s+/g, '');
        var base = new Date();
        var b = q.get('date');
        if (/^\d{8}$/.test(b || '')) base = new Date(+b.slice(0, 4), +b.slice(4, 6) - 1, +b.slice(6, 8));
        if (base.getDay() === 6) base.setDate(base.getDate() + 2);
        if (base.getDay() === 0) base.setDate(base.getDate() + 1);
        var mon = new Date(base); mon.setDate(base.getDate() - (base.getDay() - 1));
        var fri = new Date(mon); fri.setDate(mon.getDate() + 4);
        var f = ymd(mon), t = ymd(fri);
        var slots = [], subjects = {};
        var chain = Promise.resolve(null);
        grades.forEach(function (g) {
          chain = chain.then(function (stop) {
            if (stop) return stop;
            return neisFetch(NEIS + 'misTimetable?Type=json&pIndex=1&pSize=1000' + school() + '&GRADE=' + g + '&TI_FROM_YMD=' + f + '&TI_TO_YMD=' + t).then(function (obj) {
              if (obj._error) return { success: false, error: obj._error };
              if (obj._limited) return { success: false, error: 'NEIS 인증키가 없거나 맞지 않아서 시간표를 5줄만 받을 수 있어요. ⚙ 설정 → 📲 갤탭 앱 설정에서 NEIS 인증키를 넣어 주세요.' };
              var rows = []; try { rows = obj.misTimetable[1].row || []; } catch (e) {}
              rows.forEach(function (r) {
                var subj = String(r.ITRT_CNTNT || '').trim(); if (!subj) return;
                subjects[subj] = (subjects[subj] || 0) + 1;
                if (kw && subj.replace(/\s+/g, '').indexOf(kw) < 0) return;
                var d = String(r.ALL_TI_YMD || '');
                var wd = new Date(+d.slice(0, 4), +d.slice(4, 6) - 1, +d.slice(6, 8)).getDay();
                var per = parseInt(r.PERIO, 10) || 0;
                var cls = (parseInt(r.GRADE, 10) || +g) + '-' + (parseInt(r.CLASS_NM, 10) || 0);
                if (wd >= 1 && wd <= 5 && per >= 1) slots.push({ wd: wd, period: per, cls: cls, subject: subj });
              });
              return null;
            });
          });
        });
        return chain.then(function (stop) {
          if (stop) return stop;
          var top = Object.keys(subjects).sort(function (a, b) { return subjects[b] - subjects[a]; }).slice(0, 40);
          return { success: true, from: f, to: t, slots: slots, subjects: top, warning: '' };
        });
      }

      // ---- ✨ 제미나이: 갤탭이 직접 구글에 물어본다 ----
      var GEMINI = 'https://generativelanguage.googleapis.com/v1beta';
      var MODELS = ['gemini-3.8-flash', 'gemini-3.5-flash-lite', 'gemini-3.5-flash', 'gemini-3.6-flash', 'gemini-2.5-flash'];
      function gemReq(method, url, key, body) {
        return origFetch(url, { method: method, headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key }, body: body ? JSON.stringify(body) : undefined })
          .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { return { status: r.status, body: j }; }); });
      }
      function errMsg(b, s) { return (b && b.error && b.error.message) || ('HTTP ' + s); }
      function geminiGenerate(payload, key) {
        var pref = getS('TABLET_GEMINI_MODEL');
        var order = MODELS.slice();
        if (pref && order.indexOf(pref) >= 0) { order.splice(order.indexOf(pref), 1); order.unshift(pref); }
        var low = JSON.parse(JSON.stringify(payload || {}));
        low.generationConfig = low.generationConfig || {};
        if (!low.generationConfig.thinkingConfig) low.generationConfig.thinkingConfig = { thinkingLevel: 'low' };
        var last = { status: 502, msg: '사용 가능한 Gemini 모델을 찾지 못했습니다.' };
        var i = 0;
        function next() {
          if (i >= order.length) {
            var m = last.status === 429 ? 'Gemini 무료 사용 한도를 초과했습니다. 잠시 후 다시 시도해주세요. (' + last.msg + ')' : last.msg;
            return J({ error: { message: m } }, last.status);
          }
          var model = order[i++];
          var url = GEMINI + '/models/' + model + ':generateContent';
          return gemReq('POST', url, key, low).then(function (res) {
            if (res.status === 400 && /thinking/i.test(errMsg(res.body, 400))) return gemReq('POST', url, key, payload);
            return res;
          }).then(function (res) {
            if (res.status === 200) { setS('TABLET_GEMINI_MODEL', model); return J(res.body, 200); }
            var m = errMsg(res.body, res.status);
            if (res.status === 401 || ((res.status === 400 || res.status === 403) && /api.?key|credential|unauthenticated/i.test(m))) {
              return J({ error: { message: 'API 키 인증에 실패했습니다. 키를 다시 확인해주세요. (구글 응답: ' + m + ')' } }, 401);
            }
            last = { status: res.status, msg: m };
            return next();
          }, function () {
            return J({ error: { message: 'Gemini 서버에 연결하지 못했습니다. 갤탭 인터넷 연결을 확인해주세요.' } }, 504);
          });
        }
        return next();
      }

      // ---- ▶ 유튜브 ----
      function ytKey() { return getS('TABLET_YT_KEY'); }
      function ytGet(path, params) {
        var key = ytKey();
        if (!key) return Promise.resolve({ status: 400, body: { error: { message: '유튜브 API 키가 없어요. ⚙ 설정 → 유튜브 API 키에서 넣어 주세요.' } } });
        var u = new URL('https://www.googleapis.com/youtube/v3/' + path);
        Object.keys(params).forEach(function (k) { u.searchParams.set(k, params[k]); });
        u.searchParams.set('key', key);
        return origFetch(u.toString()).then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { return { status: r.status, body: j }; }); });
      }
      function isoDur(s) {
        var m = /^PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?$/.exec(s || ''); if (!m) return '';
        var h = +(m[1] || 0), mi = +(m[2] || 0), se = +(m[3] || 0);
        return h ? h + ':' + String(mi).padStart(2, '0') + ':' + String(se).padStart(2, '0') : mi + ':' + String(se).padStart(2, '0');
      }
      function unesc(t) { var d = document.createElement('textarea'); d.innerHTML = t || ''; return d.value; }
      function ytSearch(q, page) {
        q = String(q || '').trim().slice(0, 120);
        if (!q) return Promise.resolve({ success: false, error: '검색어를 넣어 주세요.' });
        var p = { part: 'snippet', type: 'video', maxResults: 12, q: q, regionCode: 'KR', relevanceLanguage: 'ko', safeSearch: 'strict', videoEmbeddable: 'true' };
        if (page) p.pageToken = String(page).slice(0, 100);
        return ytGet('search', p).then(function (res) {
          if (res.status !== 200) {
            var m = errMsg(res.body, res.status);
            if (/quota/i.test(m)) m = '오늘 유튜브 검색 횟수를 다 썼어요(구글 무료 한도). 내일 다시 쓸 수 있어요.';
            return { success: false, error: m };
          }
          var items = res.body.items || [];
          var ids = items.map(function (it) { return it.id && it.id.videoId; }).filter(Boolean);
          var extraP = ids.length ? ytGet('videos', { part: 'contentDetails,statistics', id: ids.join(',') }) : Promise.resolve({ status: 0 });
          return extraP.then(function (r2) {
            var extra = {};
            if (r2.status === 200) (r2.body.items || []).forEach(function (v) { extra[v.id] = v; });
            var out = items.filter(function (it) { return it.id && it.id.videoId; }).map(function (it) {
              var sn = it.snippet || {}, th = sn.thumbnails || {}, ex = extra[it.id.videoId] || {};
              var views = (ex.statistics || {}).viewCount;
              return {
                id: it.id.videoId, title: unesc(sn.title), channel: unesc(sn.channelTitle),
                thumb: (th.medium || th.high || th['default'] || {}).url || '',
                published: (sn.publishedAt || '').slice(0, 10),
                duration: isoDur((ex.contentDetails || {}).duration),
                views: /^\d+$/.test(views || '') ? +views : null
              };
            });
            return { success: true, items: out, next: res.body.nextPageToken || '' };
          });
        }).catch(function () { return { success: false, error: '유튜브에 연결하지 못했어요. 인터넷 연결을 확인해 주세요.' }; });
      }
      var YT_ID = /(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/|v\/))([A-Za-z0-9_-]{11})/;
      function ytInfo(raw) {
        raw = String(raw || '').trim();
        var m = YT_ID.exec(raw);
        var vid = m ? m[1] : (/^[A-Za-z0-9_-]{11}$/.test(raw) ? raw : '');
        if (!vid) return Promise.resolve({ success: false, error: '유튜브 영상 주소가 아니에요. 주소창의 주소를 그대로 붙여 넣어 주세요.' });
        var info = { success: true, id: vid, title: '', channel: '', thumb: 'https://i.ytimg.com/vi/' + vid + '/mqdefault.jpg' };
        var watch = 'https://www.youtube.com/watch?v=' + vid;
        // 키가 있으면 유튜브 API로(정확), 없으면 noembed(무료 공개 서비스)로 제목만 알아낸다
        var p = ytKey()
          ? ytGet('videos', { part: 'snippet', id: vid }).then(function (r) {
              var it = (r.body.items || [])[0];
              if (r.status === 200 && !it) return { notFound: true };
              return it ? { title: it.snippet.title, author_name: it.snippet.channelTitle } : {};
            })
          : origFetch('https://noembed.com/embed?url=' + encodeURIComponent(watch)).then(function (r) { return r.json(); });
        return p.then(function (d) {
          if (d && d.notFound) return { success: false, error: '영상을 찾을 수 없어요(삭제·비공개).' };
          info.title = (d && d.title) || ''; info.channel = (d && d.author_name) || '';
          if (!info.title) info.title = '유튜브 영상 (' + vid + ')';
          return info;
        }).catch(function () { info.title = '유튜브 영상 (' + vid + ')'; return info; });
      }

      // ---- PC 서버 대신 답하기 ----
      function handle(u, init) {
        var path = u.pathname.replace(/^.*?(\/api\/)/, '/api/');
        var q = u.searchParams;
        var method = ((init && init.method) || 'GET').toUpperCase();
        var today = ymd(new Date());

        if (/\/wallpaper/.test(u.pathname) && path.indexOf('/api/') !== 0) return J({ success: false });
        switch (path) {
          case '/api/wallpaper/info': return J({ success: false });
          case '/api/state':
            return method === 'POST' ? J({ success: true }) : J({ success: true, data: null });
          case '/api/state/merge': return J({ success: true });

          case '/api/gemini/key': {
            if (method !== 'POST') { var k0 = getS('GEMINI_API_KEY'); return J({ success: true, hasKey: !!k0, apiKey: k0 }); }
            var b = bodyJson(init), nk = cleanKey(b.apiKey);
            if (nk && !/^[\x21-\x7e]{10,512}$/.test(nk)) return J({ success: false, error: '키에 사용할 수 없는 문자(한글 등)가 들어 있습니다. 키만 다시 복사해주세요.' }, 400);
            var save = function (warning) { setS('GEMINI_API_KEY', nk); return J({ success: true, hasKey: !!nk, apiKey: nk, warning: warning || '' }); };
            if (!nk || b.verify === false) return save();
            return gemReq('GET', GEMINI + '/models?pageSize=1', nk).then(function (r) {
              if (r.status === 200) return save();
              if (r.status === 400 || r.status === 401 || r.status === 403) return J({ success: false, error: '구글이 이 키를 거부했습니다: ' + errMsg(r.body, r.status) }, 400);
              return save('키는 저장했지만 확인하지 못했습니다(' + errMsg(r.body, r.status) + ').');
            }, function () { return save('키는 저장했지만 인터넷 문제로 확인하지 못했습니다.'); });
          }
          case '/api/gemini/generate': {
            var gb = bodyJson(init);
            var key = cleanKey(gb.apiKey || getS('GEMINI_API_KEY'));
            if (!key) return J({ error: { message: 'Gemini API 키가 없습니다. 키를 먼저 넣어 주세요.' } }, 400);
            return geminiGenerate(gb.payload, key);
          }

          case '/api/youtube/key': {
            if (method !== 'POST') { var yk = ytKey(); return J({ success: true, hasKey: !!yk, masked: yk ? yk.slice(0, 6) + '…' + yk.slice(-4) : '' }); }
            var nyk = cleanKey(bodyJson(init).apiKey);
            if (nyk && !/^[A-Za-z0-9_\-]{20,100}$/.test(nyk)) return J({ success: false, error: "키 모양이 이상해요. 'AIza…'로 시작하는 키만 다시 복사해 주세요." }, 400);
            if (!nyk) { setS('TABLET_YT_KEY', ''); return J({ success: true, error: '' }); }
            var old = ytKey(); setS('TABLET_YT_KEY', nyk);
            return ytGet('search', { part: 'snippet', type: 'video', maxResults: 1, q: '기술' }).then(function (r) {
              if (r.status === 200) return J({ success: true, error: '' });
              setS('TABLET_YT_KEY', old);
              return J({ success: false, error: '구글이 이 키를 받아 주지 않았어요: ' + errMsg(r.body, r.status) }, 400);
            });
          }
          case '/api/youtube/search': return ytSearch(q.get('q'), q.get('page')).then(J);
          case '/api/youtube/info': return ytInfo(q.get('u')).then(J);

          case '/api/neis/config': {
            if (method !== 'POST') return J(neisPublic());
            var nb = bodyJson(init);
            var off = String(nb.office || neisOffice()).trim().toUpperCase(), sch = String(nb.school || neisSchool()).trim();
            if (!/^[A-Z][0-9]{2}$/.test(off)) return J({ success: false, error: '교육청 코드는 영어 1글자 + 숫자 2개예요 (예: 부산 C10).' }, 400);
            if (!/^[0-9]{7,10}$/.test(sch)) return J({ success: false, error: '학교 코드는 숫자 7자리예요 (예: 7201026).' }, 400);
            var nk = nb.clearKey ? '' : (nb.apiKey ? cleanKey(nb.apiKey) : getS('TABLET_NEIS_KEY'));
            if (nb.apiKey && !/^[A-Za-z0-9]{16,64}$/.test(nk)) return J({ success: false, error: '인증키 모양이 이상해요. NEIS 오픈API 사이트에서 받은 영어·숫자 키만 붙여 넣어 주세요.' }, 400);
            var commit = function (nm, warn) {
              setS('TABLET_NEIS_OFFICE', off); setS('TABLET_NEIS_SCHOOL', sch); setS('TABLET_NEIS_KEY', nk);

      --card-warm-border: rgba(150, 175, 105, 0.45);
      --scroll-thumb: rgba(130, 150, 90, 0.65);
      --text-main: #edf0e6;
    }

    body.theme-zen {
      --bg-gradient: linear-gradient(135deg, #141416 0%, #1e1e22 50%, #101012 100%);
      --card-bg: linear-gradient(135deg, rgba(28, 28, 33, 0.97) 0%, rgba(20, 20, 24, 0.97) 100%);
      --card-border: rgba(140, 140, 155, 0.35);
      --card-warm-bg: linear-gradient(135deg, rgba(35, 35, 42, 0.97) 0%, rgba(25, 25, 30, 0.97) 100%);
      --card-warm-border: rgba(160, 160, 180, 0.45);
      --scroll-thumb: rgba(140, 140, 155, 0.65);
      --text-main: #f0f0f2;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; overflow: hidden;
      width: 100vw; height: 100vh;
      font-size: 14.5px;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      user-select: none;
      background: var(--bg-gradient);
      color: var(--text-main);
      transition: background 0.3s ease;
    }
    .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.5); border-radius: 4px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 4px; }
    
    .glass-card {
      background: var(--card-bg) !important;
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border) !important;
      box-shadow: 0 8px 24px -4px rgba(0, 0, 0, 0.6);
      transition: background 0.3s ease, border-color 0.3s ease;
    }
    .glass-card-warm {
      background: var(--card-warm-bg) !important;
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-warm-border) !important;
      box-shadow: 0 8px 24px -4px rgba(0, 0, 0, 0.6);
      transition: background 0.3s ease, border-color 0.3s ease;
    }
    .widget-container { position: absolute; transition: box-shadow 0.2s ease, border-color 0.2s ease; }
    .widget-container:hover { border-color: rgba(245, 158, 11, 0.7) !important; z-index: 30; }
    .drag-handle { cursor: grab; touch-action: none; }
    .drag-handle:active { cursor: grabbing; }

    .handle-right { position: absolute; top: 0; right: -4px; width: 8px; height: 100%; cursor: col-resize; z-index: 20; }
    .handle-bottom { position: absolute; bottom: -4px; left: 0; width: 100%; height: 8px; cursor: row-resize; z-index: 20; }
    .handle-corner { position: absolute; bottom: -3px; right: -3px; width: 14px; height: 14px; cursor: nwse-resize; z-index: 25; }

    .dock-pill {
      background: rgba(11, 18, 32, 0.96);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(148, 163, 184, 0.4);
      box-shadow: 0 12px 35px -5px rgba(0, 0, 0, 0.85);
    }

    /* ===== 바탕화면처럼 보이기 =====
       크롬 창은 진짜로 투명해질 수 없어서, 지금 바탕화면 그림을 대시보드 자리와 똑같은 위치로 깔아 둔다. */
    html, body { background: transparent !important; }
    body { background-color: #0b1220 !important; }
    #wallpaper { position: fixed; z-index: -1; background-repeat: no-repeat; pointer-events: none; }
    .widget-container.glass-card, .widget-container.glass-card-warm {
      background: rgba(12, 18, 32, 0.62) !important;
      backdrop-filter: blur(14px) saturate(1.2);
      box-shadow: 0 12px 30px -10px rgba(0, 0, 0, 0.55);
    }
    .dock-pill { background: rgba(10, 16, 30, 0.72) !important; backdrop-filter: blur(16px); }
    .topbar-glass { background: rgba(6, 10, 20, 0.62) !important; backdrop-filter: blur(16px); }

    /* ===== 작업표시줄 피하기 =====
       대시보드 창이 화면 전체 크기여도, 내용(#root)은 작업표시줄을 뺀 영역 안에만 그린다.
       transform 을 주면 안쪽의 position:fixed 요소(하단 도구 막대·팝업)도 이 영역 기준이 된다. */
    #root {
      position: fixed;
      top: var(--safe-top, 0px); left: var(--safe-left, 0px);
      right: var(--safe-right, 0px); bottom: var(--safe-bottom, 0px);
      transform: translateZ(0); overflow: hidden;
    }

    /* ===== 보기 편하게 다듬은 스타일 (v2) ===== */
    html, body { font-size: 15.5px; }

    /* 흐린 회색 글씨를 한 단계 밝게 → 어두운 배경에서도 잘 읽힘 */
    body .text-slate-300 { color: #dfe6ee; }
    body .text-slate-400 { color: #b9c3cf; }
    body .text-slate-500 { color: #95a1b0; }
    body .text-slate-600 { color: #7c8898; }
    /* 너무 작은 글씨 키우기 */
    body .text-\[10px\] { font-size: 12px; }
    body .text-\[11px\] { font-size: 12.5px; }

    /* 카드 테두리를 차분하게 통일하고, 위젯마다 고유 색 띠로 구분 */
    .widget-container.glass-card, .widget-container.glass-card-warm {
      border-color: rgba(255, 255, 255, 0.09) !important;
      border-top: 4px solid var(--accent, #64748b) !important;
      box-shadow: 0 10px 28px -8px rgba(0, 0, 0, 0.7);
    }
    .widget-container:hover { border-color: rgba(255, 255, 255, 0.16) !important; border-top-color: var(--accent, #64748b) !important; }
    .widget-container[data-w="clock"]     { --accent: #38bdf8; }
    .widget-container[data-w="tasks"]     { --accent: #f59e0b; }
    .widget-container[data-w="school"]    { --accent: #34d399; }
    .widget-container[data-w="gcal"]      { --accent: #f472b6; }
    .widget-container[data-w="gemini"]    { --accent: #a78bfa; }
    .widget-container[data-w="folders"]   { --accent: #60a5fa; }
    .widget-container[data-w="bookmarks"] { --accent: #fb923c; }

    /* 🔒 고정 상태에서는 '이동'·'✕' 버튼을 숨겨 화면을 깔끔하게 */
    html.widgets-locked .drag-handle,
    html.widgets-locked .widget-close { display: none !important; }
    /* 🔓 편집 상태임을 눈에 띄게 */
    html:not(.widgets-locked) .widget-container { outline: 2px dashed rgba(251, 191, 36, 0.45); outline-offset: 3px; }

    /* 상단 바 / 하단 도구 막대 */
    .topbar-btn {
      display: inline-flex; align-items: center; gap: 6px;
      height: 34px; padding: 0 10px; border-radius: 10px;
      font-size: 13px; font-weight: 700; white-space: nowrap;
      background: rgba(30, 41, 59, 0.85); color: #e2e8f0;
      border: 1px solid rgba(148, 163, 184, 0.25);
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .topbar-btn:hover { background: rgba(51, 65, 85, 0.95); color: #fff; }
    .menu-item {
      display: flex; align-items: center; gap: 10px; width: 100%;
      padding: 9px 12px; border-radius: 10px; font-size: 13.5px; font-weight: 600;
      color: #e2e8f0; text-align: left; transition: background 0.12s;
    }
    .menu-item:hover { background: rgba(51, 65, 85, 0.8); }
    .menu-item i { width: 18px; text-align: center; color: #fbbf24; }
    .dock-tool {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
      min-width: 64px; height: 52px; padding: 0 7px; border-radius: 14px;
      background: rgba(30, 41, 59, 0.7); border: 1px solid rgba(148, 163, 184, 0.18);
      color: #e2e8f0; font-size: 12px; font-weight: 700; white-space: nowrap;
      transition: transform 0.12s, background 0.12s, border-color 0.12s;
    }
    .dock-tool .ico { font-size: 20px; line-height: 1; }
    .dock-tool:hover { transform: translateY(-3px); background: rgba(51, 65, 85, 0.95); border-color: rgba(251, 191, 36, 0.6); }
    .dock-main { min-width: 86px; }

    /* =====================================================================
       🔧 기술실 작업대 테마 (theme-workbench)
       - 바탕: 공구를 거는 타공판(구멍 뚫린 철판)
       - 위젯: 작업대 위에 놓인 철판. 둥근 모서리를 줄이고 그림자는 짧게
       - 색: 노란색(안전 표시)은 '지금' 을 가리킬 때만, 파란색(도면)은 정보·이동
       - 글꼴: 한글 IBM Plex Sans KR, 숫자는 자·계기판 같은 Barlow Condensed
       ===================================================================== */
    body.theme-workbench {
      --wb-bench: #20272d;
      --wb-well: #1a2025;
      --wb-plate: #272f36;
      --wb-plate-2: #2c353d;
      --wb-plate-3: #343e47;
      --wb-plate-4: #3d4852;
      --wb-line: #3a454f;
      --wb-line-hi: #4b5864;
      --wb-ink: #eef1f3;
      --wb-dim: #a9b3bc;
      --wb-yellow: #f2c230;
      --wb-on-yellow: #1d2328;
      --wb-blue: #6aa6d8;
      --wb-green: #5fbf8a;
      --wb-red: #e5604c;
      --wb-ruler-bg: #2c353d;
      --wb-tick: rgba(238, 241, 243, 0.28);
      --text-main: var(--wb-ink);
      font-family: "IBM Plex Sans KR", "Pretendard", "Noto Sans KR", "Segoe UI", sans-serif;
      color: var(--wb-ink);
    }
    /* 타공판: 윈도우 바탕화면 그림 대신 깐다 */
    body.theme-workbench #wallpaper { display: none; }
    body.theme-workbench::before {
      content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background:
        radial-gradient(circle, rgba(0, 0, 0, 0.42) 0 2.3px, rgba(255, 255, 255, 0.05) 2.6px 3.1px, transparent 3.4px) 0 0 / 28px 28px,
        linear-gradient(180deg, #232b31 0%, #1d2328 100%);
    }

    /* 위젯 = 작업대 위 철판 */
    body.theme-workbench .widget-container.glass-card,
    body.theme-workbench .widget-container.glass-card-warm {
      background: var(--wb-plate) !important;
      backdrop-filter: none;
      border: 1px solid var(--wb-line) !important;
      border-top: 1px solid var(--wb-line-hi) !important;
      border-radius: 8px !important;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04), 0 8px 16px -8px rgba(0, 0, 0, 0.7);
    }
    body.theme-workbench .widget-container:hover { border-color: var(--wb-line-hi) !important; }
    html:not(.widgets-locked) body.theme-workbench .widget-container { outline-color: rgba(242, 194, 48, 0.5); }

    /* 모서리: 철판답게 덜 둥글게 */
    body.theme-workbench .rounded-3xl { border-radius: 12px; }
    body.theme-workbench .rounded-2xl { border-radius: 9px; }
    body.theme-workbench .rounded-xl { border-radius: 7px; }
    body.theme-workbench .rounded-full { border-radius: 6px; }

    /* 숫자는 자·계기판 글꼴 */
    body.theme-workbench .font-mono,
    body.theme-workbench .wb-num {
      font-family: "Barlow Condensed", "IBM Plex Sans KR", sans-serif;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.01em;
    }
    body.theme-workbench .wb-clock {
      font-family: "Barlow Condensed", sans-serif;
      font-weight: 700; line-height: 0.95; letter-spacing: -0.01em;
      font-variant-numeric: tabular-nums; color: var(--wb-ink);
    }
    body.theme-workbench .wb-clock span { font-size: 0.36em; color: var(--wb-dim); font-weight: 600; }
    body.theme-workbench .wb-display {
      font-family: "Barlow Condensed", "IBM Plex Sans KR", sans-serif;
      font-weight: 700; letter-spacing: -0.005em;
    }
    body.theme-workbench .wb-num { font-weight: 700; }

    /* 위쪽 막대 · 아래 공구 걸이 */
    body.theme-workbench .topbar-glass {
      background: #1b2126 !important; backdrop-filter: none;
      border-bottom: 1px solid var(--wb-line) !important;
    }
    body.theme-workbench .topbar-btn {
      background: var(--wb-plate-2); color: var(--wb-ink);
      border-color: var(--wb-line); border-radius: 6px; font-weight: 600;
    }
    body.theme-workbench .topbar-btn:hover { background: var(--wb-plate-3); }
    body.theme-workbench .topbar-btn:focus-visible,
    body.theme-workbench .dock-tool:focus-visible,
    body.theme-workbench button:focus-visible {
      outline: 2px solid var(--wb-blue); outline-offset: 2px;
    }
    body.theme-workbench .wb-dock {
      background: #1b2126 !important; backdrop-filter: none;
      border: 1px solid var(--wb-line) !important; border-radius: 10px !important;
      box-shadow: 0 10px 24px -10px rgba(0, 0, 0, 0.8);
    }
    body.theme-workbench .dock-tool {
      background: var(--wb-plate-2); border: 1px solid var(--wb-line);
      border-radius: 7px; font-weight: 600; color: var(--wb-ink);
    }
    body.theme-workbench .dock-tool:hover {
      transform: none; background: var(--wb-plate-3); border-color: var(--wb-blue);
    }
    body.theme-workbench .menu-item i { color: var(--wb-blue); }
    body.theme-workbench .bg-slate-900\/98 { background-color: #1b2126; }

    @media (prefers-reduced-motion: reduce) {
      body.theme-workbench *, body.theme-workbench *::before { transition: none !important; animation: none !important; }
    }

    /* 📏 하루 시간자 (모든 테마 공통) */
    .wb-ruler { margin: 16px auto 0; width: 100%; max-width: 540px; user-select: none; }
    .wb-ruler-track {
      position: relative; height: 50px; border-radius: 4px;
      background:
        repeating-linear-gradient(90deg, var(--wb-tick, rgba(255,255,255,.25)) 0 1px, transparent 1px var(--tick)) left bottom / 100% 9px no-repeat,
        var(--wb-ruler-bg, rgba(255, 255, 255, 0.05));
      box-shadow: inset 0 0 0 1px var(--wb-line, rgba(255, 255, 255, 0.12));
    }
    .wb-seg {
      position: absolute; top: 0; bottom: 9px;
      border-right: 1px solid var(--wb-line-hi, rgba(255, 255, 255, 0.18));
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
      overflow: hidden; color: var(--wb-dim, #b9c3cf);
    }
    .wb-seg:last-child { border-right: 0; }
    .wb-seg-num { font-family: "Barlow Condensed", sans-serif; font-weight: 600; font-size: 15px; line-height: 1; }
    .wb-seg-cls { font-family: "Barlow Condensed", sans-serif; font-size: 12px; line-height: 1; font-weight: 600; white-space: nowrap; }
    .wb-seg.is-break {
      background: repeating-linear-gradient(135deg, transparent 0 5px, rgba(255, 255, 255, 0.05) 5px 7px);
    }
    .wb-seg.is-break .wb-seg-num { font-family: inherit; font-size: 11px; }
    .wb-seg.is-done { opacity: 0.45; }
    .wb-seg.is-mine { background: rgba(106, 166, 216, 0.22); color: var(--wb-ink, #fff); }
    .wb-seg.is-on { box-shadow: inset 0 0 0 2px var(--wb-yellow, #f2c230); color: var(--wb-ink, #fff); opacity: 1; }
    .wb-needle {
      position: absolute; top: -5px; bottom: -3px; width: 2px; margin-left: -1px;
      background: var(--wb-yellow, #f2c230); border-radius: 1px;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.35);
    }
    .wb-needle::before {
      content: ""; position: absolute; top: -1px; left: -5px;
      border-left: 6px solid transparent; border-right: 6px solid transparent;
      border-top: 7px solid var(--wb-yellow, #f2c230);
    }
    .wb-ruler-ends {
      display: flex; justify-content: space-between; margin-top: 4px;
      font-family: "Barlow Condensed", sans-serif; font-size: 13px; font-weight: 600;
      color: var(--wb-dim, #95a1b0); font-variant-numeric: tabular-nums;
    }

    /* ===== 넘침 막기 (모든 테마) =====
       학교 PC는 화면 배율 때문에 대시보드가 생각보다 좁게 그려진다.
       위젯 밖으로 글자가 나가지 않게 자르고, 제목은 '…'으로 줄인다. */
    .widget-container { overflow: clip; overflow-clip-margin: 12px; }
    .widget-container :has(> .wb-title) { min-width: 0; }
    .wb-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .widget-container .flex > * { min-width: 0; }
    .widget-container .drag-handle, .widget-container .widget-close { flex-shrink: 0; white-space: nowrap; }

    /* ===== 오늘 띠 (시계 위젯) ===== */
    .widget-container[data-w="clock"] { container-type: size; container-name: today; }
    .wb-band {
      container-type: inline-size; flex: 1; min-height: 0; overflow: hidden;
      display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; align-items: center;
      margin-top: 6px;
    }
    .wb-band-time { text-align: left; min-width: 0; }
    .wb-band .wb-clock { font-size: clamp(2rem, min(15cqw, 26cqh), 6.2rem) !important; line-height: 0.95; white-space: nowrap; }
    .wb-band-date { font-size: clamp(0.85rem, 2.6cqw, 1.05rem) !important; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .wb-next {
      text-align: left; min-width: 0; display: flex; flex-direction: column; gap: 1px;
      padding: 9px 14px; border-radius: 8px; max-height: 100%; overflow: hidden;
      background: var(--wb-plate-2, rgba(255,255,255,.05)); border: 1px solid var(--wb-line, rgba(255,255,255,.12));
      color: var(--wb-ink, #fff); transition: border-color .15s;
    }
    .wb-next:hover { border-color: var(--wb-blue, #60a5fa); }
    .wb-next.is-now { border-color: var(--wb-green, #34d399); box-shadow: inset 4px 0 0 var(--wb-green, #34d399); }
    .wb-next.is-soon { border-color: var(--wb-yellow, #fbbf24); box-shadow: inset 4px 0 0 var(--wb-yellow, #fbbf24); }
    .wb-next-k { font-size: 0.8rem; font-weight: 700; color: var(--wb-dim, #b9c3cf); }
    .wb-next-cls { font-family: "Barlow Condensed", "IBM Plex Sans KR", sans-serif; font-weight: 700; font-size: clamp(1.3rem, min(6cqw, 15cqh), 2.1rem); line-height: 1.05; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .wb-next-meta { font-size: 0.82rem; color: var(--wb-dim, #b9c3cf); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .wb-next-big { font-family: "Barlow Condensed", "IBM Plex Sans KR", sans-serif; font-weight: 700; font-size: 1.25rem; color: var(--wb-ink, #fff); }
    .wb-next.is-now .wb-next-big { color: var(--wb-green, #34d399); }
    .wb-next.is-soon .wb-next-big { color: var(--wb-yellow, #fbbf24); }
    @container (max-width: 520px) {
      .wb-band { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
      .wb-band .wb-clock { font-size: clamp(2rem, min(19cqw, 24cqh), 4.4rem) !important; }
      .wb-next { padding: 8px 10px; }
      .wb-next-cls { font-size: 1.3rem; }
    }
    .wb-next-meta.wb-keep { display: block !important; white-space: normal; }
    /* 위젯 높이가 낮으면 덜 중요한 줄부터 숨긴다 */
    @container today (max-height: 260px) {
      .wb-band-date, .wb-next-meta, .wb-band-status { display: none; }
      .wb-next { gap: 0; padding: 6px 10px; }
      .wb-band-ruler .wb-ruler { margin-top: 4px; }
    }
    @container today (max-height: 200px) {
      .wb-ruler-ends, .wb-next-k { display: none; }
      .wb-next-cls { font-size: 1.15rem; }
      .wb-next-big { font-size: 1rem; }
      .wb-ruler-track { height: 38px; }
    }
    .wb-band-ruler { flex-shrink: 0; margin-top: 8px; }
    .wb-band-status { font-size: 0.85rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .wb-band-ruler .wb-ruler { max-width: none; margin-top: 8px; }

    body.theme-workbench .wb-dock { background: transparent !important; border: 0 !important; box-shadow: none !important; padding-top: 10px !important; }
    body.theme-workbench .wb-dock .dock-tool { position: relative; padding-top: 6px; box-shadow: 0 6px 10px -6px rgba(0,0,0,.8); }
    body.theme-workbench .wb-dock .dock-tool::before {

      border-radius: 50%; background: #11161a; box-shadow: 0 0 0 2px #59646e;
    }
    body.theme-workbench .wb-dock .dock-tool.dock-main { background: var(--wb-green) !important; color: var(--wb-on-yellow); border-color: var(--wb-green) !important; }
    body.theme-workbench .wb-dock > .w-px { display: none; }

    /* 수업 화면 */
    body.theme-workbench .wb-cf-band { border-top: 4px solid var(--wb-line-hi) !important; }

    /* =====================================================================
       🧠 자비스 HUD 테마 (theme-jarvis)
       - 바탕: 깊은 남색 우주 + 천천히 도는 뇌 신경망(캔버스)
       - 패널: 반투명 유리 + 하늘빛 가는 테두리 + 네 모서리 조준 괄호
       - 색: 하늘빛(정보) · 초록(수업 중) · 호박색(곧 시작·주의)만 쓴다
       - 글꼴: 한글 IBM Plex Sans KR, 숫자·영문 Oxanium
       ===================================================================== */
    body.theme-jarvis {
      --jv-bg: #02080f;
      --jv-cyan: #4fe3ff;
      --jv-ink: #e4f8ff;
      --jv-dim: #86aebf;
      --jv-line: rgba(79, 227, 255, 0.2);
      --jv-line-hi: rgba(79, 227, 255, 0.55);
      --jv-green: #3ee6a5;
      --jv-amber: #ffb547;
      --jv-red: #ff5d6c;
      /* 시간자·다음수업 카드가 쓰는 공통 변수 */
      --wb-ink: var(--jv-ink); --wb-dim: var(--jv-dim); --wb-yellow: var(--jv-amber); --wb-blue: var(--jv-cyan);
      --wb-green: var(--jv-green); --wb-line: var(--jv-line); --wb-line-hi: rgba(79,227,255,.32);
      --wb-plate-2: rgba(8, 28, 42, 0.55); --wb-ruler-bg: rgba(4, 18, 28, 0.6); --wb-tick: rgba(79, 227, 255, 0.35);
      --text-main: var(--jv-ink);
      font-family: "IBM Plex Sans KR", "Pretendard", "Noto Sans KR", "Segoe UI", sans-serif;
      color: var(--jv-ink);
      background: var(--jv-bg);
    }
    body.theme-jarvis #wallpaper { display: none; }
    body.theme-jarvis::before {
      content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background:
        radial-gradient(ellipse 60% 55% at 50% 52%, rgba(20, 110, 160, 0.22), transparent 70%),
        radial-gradient(circle at 50% 120%, rgba(79, 227, 255, 0.08), transparent 50%),
        linear-gradient(rgba(79, 227, 255, 0.035) 1px, transparent 1px) 0 0 / 100% 46px,
        linear-gradient(90deg, rgba(79, 227, 255, 0.035) 1px, transparent 1px) 0 0 / 46px 100%,
        var(--jv-bg);
    }
    .jv-neural { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none; }
    body.theme-jarvis .widget-container { z-index: 1; }

    /* 패널 */
    body.theme-jarvis .widget-container.glass-card,
    body.theme-jarvis .widget-container.glass-card-warm {
      background: linear-gradient(180deg, rgba(6, 26, 40, 0.38), rgba(3, 14, 24, 0.5)) !important;
      backdrop-filter: none;
      border: 1px solid var(--jv-line) !important;
      border-radius: 4px !important;
      box-shadow: inset 0 0 40px rgba(79, 227, 255, 0.05), 0 0 0 1px rgba(0,0,0,.4);
    }
    body.theme-jarvis .widget-container::before,
    body.theme-jarvis .widget-container::after {
      content: ""; position: absolute; width: 16px; height: 16px; pointer-events: none;
      border-color: var(--jv-cyan); border-style: solid; opacity: .85;
      filter: drop-shadow(0 0 4px rgba(79, 227, 255, 0.8));
    }
    body.theme-jarvis .widget-container::before { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
    body.theme-jarvis .widget-container::after { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }
    body.theme-jarvis .widget-container:hover { border-color: rgba(79, 227, 255, 0.38) !important; }

    body.theme-jarvis .rounded-3xl, body.theme-jarvis .rounded-2xl { border-radius: 6px; }
    body.theme-jarvis .rounded-xl, body.theme-jarvis .rounded-lg { border-radius: 4px; }
    body.theme-jarvis .rounded-full { border-radius: 3px; }

    /* 제목 */
    body.theme-jarvis .wb-title {
      color: var(--jv-cyan) !important; font-weight: 600; letter-spacing: 0.04em;
      padding-left: 12px; position: relative; text-shadow: 0 0 10px rgba(79, 227, 255, 0.45);
    }
    body.theme-jarvis .wb-title::before {
      content: ""; position: absolute; left: 0; top: 50%; width: 6px; height: 6px; margin-top: -3px;
      background: var(--jv-cyan); transform: rotate(45deg); box-shadow: 0 0 8px var(--jv-cyan);
    }
    body.theme-jarvis .wb-title i { color: var(--jv-cyan) !important; }

    /* 숫자 */
    body.theme-jarvis .font-mono, body.theme-jarvis .wb-num, body.theme-jarvis .wb-display,
    body.theme-jarvis .wb-seg-num, body.theme-jarvis .wb-seg-cls, body.theme-jarvis .wb-ruler-ends,
    body.theme-jarvis .wb-next-cls, body.theme-jarvis .wb-next-big, body.theme-jarvis .wb-cf-count .wb-num {

    body.theme-jarvis .wb-clock {

    body.theme-jarvis .wb-display { font-weight: 600; text-shadow: 0 0 16px rgba(79, 227, 255, 0.35); }

    /* 오늘 띠: 링 + 시각 */
    .jv-ring { display: none; }
    body.theme-jarvis .wb-band-time { display: flex; align-items: center; gap: clamp(10px, 2.2cqw, 24px); }
    body.theme-jarvis .wb-band-time-text { min-width: 0; }
    body.theme-jarvis .jv-ring {
      display: block; position: relative; flex-shrink: 0;
      width: clamp(84px, min(19cqw, 40cqh), 150px); aspect-ratio: 1;
    }
    .jv-ring svg { width: 100%; height: 100%; overflow: visible; }
    .jv-ring-ticks { fill: none; stroke: rgba(79, 227, 255, 0.5); stroke-width: 3; stroke-dasharray: 1 6.33; transform-origin: 60px 60px; animation: jv-spin 40s linear infinite; }
    .jv-ring-track { fill: none; stroke: rgba(79, 227, 255, 0.12); stroke-width: 6; }
    .jv-ring-bar { fill: none; stroke: var(--jv-cyan); stroke-width: 6; stroke-linecap: butt; filter: drop-shadow(0 0 5px rgba(79, 227, 255, 0.9)); transition: stroke-dasharray .6s; }
    .jv-ring.is-live .jv-ring-bar { stroke: var(--jv-green); filter: drop-shadow(0 0 5px rgba(62, 230, 165, 0.9)); }
    .jv-ring-inner { fill: none; stroke: rgba(79, 227, 255, 0.28); stroke-width: 1; stroke-dasharray: 14 6; transform-origin: 60px 60px; animation: jv-spin 18s linear infinite reverse; }
    .jv-ring-text { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; }
    .jv-ring-text b { font-family: "Oxanium", "IBM Plex Sans KR", sans-serif; font-size: clamp(1.3rem, 5.5cqw, 2.3rem); font-weight: 600; color: var(--jv-ink); text-shadow: 0 0 10px rgba(79, 227, 255, 0.6); }

    @keyframes jv-spin { to { transform: rotate(360deg); } }
    @container today (max-height: 200px) { body.theme-jarvis .jv-ring { width: 70px; } .jv-ring-text span { display: none; } }

    body.theme-jarvis .wb-next {

    /* 할 일 */
    body.theme-jarvis .wb-task { border-radius: 3px !important; border-color: var(--jv-line) !important; background: rgba(79, 227, 255, 0.04) !important; }

    /* 위쪽 막대 · 아래 도구 막대 */
    body.theme-jarvis .topbar-glass {
      background: linear-gradient(180deg, rgba(3, 14, 24, 0.9), rgba(3, 14, 24, 0.55)) !important;

    body.theme-jarvis .menu-item i { color: var(--jv-cyan); }

    body.theme-jarvis .bg-\[\#050a14\]\/90 { background-color: rgba(2, 8, 15, 0.78); }
    body.theme-jarvis .wb-cf-band { border-top: 2px solid var(--jv-line-hi) !important; }
    body.theme-jarvis .wb-cf-band.is-now { border-top-color: var(--jv-green) !important; box-shadow: 0 -8px 30px -12px rgba(62, 230, 165, 0.6); }

    @media (prefers-reduced-motion: reduce) {
      /* 링 회전도 윈도우 설정과 상관없이 돈다 */
    }

    /* 🐰🐱 돌아다니는 토끼·고양이 */
    .pets { position: absolute; inset: 0; pointer-events: none; z-index: 9500; overflow: hidden; }
    .pet { position: absolute; left: 0; top: 0; will-change: transform; }
    .pet-flip { transition: transform .25s; }
    .pet-svg { display: block; overflow: visible; }
    .pet .pet-body { transform-box: view-box; transform-origin: 50% 92%; animation: pet-breathe 2.6s ease-in-out infinite; }
    @keyframes pet-breathe { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.025, .975); } }
    .pet .pet-eyes { transform-box: fill-box; transform-origin: 50% 50%; animation: pet-blink 4.2s infinite; }
    .pet-cat .pet-eyes { animation-delay: 1.3s; }
    @keyframes pet-blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
    .pet .pet-ears { transform-box: view-box; transform-origin: 63% 38%; animation: pet-ear 3.4s ease-in-out infinite; }
    @keyframes pet-ear { 0%, 80%, 100% { transform: rotate(0); } 86% { transform: rotate(-6deg); } 92% { transform: rotate(4deg); } }
    .pet .pet-tail { transform-box: view-box; transform-origin: 27% 76%; animation: pet-tail 1.8s ease-in-out infinite; }
    @keyframes pet-tail { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(10deg); } }
    /* 움직일 때: 토끼는 깡충, 고양이는 종종걸음 */
    .pet-bunny.is-moving .pet-body { animation: pet-hop .42s cubic-bezier(.3, .1, .5, 1) infinite; }
    @keyframes pet-hop {
      0%, 100% { transform: translateY(0) scale(1.06, .9); }
      40% { transform: translateY(-14px) scale(.96, 1.06) rotate(-4deg); }
      70% { transform: translateY(-5px) rotate(3deg); }
    }
    .pet-bunny.is-moving .pet-shadow { animation: pet-shadow .42s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pet-shadow { 0%, 100% { transform: scale(1); } 40% { transform: scale(.7); opacity: .6; } }
    .pet-cat.is-moving .pet-body { animation: pet-trot .3s ease-in-out infinite; }
    @keyframes pet-trot { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    .pet .pet-leg-a, .pet .pet-leg-b { transform-box: fill-box; transform-origin: 50% 0; }
    .pet-cat.is-moving .pet-leg-a { animation: pet-leg .3s ease-in-out infinite; }
    .pet-cat.is-moving .pet-leg-b { animation: pet-leg .3s ease-in-out infinite reverse; }
    @keyframes pet-leg { 0%, 100% { transform: rotate(28deg); } 50% { transform: rotate(-28deg); } }
    body.theme-jarvis .pet-svg { filter: drop-shadow(0 0 6px rgba(79, 227, 255, 0.35)); }

    /* 대시보드 폭이 좁으면(화면 배율 큼) 위쪽 단추는 아이콘만 */
    @media (max-width: 760px) {
      .topbar-glass .topbar-btn > span:not([class*="rounded-full"]) { display: none; }
      .topbar-glass .topbar-btn { padding-left: 10px; padding-right: 10px; }
    }
    @media (max-width: 520px) { .topbar-glass > div:first-child > span { display: none; } }

    /* === JARVIS polish === (디자인 다듬기: 겉모습만. 기능 코드는 그대로)
       1) 패널을 조금 더 진하게 → 뒤의 신경망 선이 글자를 가리지 않게
       2) 흐린 글씨 대비 4.5:1 이상으로 올림 (계산값은 보고서 참고)
       3) TV·멀리서 보는 핵심 정보(시각·남은 시간·지금 교시)를 크게
       4) HUD 반응: 패널 부팅, 시간자 스캔선, 완료 체크 펄스, 알림 스캔-인
       5) 갤탭(tablet-app): 글씨 16px 이상, 누르는 곳 44px 이상, 호버 없이도 수정·삭제 버튼 보이기 */
    body.theme-jarvis {
      --jv-panel: rgba(4, 18, 30, 0.86);
      --jv-panel-2: rgba(3, 13, 22, 0.9);
      --jv-dim: #9cc3d3;          /* 10.1:1 (예전 #86aebf 8.0:1) */
      --jv-faint: #7fa6b8;        /* 5.5:1 이상 (예전 #5f8496 은 강조칸 위에서 3.5:1 → 부족) */
      --wb-dim: var(--jv-dim);
    }
    /* 1) 패널 */
    body.theme-jarvis .widget-container.glass-card,
    body.theme-jarvis .widget-container.glass-card-warm {
      background:
        linear-gradient(180deg, rgba(79, 227, 255, 0.06), transparent 38px),
        linear-gradient(180deg, var(--jv-panel), var(--jv-panel-2)) !important;
      box-shadow: inset 0 1px 0 rgba(79, 227, 255, 0.14), inset 0 0 48px rgba(79, 227, 255, 0.045), 0 10px 30px -12px rgba(0, 0, 0, 0.8);
      animation: jv-boot .42s cubic-bezier(.2, .7, .2, 1) backwards;
    }
    body.theme-jarvis .widget-container::before,
    body.theme-jarvis .widget-container::after { transition: width .25s ease, height .25s ease, opacity .25s ease; }
    body.theme-jarvis .widget-container:hover::before,
    body.theme-jarvis .widget-container:hover::after { width: 26px; height: 26px; opacity: 1; }
    @keyframes jv-boot {
      0% { opacity: 0; clip-path: inset(0 0 100% 0); filter: brightness(1.8); }
      60% { opacity: 1; filter: brightness(1.25); }
      100% { opacity: 1; clip-path: inset(0 0 0 0); filter: none; }
    }

    /* 2) 글씨 대비 */
    body.theme-jarvis .text-slate-400 { color: var(--jv-dim); }
    body.theme-jarvis .text-slate-500,
    body.theme-jarvis .text-slate-600 { color: var(--jv-faint); }
    body.theme-jarvis .bg-rose-600 { background-color: #c22f3d; }   /* 흰 글씨 5.6:1 (예전 3.0:1) */
    body.theme-jarvis .wb-title { font-size: 1rem; letter-spacing: 0.05em; }
    body.theme-jarvis .topbar-glass > div:first-child > span { font-family: "Oxanium", "IBM Plex Sans KR", sans-serif; font-weight: 700; letter-spacing: 0.12em; }
    body.theme-jarvis .wb-task { font-size: 0.95rem; }
    body.theme-jarvis .wb-task .text-xs { font-size: 0.92rem; }
    body.theme-jarvis .wb-task:hover { box-shadow: inset 2px 0 0 var(--jv-cyan); }
    body.theme-jarvis input::placeholder, body.theme-jarvis textarea::placeholder { color: var(--jv-faint); opacity: 1; }
    body.theme-jarvis input:focus, body.theme-jarvis textarea:focus, body.theme-jarvis select:focus {
      border-color: var(--jv-cyan) !important; box-shadow: 0 0 0 1px var(--jv-cyan), 0 0 14px rgba(79, 227, 255, 0.28);
    }

    /* 3) 멀리서도 보이게: 시각 · 남은 시간 · 지금 교시 */
    body.theme-jarvis .wb-band .wb-clock { font-size: clamp(2.2rem, min(16cqw, 30cqh), 7rem) !important; font-weight: 600; }
    body.theme-jarvis .wb-next { padding: 10px 16px; }
    body.theme-jarvis .wb-next-k { font-size: 0.85rem; letter-spacing: 0.08em; color: var(--jv-dim); }
    body.theme-jarvis .wb-next-big { font-size: clamp(1.4rem, min(5cqw, 12cqh), 2.4rem); line-height: 1.05; text-shadow: 0 0 14px currentColor; }
    body.theme-jarvis .wb-next-meta { font-size: 0.9rem; color: var(--jv-dim); }
    body.theme-jarvis .wb-band-status { font-size: 1rem; letter-spacing: 0.02em; }
    body.theme-jarvis .wb-next.is-now { animation: jv-live 2.8s ease-in-out infinite; }
    @keyframes jv-live {
      0%, 100% { box-shadow: inset 3px 0 0 var(--jv-green), 0 0 14px rgba(62, 230, 165, 0.10); }
      50% { box-shadow: inset 3px 0 0 var(--jv-green), 0 0 26px rgba(62, 230, 165, 0.30); }
    }
    body.theme-jarvis .wb-next:active, body.theme-jarvis .dock-tool:active, body.theme-jarvis .topbar-btn:active { transform: scale(0.97); }

    /* 4) HUD 반응 */
    /* 시간자 위를 지나가는 스캔선 (7초에 한 번, 아주 옅게) */
    body.theme-jarvis .wb-ruler-track { overflow: hidden; }
    body.theme-jarvis .wb-ruler-track::after {
      content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 18%; pointer-events: none;
      background: linear-gradient(90deg, transparent, rgba(79, 227, 255, 0.10) 70%, rgba(190, 248, 255, 0.28) 98%, transparent);
      transform: translateX(-120%); animation: jv-sweep 7s linear infinite;
    }
    @keyframes jv-sweep { 0% { transform: translateX(-120%); } 45%, 100% { transform: translateX(620%); } }
    /* 할 일 완료: 다이아몬드 체크가 한 번 번쩍 */
    body.theme-jarvis .wb-check.is-done { animation: jv-check .5s ease-out; }
    body.theme-jarvis .wb-check.is-done::after {
      content: ""; position: absolute; left: 4px; top: 1px; width: 4px; height: 8px;
      border: solid #04121e; border-width: 0 2px 2px 0; transform: rotate(0deg);
    }
    @keyframes jv-check {
      0% { transform: rotate(45deg) scale(.5); box-shadow: 0 0 0 0 rgba(62, 230, 165, .9); }
      55% { transform: rotate(45deg) scale(1.05); box-shadow: 0 0 0 9px rgba(62, 230, 165, 0); }
      100% { transform: rotate(45deg) scale(.82); box-shadow: 0 0 10px var(--jv-green); }
    }
    /* 알림 띠 */
    body.theme-jarvis .jv-toast {
      background: linear-gradient(90deg, rgba(4, 22, 36, 0.96), rgba(6, 28, 44, 0.96)) !important;
      border: 1px solid var(--jv-line-hi) !important; border-radius: 4px !important;
      color: var(--jv-ink) !important; font-size: 1rem;
      box-shadow: 0 0 0 1px rgba(0,0,0,.5), 0 0 28px rgba(79, 227, 255, 0.22) !important;
      animation: jv-toast-in .32s cubic-bezier(.2, .7, .2, 1) backwards;
    }
    body.theme-jarvis .jv-toast i { color: var(--jv-cyan) !important; }
    @keyframes jv-toast-in { from { opacity: 0; clip-path: inset(0 50% 0 50%); } to { opacity: 1; clip-path: inset(0 0 0 0); } }
    /* 위쪽 막대 아래 가는 빛줄 */
    body.theme-jarvis .topbar-glass { box-shadow: 0 1px 0 rgba(79, 227, 255, 0.08), 0 8px 24px -16px rgba(79, 227, 255, 0.5); }
    body.theme-jarvis .dock-tool { min-height: 56px; font-size: 13px; letter-spacing: 0.02em; }
    body.theme-jarvis .dock-tool .ico { filter: drop-shadow(0 0 6px rgba(79, 227, 255, 0.35)); }

    /* 5) 📲 갤탭 앱: 손가락·글씨 크기 (모든 테마 공통) */
    html.tablet-app body { font-size: 16px; }
    html.tablet-app .widget-container .text-xs,
    html.tablet-app .widget-container .text-sm,
    html.tablet-app .fixed .text-xs { font-size: 16px; line-height: 1.45; }
    html.tablet-app .widget-container .text-\[11px\],
    html.tablet-app .widget-container .text-\[10px\] { font-size: 14px; }
    html.tablet-app .wb-title { font-size: 17px !important; }
    html.tablet-app .topbar-btn { height: 44px; min-width: 44px; padding: 0 14px; font-size: 15px; justify-content: center; }
    html.tablet-app .menu-item { min-height: 48px; font-size: 16px; }
    html.tablet-app .widget-close,
    html.tablet-app .fixed button.w-8 { min-width: 44px; min-height: 44px; }
    html.tablet-app .drag-handle { min-height: 44px; display: inline-flex; align-items: center; }
    html.tablet-app .widget-container :is(button, select, input:not([type="checkbox"]):not([type="radio"])) { min-height: 44px; }
    html.tablet-app .widget-container .wb-task { min-height: 52px; }
    html.tablet-app .wb-task .group-hover\:opacity-100 { opacity: 1; min-width: 44px; }   /* 갤탭엔 마우스 올리기가 없어서 늘 보이게 */
    html.tablet-app .widget-container[data-w="gcal"] .group-hover\:opacity-100 { opacity: 1; min-width: 44px; }   /* 일정 삭제(✕) 버튼도 갤탭에서 늘 보이게 */
    html.tablet-app .dock-tool { min-height: 60px; min-width: 72px; font-size: 14px; }
    html.tablet-app .wb-next-meta { font-size: 16px; }
    html.tablet-app .widget-container, html.tablet-app .fixed { word-break: keep-all; overflow-wrap: anywhere; }   /* 한글이 낱글자로 끊기지 않게 */

    /* 움직임 줄이기: 이번에 더한 HUD 효과만 끈다.
       (배경 신경망·교시 링·토끼/고양이는 원래 코드가 일부러 윈도우 설정을 따르지 않음 → ⚙ 설정의 '배경 신경망 움직임 끄기'·'토끼·고양이 숨기기'로 끈다) */
    @media (prefers-reduced-motion: reduce) {
      body.theme-jarvis .widget-container.glass-card,
      body.theme-jarvis .widget-container.glass-card-warm,
      body.theme-jarvis .wb-next.is-now,
      body.theme-jarvis .wb-check.is-done,
      body.theme-jarvis .jv-toast { animation: none !important; }
      body.theme-jarvis .wb-ruler-track::after { display: none; }
      body.theme-jarvis .widget-container::before,
      body.theme-jarvis .widget-container::after { transition: none; }
      body.theme-jarvis .wb-next:active, body.theme-jarvis .dock-tool:active, body.theme-jarvis .topbar-btn:active { transform: none; }
    }

    /* === JARVIS polish r2 === (2차 디자인 다듬기: 겉모습만. 기능 코드는 그대로)
       1) 설정 메뉴·모든 설정 창·확인 창을 같은 HUD 틀로: 진한 판 + 하늘빛 테두리 + 네 모서리 괄호 + 머리띠 빛줄
       2) 창 안 작은 글씨 키우기(12px → 13.5px), 입력칸·단추 모양 통일, 오류/성공 글에 기호(⚠ ✓)
       3) 수업 화면·도구 창: 큰 숫자 더 크게, 고른 단추엔 색 말고도 밑줄·표시가 생김
       4) 갤탭(800px)·작은 화면: 창이 화면 밖으로 안 나가고 안에서 스크롤, 아래 도구 막대는 안전 여백
       5) 키보드 Tab 이동 때 하늘빛 테두리로 어디 있는지 보이게
       ※ 새 움직임(창 열림 스캔)은 윈도우 '애니메이션 줄이기'가 켜져 있으면 꺼진다 */

    /* ---------- 모든 테마 공통: 크기·접근성 ---------- */
    .jv-dialog { max-width: 100% !important; }
    .jv-dialog-scroll { max-height: calc(100dvh - 24px); overflow-y: auto; }
    .jv-dialog-sm { width: min(380px, 100%); }
    .jv-dialog .text-xs { font-size: 13.5px; line-height: 1.55; }
    .jv-dialog .text-\[11px\], .jv-dialog .text-\[10px\] { font-size: 12.5px; }
    .jv-menu { max-height: calc(100dvh - 72px); overflow-y: auto; }
    /* 고른 탭: 색 말고도 밑줄로 표시 */
    .jv-seg [aria-pressed="true"], .jv-tab[aria-pressed="true"] { box-shadow: inset 0 -3px 0 currentColor; }
    /* 학생 화면 활동 순서: 지금 단계에 '◀ 지금' 표시 */
    .jv-step[aria-current="step"]::after { content: "◀ 지금"; float: right; font-size: 12px; font-weight: 900; opacity: .85; }
    /* 오류·주의·성공 글 앞 기호 (색만으로 알리지 않기) */
    .jv-msg-ico.jv-msg-err::before { content: "⚠ "; }
    .jv-msg-ico.jv-msg-warn::before { content: "! "; font-weight: 900; }
    .jv-msg-ico.jv-msg-ok::before { content: "✓ "; font-weight: 900; }
    .jv-msg:empty::before { content: none; }
    /* 낙서장: 색·굵기 단추를 누르기 쉽게, 고른 색엔 ✓ */
    .jv-swatch { width: 34px !important; height: 34px !important; position: relative; }
    .jv-swatch[aria-pressed="true"]::after { content: "✓"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 900; font-size: 16px; text-shadow: 0 0 3px #000; }
    .jv-wbtool { min-width: 36px; min-height: 36px; }
    div:has(> .jv-swatch) { padding: 4px 4px 2px; }
    .jv-swatch[aria-pressed="true"] { border-color: #fff !important; }
    /* 학생 화면 조종판: 좁을 때 제목줄이 낱글자로 끊기지 않게 */
    .jv-stu { word-break: keep-all; }
    .jv-stu .justify-between { flex-wrap: wrap; gap: 4px 8px; }
    /* 갤탭 */
    html.tablet-app .jv-dialog .text-sm { font-size: 16px; }
    html.tablet-app .jv-dialog :is(button, input:not([type="checkbox"]):not([type="radio"]), select, summary) { min-height: 44px; }
    html.tablet-app .jv-swatch { width: 44px !important; height: 44px !important; }
    html.tablet-app .jv-wbtool { min-width: 44px; min-height: 44px; }
    html.tablet-app .jv-stu button, html.tablet-app .jv-stu input:not([type="checkbox"]) { min-height: 44px; }
    html.tablet-app .jv-stu .text-xs { font-size: 15px; }
    html.tablet-app .jv-alert { font-size: 15px !important; }
    html.tablet-app .wb-dock { bottom: calc(10px + env(safe-area-inset-bottom, 0px)); max-width: calc(100vw - 16px); }
    html.tablet-app .jv-scrim { padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }

    /* ---------- 자비스 테마 ---------- */
    /* 1) 창 틀 */
    body.theme-jarvis .jv-scrim { background: rgba(1, 6, 12, 0.8) !important; backdrop-filter: blur(6px); }
    body.theme-jarvis .jv-dialog,
    body.theme-jarvis .jv-menu,
    body.theme-jarvis #tabSet > div {
      background:
        linear-gradient(var(--jv-cyan), var(--jv-cyan)) top left / 20px 2px no-repeat,
        linear-gradient(var(--jv-cyan), var(--jv-cyan)) top left / 2px 20px no-repeat,
        linear-gradient(var(--jv-cyan), var(--jv-cyan)) bottom right / 20px 2px no-repeat,
        linear-gradient(var(--jv-cyan), var(--jv-cyan)) bottom right / 2px 20px no-repeat,
        linear-gradient(180deg, rgba(79, 227, 255, 0.07), transparent 72px),
        linear-gradient(180deg, #061a28, #04111c) !important;
      border: 1px solid var(--jv-line-hi) !important;
      border-radius: 4px !important;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.6), 0 0 42px rgba(79, 227, 255, 0.16), 0 24px 60px -20px #000 !important;
      color: var(--jv-ink);
    }
    body.theme-jarvis .jv-dialog { animation: jv-dlg-in .3s cubic-bezier(.2, .7, .2, 1) backwards; }
    @keyframes jv-dlg-in {
      0% { opacity: 0; clip-path: inset(48% 0 48% 0); filter: brightness(1.8); }
      60% { opacity: 1; clip-path: inset(0 0 0 0); filter: brightness(1.2); }
      100% { opacity: 1; clip-path: inset(0 0 0 0); filter: none; }
    }
    body.theme-jarvis .jv-dialog-head {
      border-bottom: 1px solid transparent !important;
      border-image: linear-gradient(90deg, var(--jv-cyan), rgba(79, 227, 255, 0.18) 45%, transparent) 1;
    }
    body.theme-jarvis .jv-dialog-head :is(h3, .text-xl, .text-sm.font-bold) {
      color: var(--jv-ink) !important; letter-spacing: 0.04em; text-shadow: 0 0 12px rgba(79, 227, 255, 0.35);
    }
    body.theme-jarvis .jv-dialog-head h3 { font-size: 1.1rem; }
    body.theme-jarvis .jv-sec { color: var(--jv-cyan) !important; letter-spacing: 0.05em; padding-left: 12px; position: relative; }
    body.theme-jarvis .jv-sec::before {
      content: ""; position: absolute; left: 0; top: 50%; width: 6px; height: 6px; margin-top: -3px;
      background: var(--jv-cyan); transform: rotate(45deg); box-shadow: 0 0 8px var(--jv-cyan);
    }
    body.theme-jarvis .jv-dialog .bg-slate-900\/60,
    body.theme-jarvis .jv-dialog .bg-slate-900\/70,
    body.theme-jarvis .jv-dialog .bg-slate-900\/80 { background-color: rgba(79, 227, 255, 0.05); }
    body.theme-jarvis .jv-dialog code { background: rgba(79, 227, 255, 0.12); color: var(--jv-ink); }
    body.theme-jarvis .jv-dialog details summary { color: var(--jv-dim); }

    /* 2) 입력칸 · 단추 */
    body.theme-jarvis .jv-dialog :is(input:not([type="checkbox"]):not([type="radio"]), select, textarea),
    body.theme-jarvis #tabSet input {
      background: rgba(1, 8, 14, 0.92) !important; border: 1px solid rgba(79, 227, 255, 0.32) !important;
      border-radius: 3px !important; color: var(--jv-ink) !important;
    }
    body.theme-jarvis .jv-dialog input.text-xs { font-size: 14px; }
    body.theme-jarvis .jv-btn-primary {
      background: var(--jv-cyan) !important; color: #031019 !important; border: 1px solid var(--jv-cyan) !important;
      border-radius: 3px !important; font-weight: 800; letter-spacing: 0.03em; min-height: 40px;
      box-shadow: 0 0 16px rgba(79, 227, 255, 0.32); transition: background .15s, box-shadow .15s, transform .1s;
    }
    body.theme-jarvis .jv-btn-primary:hover { background: #8aeeff !important; box-shadow: 0 0 24px rgba(79, 227, 255, 0.5); }
    body.theme-jarvis .jv-btn-primary:disabled { opacity: .55; box-shadow: none; cursor: progress; }
    body.theme-jarvis .jv-btn-ghost {
      background: rgba(79, 227, 255, 0.06) !important; color: var(--jv-ink) !important; border: 1px solid var(--jv-line) !important;
      border-radius: 3px !important; min-height: 40px; transition: background .15s, border-color .15s, transform .1s;
    }
    body.theme-jarvis .jv-btn-ghost:hover { background: rgba(79, 227, 255, 0.14) !important; border-color: var(--jv-line-hi) !important; }
    body.theme-jarvis .jv-close {
      background: transparent !important; color: #ff8a95 !important; border: 1px solid rgba(255, 93, 108, 0.55) !important;
      border-radius: 3px !important; width: 40px !important; height: 40px !important; font-size: 16px;
    }
    body.theme-jarvis .jv-close:hover { background: rgba(255, 93, 108, 0.2) !important; color: #fff !important; }
    body.theme-jarvis :is(.jv-btn-primary, .jv-btn-ghost, .jv-close):active { transform: scale(0.97); }
    body.theme-jarvis #tabSet button { border-radius: 3px !important; }
    body.theme-jarvis #tsClose { background: var(--jv-cyan) !important; color: #031019 !important; }

    /* 3) 알림 글 · 오류 띠 */
    body.theme-jarvis .jv-msg {
      display: inline-block; padding: 6px 10px; border-left: 3px solid currentColor; border-radius: 2px;
      background: rgba(79, 227, 255, 0.06);
    }
    body.theme-jarvis .jv-msg:empty { padding: 0; border: 0; background: none; }
    body.theme-jarvis .jv-msg-err { color: #ffb3ba !important; background: rgba(255, 93, 108, 0.1); }      /* 10.5:1 */
    body.theme-jarvis .jv-msg-warn { color: var(--jv-amber) !important; background: rgba(255, 181, 71, 0.08); }
    body.theme-jarvis .jv-msg-ok { color: var(--jv-green) !important; background: rgba(62, 230, 165, 0.08); }
    body.theme-jarvis .jv-alert {
      background: linear-gradient(90deg, rgba(255, 93, 108, 0.18), rgba(255, 93, 108, 0.05)) !important;
      border: 1px solid rgba(255, 93, 108, 0.5) !important; border-left: 3px solid var(--jv-red) !important;
      border-radius: 2px !important; color: #ffc2c8 !important;                                              /* 9.7:1 */
      box-shadow: 0 0 16px -6px rgba(255, 93, 108, 0.6);
    }
    body.theme-jarvis .widget-container .jv-alert { font-size: 12.5px; font-weight: 600; }
    body.theme-jarvis .jv-loading { color: var(--jv-cyan); letter-spacing: 0.04em; }

    /* 4) 설정 메뉴 */
    body.theme-jarvis .jv-menu { animation: jv-dlg-in .22s cubic-bezier(.2, .7, .2, 1) backwards; }
    body.theme-jarvis .jv-menu-k { color: var(--jv-cyan) !important; opacity: .9; font-size: 12px; letter-spacing: 0.14em; }
    body.theme-jarvis .jv-menu .border-slate-800 { border-color: var(--jv-line) !important; }
    body.theme-jarvis .jv-menu .menu-item { border-radius: 3px; }
    body.theme-jarvis .jv-menu .menu-item:hover { background: rgba(79, 227, 255, 0.12); box-shadow: inset 2px 0 0 var(--jv-cyan); }
    body.theme-jarvis .jv-menu select { color: var(--jv-ink); }

    /* 5) 탭 (학교 정보 · 캘린더 · 학생 화면 · 수업 관리) */
    body.theme-jarvis .jv-seg { border-color: var(--jv-line) !important; background: rgba(1, 8, 14, 0.7) !important; border-radius: 3px !important; }
    body.theme-jarvis .jv-seg button { color: var(--jv-dim); border-radius: 2px !important; }
    body.theme-jarvis .jv-seg button:hover { color: var(--jv-ink); }
    body.theme-jarvis :is(.jv-seg button, .jv-tab)[aria-pressed="true"] {
      background: rgba(79, 227, 255, 0.18) !important; color: var(--jv-ink) !important;
      border-color: var(--jv-line-hi) !important; box-shadow: inset 0 -2px 0 var(--jv-cyan), 0 0 12px rgba(79, 227, 255, 0.18);
    }
    body.theme-jarvis .jv-step[aria-current="step"] { background: rgba(79, 227, 255, 0.18) !important; color: var(--jv-ink) !important; box-shadow: inset 3px 0 0 var(--jv-cyan); }

    /* 6) 수업 도구: 멀리서도 보이는 큰 숫자 */
    body.theme-jarvis .jv-bignum {
      font-family: "Oxanium", "IBM Plex Sans KR", sans-serif; font-variant-numeric: tabular-nums;
      font-size: clamp(4.5rem, 11vw, 7.5rem); font-weight: 600; letter-spacing: 0.02em;
      text-shadow: 0 0 22px currentColor, 0 0 2px currentColor;
    }
    body.theme-jarvis .jv-bignum-xl { font-size: clamp(6rem, 16vw, 10rem); }
