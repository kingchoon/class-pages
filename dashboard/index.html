      return (
        <div className="flex flex-col gap-4 py-3">
          <div className="grid grid-cols-2 gap-3">
            <input type="number" aria-label="총 학생 수" value={totalStu} onChange={(e) => setTotalStu(e.target.value)} className="bg-slate-900 px-4 py-3 rounded-xl border border-slate-800 font-bold text-white text-sm outline-none" placeholder="총 학생 수" />
            <input type="number" aria-label="편성 모둠 수" value={groupCnt} onChange={(e) => setGroupCnt(e.target.value)} className="bg-slate-900 px-4 py-3 rounded-xl border border-slate-800 font-bold text-white text-sm outline-none" placeholder="편성 모둠 수" />
          </div>
          <div className="h-72 overflow-y-auto custom-scroll bg-slate-900/80 rounded-2xl p-4 border border-slate-800 grid grid-cols-2 gap-3 text-sm">
            {groups.length === 0 ? (
              <div className="col-span-2 text-center text-slate-500 py-24 font-semibold">편성 버튼을 누르면 모둠이 자동 배정됩니다.</div>
            ) : (
              groups.map((g, idx) => (
                <div key={idx} className="bg-slate-950 p-4 rounded-xl border border-cyan-800/40 flex flex-col justify-between gap-2">
                  <div className="font-black text-cyan-400 flex justify-between items-center text-base border-b border-slate-800 pb-1.5">
                    <span>✨ {idx + 1}모둠</span>
                    <span className="text-xs px-2 py-0.5 rounded-full bg-cyan-950 text-cyan-300 font-mono">{g.length}명</span>
                  </div>
                  <div className="text-slate-100 font-bold text-base leading-relaxed">{g.join(', ')}</div>
                </div>
              ))
            )}
          </div>
          <div className="flex gap-3">
            <button onClick={generate} className="flex-1 py-4 bg-cyan-500 hover:bg-cyan-400 text-slate-950 text-base font-black rounded-2xl shadow-xl transition">
              🎲 자동 편성하기
            </button>
            <button onClick={copyGroups} className="px-6 py-4 bg-slate-800 hover:bg-slate-700 text-cyan-300 text-sm font-bold rounded-2xl border border-slate-700 transition">
              결과 복사
            </button>
            {onSendToStudent && (
              <button onClick={() => { if (groups.length === 0) { onToast('편성된 모둠이 없습니다.'); return; } onSendToStudent(groups); }} className="px-6 py-4 bg-sky-600 hover:bg-sky-500 text-white text-sm font-black rounded-2xl transition">
                📺 학생 화면에 띄우기
              </button>
            )}
          </div>
        </div>
      );
    }

    function EvalSystemEmbedViewer() {
      const iframeRef = useRef(null);

      useEffect(() => {
        const templateEl = document.getElementById('eval-app-template');
        if (templateEl && iframeRef.current) {
          const rawHtml = templateEl.innerHTML || templateEl.textContent;
          const blob = new Blob([rawHtml], { type: 'text/html;charset=utf-8' });
          iframeRef.current.src = URL.createObjectURL(blob);
        }
      }, []);

      return (
        <div className="w-full h-full bg-slate-950 rounded-2xl overflow-hidden relative border border-slate-800 shadow-2xl">
          <iframe
            ref={iframeRef}
            title="수행평가 채점표 및 세특 시스템"
            className="w-full h-full border-none rounded-2xl bg-white"
          />
        </div>
      );
    }

    // =====================================================================
    // 🎓 수업 도우미: 내 시간표 · 차시 계획 · 반별 진도 · 수업 화면 · 학생 화면 조종
    // =====================================================================
    const WEEKDAY_NAMES = ['일', '월', '화', '수', '목', '금', '토'];
    const CLASS_PERIODS = PERIOD_SCHEDULE.filter(p => !p.isBreak);
    const PERIOD_TIME_MIN = (hhmm) => { const [h, m] = hhmm.split(':').map(Number); return h * 60 + m; };

    function loadJSONKey(key, fallback) {
      try { const v = JSON.parse(localStorage.getItem(key) || 'null'); return v == null ? fallback : v; } catch (e) { return fallback; }
    }
    function saveJSONKey(key, value) {
      try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
    }

    // 시간표 칸 "2-4 기술실" → { cls: '2-4', room: '기술실' }
    function parseTimetableCell(raw) {
      const t = String(raw || '').trim();
      if (!t) return null;
      const [cls, ...rest] = t.split(/\s+/);
      return { cls, room: rest.join(' ') };
    }
    function gradeOfClass(cls) { const m = String(cls).match(/^(\d)/); return m ? m[1] : ''; }
    function classLabel(cls) {
      const m = String(cls).match(/^(\d)\s*-\s*(\d+)$/);
      return m ? `${m[1]}학년 ${m[2]}반` : String(cls);
    }

    // 차시 계획 한 줄: "차시 제목 | 준비물 | 활동1 > 활동2 > 활동3"
    function parseLessonPlan(text) {
      return String(text || '').split('\n').map(l => l.trim()).filter(Boolean).map(line => {
        const parts = line.split('|').map(s => s.trim());
        return {
          title: parts[0] || '',
          prep: parts[1] || '',
          steps: (parts[2] || '').split('>').map(s => s.trim()).filter(Boolean)
        };
      });
    }

    function getLessonInfo(cls, plans, progress) {
      const plan = parseLessonPlan((plans || {})[gradeOfClass(cls)]);
      const prog = (progress || {})[cls] || {};
      const n = Math.max(1, prog.lesson || 1);
      return { n, total: plan.length, lesson: plan[n - 1] || null, memo: prog.memo || '', lastDone: prog.lastDone || '' };
    }

    function todayKey(d) {
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    // 지금이 어떤 때인지 계산: 수업 중(class) / 곧 수업(prep, 5분 전) / 수업 없는 시간(free) / 오늘 수업 끝(after)
    function getClassContext(now, timetable) {
      const day = now.getDay();
      const nowMin = now.getHours() * 60 + now.getMinutes();
      const rowOf = (d) => (d >= 1 && d <= 5) ? ((timetable || {})[d] || {}) : {};
      const listFor = (d) => CLASS_PERIODS.map(p => {
        const c = parseTimetableCell(rowOf(d)[p.label]);
        return c ? { ...c, period: p.label, start: PERIOD_TIME_MIN(p.start), end: PERIOD_TIME_MIN(p.end), startStr: p.start, endStr: p.end } : null;
      }).filter(Boolean);
      const today = listFor(day);
      const current = today.find(c => nowMin >= c.start && nowMin < c.end) || null;
      const next = today.find(c => c.start > nowMin) || null;
      let mode = 'free';
      if (current) mode = 'class';
      else if (next && next.start - nowMin <= 5) mode = 'prep';
      else if (!next) mode = 'after';
      // 다음 수업일의 첫 수업 (방과 후·주말용)
      let upcoming = null;
      if (!next) {
        for (let i = 1; i <= 7 && !upcoming; i++) {
          const d = (day + i) % 7;
          const l = listFor(d);
          if (l.length) upcoming = { ...l[0], dayName: i === 1 ? '내일' : `${WEEKDAY_NAMES[d]}요일` };
        }
      }
      const hasAny = [1, 2, 3, 4, 5].some(d => listFor(d).length > 0);
      return {
        mode, current, next, today, upcoming, hasAny,
        minsToNext: next ? next.start - nowMin : null,
        minsLeft: current ? current.end - nowMin : null,
        nowMin
      };
    }

    function fmtMs(ms) {
      const s = Math.max(0, Math.ceil(ms / 1000));
      return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
    }
    function timerRemainingMs(t, nowMs) {
      if (!t) return 0;
      return t.endAt ? Math.max(0, t.endAt - nowMs) : (t.remainingMs || 0);
    }

    // ------------------------------------------------------------------ 수업 관리 창

    // 🏫 NEIS 반별 시간표에서 '내 과목' 시간만 모아 내 시간표 만들기
    function NeisTimetableImport({ timetable, setTimetable }) {
      const [open, setOpen] = useState(false);
      const [grades, setGrades] = useState(['2']);
      const [kw, setKw] = useState('기술');
      const [room, setRoom] = useState('');
      const [weekOff, setWeekOff] = useState(0);
      const [busy, setBusy] = useState(false);
      const [res, setRes] = useState(null);
      const [pick, setPick] = useState({});      // "요일-교시" → 고른 반 ('' = 넣지 않음)
      const ymd = (d) => `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
      const load = async (off = weekOff) => {
        setBusy(true); setRes(null);
        try {
          const d = new Date(); d.setDate(d.getDate() + off * 7);
          const r = await dApiFetch(`/api/neis/mytimetable?grades=${grades.join(',')}&kw=${encodeURIComponent(kw)}&date=${ymd(d)}`);
          const j = await r.json();
          setRes(j);
          if (j.success) {
            const p = {};
            (j.slots || []).forEach(sl => { const k = `${sl.wd}-${sl.period}`; p[k] = p[k] === undefined ? sl.cls : p[k]; });
            setPick(p);
          }
        } catch (e) { setRes({ success: false, error: '대시보드 서버에 연결할 수 없어요.' }); }
        setBusy(false);
      };
      const grid = {};
      ((res && res.slots) || []).forEach(sl => { const k = `${sl.wd}-${sl.period}`; (grid[k] = grid[k] || []); if (!grid[k].includes(sl.cls)) grid[k].push(sl.cls); });
      const apply = (mode) => {
        setTimetable(prev => {
          const next = {};
          [1, 2, 3, 4, 5].forEach(d => { next[d] = mode === 'replace' ? {} : { ...((prev || {})[d] || {}) }; });
          Object.entries(pick).forEach(([k, cls]) => {
            if (!cls) return;
            const [d, per] = k.split('-').map(Number);
            const label = (CLASS_PERIODS[per - 1] || {}).label;
            if (!label) return;
            if (mode === 'fill' && (next[d][label] || '').trim()) return;
            next[d][label] = room.trim() ? `${cls} ${room.trim()}` : cls;
          });
          return next;
        });
        setOpen(false);
      };
      const fmtD = (s) => s ? `${s.slice(4, 6)}/${s.slice(6, 8)}` : '';
      const many = Object.values(grid).some(v => v.length > 1);
      return (
        <div className="bg-sky-950/40 border border-sky-700/60 rounded-2xl p-4">
          <div className="flex items-center justify-between gap-3">
            <div className="text-sm text-sky-100"><b className="text-sky-300 text-base">🏫 NEIS에서 불러오기</b> — 학교 반별 시간표에서 내 과목 시간만 골라 자동으로 채워요.</div>
            <button onClick={() => setOpen(v => !v)} className="px-4 py-2 rounded-xl bg-sky-500 hover:bg-sky-400 text-slate-950 text-sm font-black whitespace-nowrap">{open ? '접기' : '불러오기'}</button>
          </div>
          {open && (
            <div className="mt-4 flex flex-col gap-3">
              <div className="flex flex-wrap items-center gap-3 text-sm">
                <span className="text-slate-300 font-bold">학년</span>
                {['1', '2', '3'].map(g => (
                  <button key={g} onClick={() => setGrades(prev => prev.includes(g) ? prev.filter(x => x !== g) : [...prev, g].sort())}
                    className={`px-3 py-1.5 rounded-lg font-black ${grades.includes(g) ? 'bg-sky-500 text-slate-950' : 'bg-slate-800 text-slate-300'}`}>{g}학년</button>
                ))}
                <span className="text-slate-300 font-bold ml-3">과목 이름에</span>
                <input value={kw} onChange={e => setKw(e.target.value)} className="w-28 bg-slate-900 border border-slate-700 rounded-lg px-2 py-1.5 font-bold text-amber-200 outline-none focus:border-sky-400" />
                <span className="text-slate-400">이(가) 들어간 시간</span>
                <span className="text-slate-300 font-bold ml-3">장소(선택)</span>
                <input value={room} onChange={e => setRoom(e.target.value)} placeholder="예) 기술실" className="w-28 bg-slate-900 border border-slate-700 rounded-lg px-2 py-1.5 font-bold text-slate-100 outline-none focus:border-sky-400" />
              </div>
              <div className="flex items-center gap-2 text-sm">
                <button onClick={() => { setWeekOff(weekOff - 1); load(weekOff - 1); }} className="px-3 py-1.5 rounded-lg bg-slate-800 text-slate-200 font-bold">◀ 지난주</button>
                <button onClick={() => load(weekOff)} disabled={busy || !grades.length} className="px-4 py-1.5 rounded-lg bg-amber-500 hover:bg-amber-400 text-slate-950 font-black disabled:opacity-50">{busy ? '불러오는 중…' : (weekOff === 0 ? '이번 주 시간표 불러오기' : `${weekOff > 0 ? '+' : ''}${weekOff}주 시간표 불러오기`)}</button>
                <button onClick={() => { setWeekOff(weekOff + 1); load(weekOff + 1); }} className="px-3 py-1.5 rounded-lg bg-slate-800 text-slate-200 font-bold">다음주 ▶</button>
                {res && res.success && <span className="text-slate-400 ml-2">{fmtD(res.from)}~{fmtD(res.to)} · {res.slots.length}시간 찾음</span>}
              </div>
              {res && !res.success && <div className="text-sm text-rose-300 font-bold">⚠️ {res.error}</div>}
              {res && res.success && res.slots.length === 0 && (
                <div className="text-sm text-amber-200 leading-relaxed">이 주에는 '{kw}'이(가) 들어간 시간이 없어요. 시험·방학 주간이면 다른 주를 불러오세요.
                  {res.subjects && res.subjects.length > 0 && <div className="text-xs text-slate-400 mt-1">NEIS에 있는 과목 이름: {res.subjects.join(', ')}</div>}
                </div>
              )}
              {res && res.success && res.slots.length > 0 && (
                <>
                  {many && <div className="text-xs text-amber-200">💡 같은 시간에 여러 반이 있는 칸은 다른 선생님 수업도 섞여 있다는 뜻이에요. 내 반을 골라 주세요. (NEIS에는 선생님 이름이 없어요)</div>}
                  <table className="w-full border-separate border-spacing-1">
                    <thead><tr><th className="w-16"></th>{[1, 2, 3, 4, 5].map(d => <th key={d} className="text-sm text-slate-300">{WEEKDAY_NAMES[d]}</th>)}</tr></thead>
                    <tbody>
                      {CLASS_PERIODS.map((p, pi) => (
                        <tr key={p.label}>
                          <td className="text-xs font-bold text-slate-400">{p.label}</td>
                          {[1, 2, 3, 4, 5].map(d => {
                            const k = `${d}-${pi + 1}`, opts = grid[k] || [];
                            if (!opts.length) return <td key={d} className="text-center text-slate-700 text-xs">—</td>;
                            return (
                              <td key={d}>
                                <select value={pick[k] || ''} onChange={e => setPick(prev => ({ ...prev, [k]: e.target.value }))}
                                  className={`w-full rounded-lg px-2 py-1.5 text-sm font-bold outline-none border ${pick[k] ? 'bg-amber-950/60 border-amber-600/70 text-amber-100' : 'bg-slate-900 border-slate-700 text-slate-500'} ${opts.length > 1 ? 'ring-1 ring-amber-400/60' : ''}`}>
                                  {opts.map(c => <option key={c} value={c}>{c}</option>)}
                                  <option value="">(내 수업 아님)</option>
                                </select>
                              </td>
                            );
                          })}
                        </tr>
                      ))}
                    </tbody>
                  </table>
                  <div className="flex items-center gap-2 justify-end">
                    <button onClick={() => apply('fill')} className="px-4 py-2 rounded-xl bg-slate-700 hover:bg-slate-600 text-slate-100 text-sm font-black">빈칸만 채우기</button>
                    <button onClick={() => { if (confirm('지금 시간표를 지우고 NEIS 내용으로 바꿀까요?')) apply('replace'); }} className="px-4 py-2 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 text-sm font-black">내 시간표를 이걸로 바꾸기</button>
                  </div>
                </>
              )}
            </div>
          )}
        </div>
      );
    }

    function ClassSetupModal({ timetable, setTimetable, plans, setPlans, progress, setProgress, onClose, initialTab }) {
      const [tab, setTab] = useState(initialTab || 'timetable');
      const classes = Array.from(new Set(
        [1, 2, 3, 4, 5].flatMap(d => Object.values((timetable || {})[d] || {}).map(v => (parseTimetableCell(v) || {}).cls).filter(Boolean))
      )).sort((a, b) => a.localeCompare(b, 'ko', { numeric: true }));
      const grades = Array.from(new Set(['1', '2', '3', ...classes.map(gradeOfClass).filter(Boolean)])).sort();
      const [grade, setGrade] = useState(() => (classes[0] && gradeOfClass(classes[0])) || '2');

      const setCell = (d, label, val) => {
        setTimetable(prev => ({ ...prev, [d]: { ...((prev || {})[d] || {}), [label]: val } }));
      };
      const setProg = (cls, patch) => setProgress(prev => ({ ...prev, [cls]: { ...((prev || {})[cls] || { lesson: 1, memo: '' }), ...patch } }));

      const planPreview = parseLessonPlan(plans[grade]);

      const tabBtn = (id, label) => (
        <button onClick={() => setTab(id)} aria-pressed={tab === id} className={`jv-tab px-4 py-2 rounded-xl text-sm font-bold transition ${tab === id ? 'bg-amber-500 text-slate-950' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}`}>{label}</button>
      );

      return (
        <div className="jv-scrim fixed inset-0 z-[10020] bg-black/75 backdrop-blur-sm flex items-center justify-center p-3 sm:p-6" onMouseDown={(e) => { if (e.target === e.currentTarget) onClose(); }}>
          <div role="dialog" aria-modal="true" className="jv-dialog w-[1100px] max-w-[96vw] max-h-[90vh] bg-slate-950 border border-amber-500/60 rounded-3xl shadow-2xl flex flex-col overflow-hidden">
            <div className="jv-dialog-head flex items-center justify-between gap-3 px-4 sm:px-6 py-4 border-b border-slate-800">
              <div className="flex items-center gap-3 flex-wrap min-w-0">
                <span className="text-xl font-black text-amber-300">🎓 수업 관리</span>
                <div className="flex gap-1.5 ml-3">
                  {tabBtn('timetable', '🗓️ 내 시간표')}
                  {tabBtn('plans', '📚 차시 계획')}
                  {tabBtn('progress', '📈 반별 진도')}
                </div>
              </div>
              <button onClick={onClose} className="jv-btn-primary flex-shrink-0 px-4 py-2 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-sm">완료</button>
            </div>

            <div className="flex-1 overflow-y-auto custom-scroll p-6 select-text">
              {tab === 'timetable' && (
                <div className="flex flex-col gap-4">
                  <div className="text-sm text-slate-300 leading-relaxed bg-slate-900/80 border border-slate-800 rounded-2xl p-4">
                    내가 들어가는 수업만 적어 주세요. 칸에 <b className="text-amber-300">반</b>을 쓰고, 필요하면 한 칸 띄고 <b className="text-amber-300">장소</b>를 써요.
                    <span className="ml-2 font-mono text-amber-200">예) 2-4 기술실</span> · 빈칸 = 수업 없음
                  </div>
                  <NeisTimetableImport timetable={timetable} setTimetable={setTimetable} />
                  <table className="w-full border-separate border-spacing-1.5">
                    <thead>
                      <tr>
                        <th className="w-28"></th>
                        {[1, 2, 3, 4, 5].map(d => <th key={d} className="text-base font-black text-slate-200 py-1">{WEEKDAY_NAMES[d]}</th>)}
                      </tr>
                    </thead>
                    <tbody>
                      {CLASS_PERIODS.map(p => (
                        <tr key={p.label}>
                          <td className="text-sm font-bold text-slate-300 pr-2">
                            {p.label}<div className="text-[11px] font-mono text-slate-500">{p.start}~{p.end}</div>
                          </td>
                          {[1, 2, 3, 4, 5].map(d => {
                            const v = (((timetable || {})[d] || {})[p.label]) || '';
                            return (
                              <td key={d}>
                                <input
                                  value={v}
                                  onChange={(e) => setCell(d, p.label, e.target.value)}
                                  placeholder="—"
                                  className={`w-full rounded-xl px-3 py-2.5 text-sm font-bold outline-none border transition ${v.trim() ? 'bg-amber-950/50 border-amber-600/60 text-amber-100' : 'bg-slate-900 border-slate-800 text-slate-200'} focus:border-amber-400`}
                                />
                              </td>
                            );
                          })}
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}

              {tab === 'plans' && (
                <div className="flex flex-col gap-4">
                  <div className="flex items-center gap-2">
                    {grades.map(g => (
                      <button key={g} onClick={() => setGrade(g)} aria-pressed={grade === g} className={`jv-tab px-4 py-2 rounded-xl text-sm font-black ${grade === g ? 'bg-sky-500 text-slate-950' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}`}>{g}학년</button>
                    ))}
                  </div>
                  <div className="text-sm text-slate-300 leading-relaxed bg-slate-900/80 border border-slate-800 rounded-2xl p-4">
                    한 줄에 한 차시씩 적어요. 칸은 <b className="text-sky-300">|</b> 로 나누고, 활동 순서는 <b className="text-sky-300">&gt;</b> 로 이어요.<br />
                    <span className="font-mono text-sky-200">차시 제목 | 준비물 | 활동1 &gt; 활동2 &gt; 활동3</span><br />
                    <span className="font-mono text-slate-400">예) 전기 회로 만들기 | 브레드보드, LED, 저항 | 안전 수칙 확인 &gt; 회로도 보기 &gt; 모둠별 조립 &gt; 정리</span>
                  </div>
                  <div className="grid grid-cols-2 gap-4">
                    <textarea
                      value={plans[grade] || ''}
                      onChange={(e) => setPlans(prev => ({ ...prev, [grade]: e.target.value }))}
                      spellCheck={false}
                      placeholder={'1차시 제목 | 준비물 | 활동1 > 활동2\n2차시 제목 | 준비물 | 활동1 > 활동2'}
                      className="h-[52vh] bg-slate-900 border border-slate-700 focus:border-sky-400 rounded-2xl p-4 text-sm text-slate-100 font-mono leading-7 outline-none resize-none custom-scroll"
                    />
                    <div className="h-[52vh] overflow-y-auto custom-scroll flex flex-col gap-2 pr-1">
                      {planPreview.length === 0 ? (
                        <div className="text-slate-500 text-sm text-center mt-20">왼쪽에 적으면 여기에 차시 카드로 보여요.</div>
                      ) : planPreview.map((l, i) => (
                        <div key={i} className="bg-slate-900/80 border border-slate-800 rounded-xl p-3">
                          <div className="text-sm font-black text-slate-100"><span className="text-sky-300 mr-1.5">{i + 1}차시</span>{l.title}</div>
                          {l.prep && <div className="text-xs text-amber-200 mt-1">🧰 {l.prep}</div>}
                          {l.steps.length > 0 && <div className="text-xs text-slate-400 mt-1">{l.steps.map((s, j) => `${j + 1}. ${s}`).join('   ')}</div>}
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              )}

              {tab === 'progress' && (
                <div className="flex flex-col gap-3">
                  {classes.length === 0 ? (
                    <div className="text-center text-slate-400 py-16">먼저 <b>내 시간표</b>에 반을 적어 주세요.</div>
                  ) : classes.map(cls => {
                    const info = getLessonInfo(cls, plans, progress);
                    return (
                      <div key={cls} className="flex items-center gap-4 bg-slate-900/80 border border-slate-800 rounded-2xl p-3">
                        <div className="w-28 text-lg font-black text-slate-100">{classLabel(cls)}</div>
                        <div className="flex items-center gap-1.5">
                          <button onClick={() => setProg(cls, { lesson: Math.max(1, info.n - 1) })} className="w-9 h-9 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 font-black">−</button>
                          <div className="w-24 text-center text-base font-black text-amber-300">{info.n}차시{info.total ? <span className="text-xs text-slate-500"> / {info.total}</span> : ''}</div>
                          <button onClick={() => setProg(cls, { lesson: info.n + 1 })} className="w-9 h-9 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 font-black">+</button>
                        </div>
                        <div className="w-64 text-sm text-slate-300 truncate" title={info.lesson ? info.lesson.title : ''}>{info.lesson ? info.lesson.title : <span className="text-slate-500">(차시 계획 없음)</span>}</div>
                        <input
                          value={info.memo}
                          onChange={(e) => setProg(cls, { memo: e.target.value })}
                          placeholder="지난 시간 메모 (예: 조립 절반까지, 3모둠 부품 부족)"
                          className="flex-1 bg-slate-950 border border-slate-800 focus:border-amber-400 rounded-xl px-3 py-2 text-sm text-slate-100 outline-none"
                        />
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    // ------------------------------------------------------------------ 수업 화면 (시간에 따라 자동으로 뜨는 큰 화면)
    function ClassFocusPanel({ ctx, now, plans, progress, setProgress, onDismiss, onOpenSetup, studentPanel }) {
      const narrow = dashViewW() < 1300;
      const tiny = dashViewW() < 780;   // 화면 배율이 커서 대시보드가 아주 좁을 때는 위아래로 쌓는다
      const target = ctx.current || ctx.next || ctx.upcoming;
      const info = target ? getLessonInfo(target.cls, plans, progress) : null;
      const [memoDraft, setMemoDraft] = useState('');
      const [justAdvanced, setJustAdvanced] = useState(null);
      const tKey = todayKey(now);

      useEffect(() => { setMemoDraft(''); setJustAdvanced(null); }, [target && target.cls, target && target.period]);

      const advance = () => {
        if (!target) return;
        const cls = target.cls;
        const prev = (progress || {})[cls] || { lesson: 1, memo: '' };
        setJustAdvanced({ cls, prev });
        setProgress(p => ({ ...p, [cls]: { ...prev, lesson: (prev.lesson || 1) + 1, memo: memoDraft.trim(), lastDone: tKey } }));
        playChimeSound();
      };
      const undo = () => {
        if (!justAdvanced) return;
        setProgress(p => ({ ...p, [justAdvanced.cls]: justAdvanced.prev }));
        setJustAdvanced(null);
      };

      let badge = null;
      if (ctx.mode === 'class') badge = { text: `수업 중 · ${ctx.minsLeft}분 남음`, cls: 'bg-emerald-500 text-slate-950' };
      else if (ctx.mode === 'prep') badge = { text: `곧 시작 · ${ctx.minsToNext}분 뒤`, cls: 'bg-amber-400 text-slate-950 animate-pulse' };
      else if (ctx.next) badge = { text: `다음 수업 · ${ctx.minsToNext >= 60 ? `${Math.floor(ctx.minsToNext / 60)}시간 ${ctx.minsToNext % 60}분` : `${ctx.minsToNext}분`} 뒤`, cls: 'bg-sky-500 text-slate-950' };
      else if (ctx.upcoming) badge = { text: `오늘 수업 끝 · ${ctx.upcoming.dayName} 첫 수업`, cls: 'bg-slate-600 text-white' };

      const doneToday = target && info && info.lastDone === tKey && !justAdvanced;

      return (
        <>
        <div className="absolute inset-0 z-[34] bg-[#050a14]/90 backdrop-blur-md" />
        <div className="absolute z-[35] flex flex-col gap-3" style={{ top: LAYOUT_TOP, left: 14, right: 14, bottom: LAYOUT_BOTTOM }}>
          {/* 맨 위: 지금 어느 반 수업인지 크게 + 오늘 시간자 */}
          <div className={`wb-cf-band ${ctx.mode === 'class' ? 'is-now' : ''} ${ctx.mode === 'prep' ? 'is-soon' : ''} rounded-3xl bg-slate-950/95 border border-slate-700 shadow-2xl ${narrow ? 'p-4' : 'p-5'} flex-shrink-0`}>
            <div className="flex items-start justify-between gap-4">
              <div className="min-w-0">
                {badge && <span className={`wb-cf-badge inline-block px-3 py-1 rounded-full text-sm font-black ${badge.cls}`}>{badge.text}</span>}
                {target ? (
                  <div className="mt-2 flex items-end gap-x-4 gap-y-1 flex-wrap">
                    <div className={`wb-display ${narrow ? 'text-5xl' : 'text-6xl'} font-black text-white leading-none`}>{classLabel(target.cls)}</div>
                    <div className="text-lg font-bold text-slate-300 pb-1">
                      {target.room && <span className="text-sky-300">📍 {target.room} · </span>}
                      {target.dayName ? `${target.dayName} ` : ''}{target.period} · <span className="font-mono">{target.startStr}~{target.endStr}</span>
                    </div>
                  </div>
                ) : (
                  <div className="mt-2 text-3xl font-black text-slate-100">{ctx.hasAny ? '이번 주 남은 수업이 없어요' : '수업 화면'}</div>
                )}
              </div>
              <div className="flex flex-col items-end gap-2 flex-shrink-0">
                <button onClick={onDismiss} className="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm font-bold" title="위젯 화면으로 돌아가기">평소 화면 ✕</button>
                {ctx.mode === 'class' && <div className="wb-cf-count"><span className="wb-num">{ctx.minsLeft}</span>분 남음</div>}
                {ctx.mode !== 'class' && ctx.next && <div className="wb-cf-count is-wait"><span className="wb-num">{ctx.minsToNext}</span>분 뒤 시작</div>}
              </div>
            </div>
            {ctx.today.length > 0 && <PeriodRuler now={now} myClasses={Object.fromEntries(ctx.today.map(c => [c.period, c.cls]))} />}
          </div>

          <div className={`grid grid-cols-12 gap-3 flex-1 min-h-0 ${tiny ? 'overflow-y-auto custom-scroll content-start' : ''}`}>
          {/* 왼쪽: 이번 차시 */}
          <div className={`${tiny ? 'col-span-12 p-4' : narrow ? 'col-span-6 p-4' : 'col-span-5 p-6'} rounded-3xl bg-slate-950/95 border border-slate-700 shadow-2xl flex flex-col min-h-0 overflow-y-auto custom-scroll`}>
            {!ctx.hasAny ? (
              <div className="m-auto text-center flex flex-col items-center gap-4">
                <div className="text-5xl">🗓️</div>
                <div className="text-2xl font-black text-slate-100">내 시간표를 먼저 적어 주세요</div>
                <div className="text-base text-slate-400 leading-relaxed">시간표를 알면 수업 5분 전에 이 화면이 저절로 뜨고,<br />반마다 몇 차시인지 알려 줘요.</div>
                <button onClick={() => onOpenSetup('timetable')} className="mt-2 px-6 py-3 rounded-2xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-base">🗓️ 내 시간표 입력하기</button>
              </div>
            ) : !target ? (
              <div className="m-auto text-center text-xl text-slate-400">이번 주 남은 수업이 없어요.</div>
            ) : (
              <>
                <div className="wb-lesson rounded-2xl bg-slate-900/90 border border-slate-800 p-5">
                  <div className="flex items-center justify-between">
                    <span className="text-base font-black text-amber-300">{info.n}차시{info.total ? <span className="text-slate-500 font-bold"> / 전체 {info.total}차시</span> : ''}</span>
                    {info.total > 0 && (
                      <div className="w-40 h-2 rounded-full bg-slate-800 overflow-hidden">
                        <div className="h-full bg-amber-400" style={{ width: `${Math.min(100, ((info.n - 1) / info.total) * 100)}%` }} />
                      </div>
                    )}
                  </div>
                  <div className={`mt-2 ${narrow ? 'text-2xl' : 'text-3xl'} font-black text-slate-50 leading-snug`}>
                    {info.lesson ? info.lesson.title : <button onClick={() => onOpenSetup('plans')} className="text-lg text-sky-300 underline">차시 계획을 적어 두면 여기 수업 제목이 나와요 →</button>}
                  </div>
                  {info.lesson && info.lesson.prep && (
                    <div className="mt-4 flex flex-wrap gap-2">
                      <span className="text-sm font-bold text-slate-400 py-1">🧰 준비물</span>
                      {info.lesson.prep.split(/[,，、]/).map(s => s.trim()).filter(Boolean).map((s, i) => (
                        <span key={i} className="px-3 py-1 rounded-lg bg-amber-950/70 border border-amber-700/60 text-amber-100 text-sm font-bold">{s}</span>
                      ))}
                    </div>
                  )}
                </div>

                {info.memo && (
                  <div className="mt-4 rounded-2xl bg-sky-950/60 border border-sky-800/60 p-4">
                    <div className="text-xs font-black text-sky-300 mb-1">📝 지난 시간 메모</div>
                    <div className="text-base text-slate-100 leading-relaxed">{info.memo}</div>
                  </div>
                )}

                <div className="mt-auto pt-4 flex flex-col gap-2">
                  {justAdvanced ? (
                    <div className="flex items-center justify-between rounded-2xl bg-emerald-950/70 border border-emerald-600/60 px-4 py-3">
                      <span className="text-base font-black text-emerald-300">✔ 다음 시간엔 {getLessonInfo(target.cls, plans, progress).n}차시부터!</span>
                      <button onClick={undo} className="text-sm font-bold text-slate-300 underline">되돌리기</button>
                    </div>
                  ) : (
                    <>
                      <input
                        value={memoDraft}
                        onChange={(e) => setMemoDraft(e.target.value)}
                        placeholder="다음 시간을 위한 메모 (안 써도 돼요)"
                        aria-label="다음 시간을 위한 메모"
                        className="w-full bg-slate-900 border border-slate-700 focus:border-emerald-400 rounded-xl px-4 py-2.5 text-sm text-slate-100 outline-none select-text"
                      />
                      <button onClick={advance} className={`w-full py-3.5 rounded-2xl font-black text-base transition ${doneToday ? 'bg-slate-800 text-slate-300 hover:bg-slate-700' : 'bg-emerald-500 hover:bg-emerald-400 text-slate-950'}`}>
                        {doneToday ? '오늘 이미 진도를 올렸어요 · 한 번 더 올리기' : '✅ 수업 끝! 다음 시간은 다음 차시로'}
                      </button>
                    </>
                  )}
                </div>
              </>
            )}
          </div>

          {/* 가운데: 학생 화면 조종 */}
          <div className={`${tiny ? 'col-span-12' : narrow ? 'col-span-6' : 'col-span-4'} min-h-0`} style={tiny ? { minHeight: 640 } : undefined}>{studentPanel}</div>

          {/* 오른쪽: 오늘 내 수업 */}
          <div className={`${narrow ? 'hidden' : 'col-span-3'} rounded-3xl bg-slate-950/95 border border-slate-700 shadow-2xl p-5 flex flex-col min-h-0`}>
            <div className="flex items-center justify-between mb-3">
              <span className="text-lg font-black text-slate-100">📅 오늘 내 수업</span>
            </div>
            <div className="flex-1 overflow-y-auto custom-scroll flex flex-col gap-2 pr-1">
              {ctx.today.length === 0 ? (
                <div className="text-slate-500 text-sm text-center mt-10">오늘은 수업이 없어요.</div>
              ) : ctx.today.map(c => {
                const st = ctx.nowMin >= c.end ? 'done' : (ctx.nowMin >= c.start ? 'now' : 'later');
                const li = getLessonInfo(c.cls, plans, progress);
                return (
                  <div key={c.period} className={`rounded-2xl px-4 py-3 border ${st === 'now' ? 'bg-emerald-950/70 border-emerald-500' : st === 'done' ? 'bg-slate-900/50 border-slate-800 opacity-60' : 'bg-slate-900/90 border-slate-700'}`}>
                    <div className="flex items-center justify-between">
                      <span className="text-sm font-bold text-slate-400">{c.period} <span className="font-mono text-xs">{c.startStr}</span></span>
                      {st === 'now' && <span className="text-xs font-black text-emerald-300">● 지금</span>}
                      {st === 'done' && <span className="text-xs font-bold text-slate-500">끝</span>}
                    </div>
                    <div className="text-lg font-black text-slate-100">{classLabel(c.cls)} {c.room && <span className="text-sm text-sky-300 font-bold">· {c.room}</span>}</div>
                    <div className="text-xs text-slate-400 truncate">{li.n}차시 {li.lesson ? `· ${li.lesson.title}` : ''}</div>
                  </div>
                );
              })}
            </div>
            <button onClick={() => onOpenSetup('timetable')} className="mt-3 w-full py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm font-bold">⚙️ 시간표 · 차시 계획 · 진도 관리</button>
          </div>
          </div>
        </div>
        </>
      );

    // ------------------------------------------------------------------ 학생 화면 조종판
    function StudentControlPanel({ open, onOpen, onClose, stu, setStu, nowMs, onFillFromLesson, canFill, report }) {
      const rem = timerRemainingMs(stu.timer, nowMs);

      const [msgDraft, setMsgDraft] = useState(stu.message || '');

      const setTimer = (patch) => setStu(s => ({ ...s, timer: { ...s.timer, ...patch } }));
      const preset = (min) => setTimer({ totalMs: min * 60000, remainingMs: min * 60000, endAt: null });
      const startPause = () => {
        if (running) setTimer({ remainingMs: Math.max(0, stu.timer.endAt - Date.now()), endAt: null });
        else {
          const r = rem > 0 ? rem : (stu.timer.totalMs || 300000);
          setTimer({ remainingMs: r, endAt: Date.now() + r, totalMs: stu.timer.totalMs || r });
        }
      };
      const reset = () => setTimer({ remainingMs: stu.timer.totalMs || 300000, endAt: null });
      const addMin = () => running
        ? setTimer({ endAt: stu.timer.endAt + 60000, totalMs: (stu.timer.totalMs || 0) + 60000 })
        : setTimer({ remainingMs: rem + 60000, totalMs: (stu.timer.totalMs || 0) + 60000 });

      // 모둠 편성 (학생 수·모둠 수는 다음에도 기억)
      const [grpTotal, setGrpTotal] = useState(() => { try { return (JSON.parse(localStorage.getItem('MODONG_GROUP_DEFAULTS') || '{}').total) || 28; } catch (e) { return 28; } });
      const [grpCount, setGrpCount] = useState(() => { try { return (JSON.parse(localStorage.getItem('MODONG_GROUP_DEFAULTS') || '{}').count) || 6; } catch (e) { return 6; } });
      const makeGroups = () => {
        const tot = Math.max(2, Math.min(200, parseInt(grpTotal, 10) || 28));
        const cnt = Math.max(1, Math.min(tot, 200, parseInt(grpCount, 10) || 6));
        try { localStorage.setItem('MODONG_GROUP_DEFAULTS', JSON.stringify({ total: tot, count: cnt })); } catch (e) {}
        const arr = Array.from({ length: tot }, (_, i) => `${i + 1}번`);
        for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }
        const res = Array.from({ length: cnt }, () => []);
        arr.forEach((v, i) => res[i % cnt].push(v));
        res.forEach(g => g.sort((a, b) => parseInt(a, 10) - parseInt(b, 10)));
        setStu(s => ({ ...s, groups: res, view: 'groups' }));
        playBeepSound(700, 0.08);
      };

      // 🎯 발표자 뽑기 (학생 화면에 크게)
      const [pkTo, setPkTo] = useState(() => { try { return (JSON.parse(localStorage.getItem('MODONG_GROUP_DEFAULTS') || '{}').total) || 28; } catch (e) { return 28; } });
      const [pkNoRepeat, setPkNoRepeat] = useState(true);
      const [pkRolling, setPkRolling] = useState(false);
      const [pkShow, setPkShow] = useState(null);
      const pkHistory = (stu.pick && stu.pick.history) || [];
      const rollPick = () => {
        if (pkRolling) return;
        const to = Math.max(1, Math.min(200, parseInt(pkTo, 10) || 28));
        let pool = [];
        for (let i = 1; i <= to; i++) if (!pkNoRepeat || !pkHistory.includes(i)) pool.push(i);
        if (!pool.length) { setStu(s => ({ ...s, pick: { ...(s.pick || {}), history: [] } })); return; }
        const n = pool[Math.floor(Math.random() * pool.length)];
        const dur = 2200;
        setStu(s => ({ ...s, view: 'pick', pick: { n, from: 1, to, at: Date.now(), dur, history: [n, ...pkHistory] } }));
        setPkRolling(true);
        const started = Date.now();
        const iv = setInterval(() => {
          if (Date.now() - started >= dur) { clearInterval(iv); setPkShow(n); setPkRolling(false); playFanfareSound(); return; }

      };

      const viewBtn = (id, label) => (
        <button onClick={() => setStu(s => ({ ...s, view: id }))} aria-pressed={stu.view === id} className={`jv-tab flex-1 py-2 px-1 rounded-xl text-xs font-black whitespace-nowrap transition ${stu.view === id ? 'bg-sky-500 text-slate-950' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}`}>{label}</button>

        <div className="jv-stu h-full rounded-3xl bg-slate-950/95 border border-slate-700 shadow-2xl p-4 xl:p-5 flex flex-col gap-3 min-h-0 overflow-y-auto custom-scroll">

                <button key={m} onClick={() => preset(m)} className="py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm font-bold">{m}분</button>

          {stu.view === 'pick' ? (
            <div className="rounded-2xl bg-slate-900/90 border border-pink-700/60 p-4 flex-1 min-h-[200px] flex flex-col">
              <div className="flex items-center justify-between mb-2">

              </div>
              <div className="flex items-center gap-1.5">
                <span className="text-xs font-bold text-slate-400">1번 ~</span>
                <input type="number" min="1" aria-label="마지막 번호" value={pkTo} onChange={(e) => setPkTo(e.target.value)} className="w-16 bg-slate-950 border border-slate-700 rounded-lg px-2 py-1.5 text-sm font-bold text-white outline-none select-text" />

              {pkHistory.length > 0 && <button onClick={() => { setPkShow(null); setStu(s => ({ ...s, pick: { ...(s.pick || {}), history: [] } })); }} className="mt-1 self-end text-xs font-bold text-slate-500 hover:text-slate-300 underline">처음부터 다시</button>}

                ) : stu.groups.map((g, i) => (
                  <div key={i} className="rounded-xl bg-slate-950 border border-slate-800 px-2.5 py-2">

            <div className="rounded-2xl bg-black border border-slate-700 p-4 flex-1 min-h-[200px] flex flex-col items-center justify-center gap-3 text-center">

              <div className="text-sm text-slate-400 leading-relaxed">아래 '한 줄 알림'에 글을 쓰면<br />검은 화면 가운데에 그 글이 크게 나와요.</div>
              <button onClick={() => setStu(s => ({ ...s, view: 'lesson' }))} className="mt-1 px-5 py-2.5 rounded-xl bg-sky-500 hover:bg-sky-400 text-slate-950 text-sm font-black">👀 다시 보이기</button>

              {(stu.steps || []).length === 0 ? (

                <button key={i} onClick={() => setStu(x => ({ ...x, stepIdx: i }))} aria-current={i === stu.stepIdx ? 'step' : undefined} className={`jv-step text-left px-3 py-2 rounded-xl text-sm font-bold transition ${i === stu.stepIdx ? 'bg-sky-500 text-slate-950' : i < stu.stepIdx ? 'text-slate-500 line-through' : 'text-slate-200 hover:bg-slate-800'}`}>
                  {i < stu.stepIdx ? '✓' : `${i + 1}.`} {s}
                </button>
              ))}

            {(stu.steps || []).length > 0 && (
              <div className="flex gap-1.5 mt-2">

                <button onClick={() => setStu(x => ({ ...x, stepIdx: Math.min(x.steps.length - 1, x.stepIdx + 1) }))} className="flex-[2] py-2 rounded-xl bg-sky-600 hover:bg-sky-500 text-white text-sm font-black">다음 활동 ▶</button>

          <form onSubmit={(e) => { e.preventDefault(); setStu(s => ({ ...s, message: msgDraft.trim() })); }} className="flex gap-1.5">
            <input value={msgDraft} onChange={(e) => setMsgDraft(e.target.value)} aria-label="학생 화면에 띄울 한 줄 알림" placeholder="학생 화면에 띄울 한 줄 (예: 공구 내려놓고 앞을 봐요)" className="flex-1 min-w-0 bg-slate-900 border border-slate-700 focus:border-sky-400 rounded-xl px-3 py-2 text-sm text-slate-100 outline-none select-text" />
            <button type="submit" className="px-3 rounded-xl bg-sky-600 hover:bg-sky-500 text-white text-sm font-black">띄우기</button>
            {stu.message && <button type="button" onClick={() => { setMsgDraft(''); setStu(s => ({ ...s, message: '' })); }} className="px-2.5 rounded-xl bg-slate-800 text-slate-300 text-sm font-bold">지우기</button>}
          </form>
        </div>
      );
    }

    // ------------------------------------------------------------------ 📱 태블릿 연결 창 (QR 코드)
    function loadQrLib() {
      if (window.QRCode) return Promise.resolve(window.QRCode);
      if (window.__qrLoading) return window.__qrLoading;
      window.__qrLoading = new Promise((ok, no) => {
        const sc = document.createElement('script');
        sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
        sc.onload = () => ok(window.QRCode);
        sc.onerror = () => { window.__qrLoading = null; no(new Error('QR 라이브러리를 불러오지 못했어요')); };
        document.head.appendChild(sc);
      });
      return window.__qrLoading;
    }
    function QrBox({ text, size = 180 }) {
      const ref = useRef(null);
      const [err, setErr] = useState('');
      useEffect(() => {
        if (!text || !ref.current) return;
        ref.current.innerHTML = '';
        loadQrLib().then(Q => {
          if (!ref.current) return;
          ref.current.innerHTML = '';
          new Q(ref.current, { text, width: size, height: size, correctLevel: Q.CorrectLevel.M });
        }).catch(e => setErr(e.message));
      }, [text, size]);
      return (
        <div className="bg-white rounded-2xl p-3 inline-flex items-center justify-center" style={{ width: size + 24, height: size + 24 }}>
          {err ? <span className="text-xs text-slate-700 text-center">{err}</span> : <div ref={ref} />}
        </div>
      );
    }

                  <span className="text-sm text-rose-200/90">Tailscale이 '연결됨'이어도 이것 때문에 리모컨 주소가 안 열려요. 학교 노트북은 관리자 비밀번호가 필요할 수 있어요.</span>

            <div className="rounded-2xl border border-slate-700 bg-slate-900/60 p-4">
              <button onClick={() => setShowTrouble(v => !v)} className="text-[15px] font-black text-slate-200 hover:text-white">{showTrouble ? '▾' : '▸'} 연결이 안 될 때 확인하기</button>
              {showTrouble && (

                    노트북과 갤탭의 Tailscale 앱 목록에 상대 기기 이름이 있어야 해요. 없으면 <b>같은 계정으로 로그인했는지</b> 확인하세요. (한쪽은 구글, 한쪽은 다른 계정이면 서로 안 보여요)</div>

                  <div><b className="text-sky-300">③ 서로 보이는데 리모컨 주소만 안 열리나요?</b><br />

                  <div><b className="text-sky-300">④ 학교 노트북에 Tailscale 설치가 안 되나요?</b><br />
                    관리자 권한이 막힌 노트북이에요. 정보부장님께 설치를 부탁하거나, <b>같은 와이파이</b>일 때는 Tailscale 없이 아래 '다른 주소'(192.168…)로도 연결돼요.</div>
                  <div className="text-slate-400">확인용: 갤탭 크롬에서 <span className="font-mono text-slate-200">{ts[0] ? ts[0].split('/tablet')[0] + '/tablet' : 'http://100.x.x.x:58246/tablet'}</span> 를 직접 열어 보세요. "열쇠가 맞지 않아요"가 나오면 연결은 된 거예요(그다음 QR을 찍으면 돼요).</div>

              )}
            </div>

            <div className="flex items-center justify-between text-xs text-slate-500">

                <div className="mt-3 flex gap-4 items-center">
                  {standaloneUrl ? <QrBox text={standaloneUrl} size={130} /> : null}

                    {standaloneUrl ? <>구글 Apps Script에 새 동기화 스크립트(Code.gs, Tablet.html)를 배포한 경우에만 열려요.<br /><span className="font-mono break-all">{standaloneUrl}</span></> : '구글 시트 연동 주소가 없어요. (필요 없으면 안 써도 돼요)'}
                  </div>
                </div>

          </div>
        </div>

    }

    function App() {
      const [now, setNow] = useState(new Date());
      useEffect(() => {
        const timer = setInterval(() => setNow(new Date()), 1000);
        return () => clearInterval(timer);
      }, []);

      const [toastMsg, setToastMsg] = useState(null);
      const toastTimerRef = useRef(null);
      const showToast = (msg) => {
        setToastMsg(msg);
        if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
        toastTimerRef.current = setTimeout(() => { toastTimerRef.current = null; setToastMsg(null); }, 3000);
      };

      // 현재 교시/쉬는시간 상태 계산 + 교시가 바뀌는 순간 종소리·알림
      const periodInfo = getPeriodStatus(now);
      const lastPeriodKeyRef = useRef(null);
      useEffect(() => {
        if (lastPeriodKeyRef.current === null) {
          lastPeriodKeyRef.current = periodInfo.key;
          return; // 최초 로딩 시에는 울리지 않음
        }
        if (lastPeriodKeyRef.current !== periodInfo.key) {
          lastPeriodKeyRef.current = periodInfo.key;
          playChimeSound();
          showToast(periodInfo.isClassTime ? `🔔 ${periodInfo.key} 시작!` : periodInfo.label);
        }
      }, [periodInfo.key]);

      // 위젯 고정/배치/표시 목록은 파일(backup_data)에 저장되어 껐다 켜도 그대로 유지된다.
      const [isWidgetsLocked, setIsWidgetsLocked] = useState(() => localStorage.getItem('MODONG_WIDGETS_LOCKED') !== '0');
      const [widgetLayouts, setWidgetLayouts] = useState(() => loadSavedLayouts() || calculateExactLayouts());
      const [activeWidgets, setActiveWidgets] = useState(() => loadSavedActiveWidgets());
      const [showSettingsMenu, setShowSettingsMenu] = useState(false);
      const [showTabletModal, setShowTabletModal] = useState(false);

      // 📌 바탕화면 고정 방식 (run.pyw 와 연동)
      const [pinMode, setPinMode] = useState('desktop');
      const [clickClears, setClickClears] = useState(true);
      useEffect(() => {
        dApiFetch('/api/pin/mode').then(r => r.json()).then(d => {
          if (d && d.mode) setPinMode(d.mode);
          if (d && typeof d.clickClears === 'boolean') setClickClears(d.clickClears);
        }).catch(() => {});
      }, []);
      const toggleClickClears = async () => {
        try {
          const r = await dApiFetch(`/api/pin/mode?clear=${clickClears ? 0 : 1}`);
          const d = await r.json();
          if (d && typeof d.clickClears === 'boolean') setClickClears(d.clickClears);
          showToast(d.clickClears ? '🪟 대시보드를 누르면 가리고 있던 창들이 내려가요.' : '🪟 대시보드를 눌러도 다른 창은 그대로 둬요.');
        } catch (e) {}
      };
      // 바탕화면 고정 상태에서 대시보드를 누르면, 가리고 있던 창들을 내린다
      useEffect(() => {
        if (pinMode !== 'desktop' || !clickClears) return;
        let last = 0;
        const onDown = () => {
          const t = Date.now();
          if (t - last < 600) return;
          last = t;
          dApiFetch('/api/pin/front').catch(() => {});
        };
        document.addEventListener('mousedown', onDown, true);
        return () => document.removeEventListener('mousedown', onDown, true);
      }, [pinMode, clickClears]);
      const changePinMode = async (mode) => {
        try {
          const r = await dApiFetch(`/api/pin/mode?set=${mode}`);
          const d = await r.json();
          if (d && d.mode) setPinMode(d.mode);
          showToast(d.mode === 'desktop' ? '📌 대시보드를 바탕화면에 고정했어요. (Ctrl+Alt+D = 바탕화면 보기)' : (d.mode === 'off' ? '📌 바탕화면 고정을 껐어요. 일반 창처럼 동작해요.' : '📌 맨 뒤로 깔아 두는 방식으로 바꿨어요.'));
        } catch (e) { showToast('⚠️ 백엔드 서버에 연결할 수 없습니다.'); }
      };
      // 바탕화면에 고정된 상태에서 입력칸을 누르면, 키보드 입력이 대시보드로 확실히 가게 한다
      useEffect(() => {
        if (pinMode !== 'desktop') return;
        const onDown = (e) => {
          const el = e.target && e.target.closest && e.target.closest('input, textarea, select, [contenteditable="true"]');
          if (!el) return;
          dApiFetch('/api/pin/focus').then(() => { setTimeout(() => { try { el.focus(); } catch (err) {} }, 30); }).catch(() => {});
        };
        document.addEventListener('mousedown', onDown, true);
        return () => document.removeEventListener('mousedown', onDown, true);
      }, [pinMode]);
      // 크롬 제목줄 두께를 백엔드에 알려 준다 → 백엔드가 제목줄을 잘라 내서 안 보이게 한다
      useEffect(() => {
        let last = '';
        const report = () => {
          const dpr = window.devicePixelRatio || 1;
          const dw = Math.round(Math.max(0, window.outerWidth - window.innerWidth) * dpr);
          const dh = Math.round(Math.max(0, window.outerHeight - window.innerHeight) * dpr);
          const key = `${dw},${dh}`;
          if (!dh || key === last) return;
          last = key;
          dApiFetch(`/api/pin/frame?dw=${dw}&dh=${dh}`).catch(() => {});
        };
        const t = setTimeout(report, 800);
        window.addEventListener('resize', report);
        return () => { clearTimeout(t); window.removeEventListener('resize', report); };
      }, []);

      // ---------- 🎓 수업 도우미 상태 ----------
      const [timetable, setTimetable] = useState(() => loadJSONKey('MODONG_MY_TIMETABLE', {}));
      const [lessonPlans, setLessonPlans] = useState(() => loadJSONKey('MODONG_LESSON_PLANS', {}));
      const [lessonVideos, setLessonVideos] = useState(() => loadJSONKey('MODONG_LESSON_VIDEOS', {}));
      const [savedVideos, setSavedVideos] = useState(() => loadJSONKey('MODONG_SAVED_VIDEOS', []));
      useEffect(() => { saveJSONKey('MODONG_SAVED_VIDEOS', savedVideos); }, [savedVideos]);
      useEffect(() => { saveJSONKey('MODONG_LESSON_VIDEOS', lessonVideos); }, [lessonVideos]);
      const [classProgress, setClassProgress] = useState(() => loadJSONKey('MODONG_CLASS_PROGRESS', {}));
      useEffect(() => { saveJSONKey('MODONG_MY_TIMETABLE', timetable); }, [timetable]);
      useEffect(() => { saveJSONKey('MODONG_LESSON_PLANS', lessonPlans); }, [lessonPlans]);
      useEffect(() => { saveJSONKey('MODONG_CLASS_PROGRESS', classProgress); }, [classProgress]);
      const [classSetupTab, setClassSetupTab] = useState(null);   // null 이면 닫힘
      const [focusForced, setFocusForced] = useState(false);
      const [focusDismissedKey, setFocusDismissedKey] = useState(null);

      const classCtx = getClassContext(now, timetable);
      // 수업 중이거나 수업 5분 전이면 '수업 화면'이 저절로 뜬다 (닫으면 그 교시 동안은 다시 안 뜸)
      const autoFocusKey = classCtx.mode === 'class' ? `c-${todayKey(now)}-${classCtx.current.period}`
        : (classCtx.mode === 'prep' ? `p-${todayKey(now)}-${classCtx.next.period}` : null);
      const showClassFocus = focusForced || (!!autoFocusKey && focusDismissedKey !== autoFocusKey);
      const dismissClassFocus = () => { setFocusForced(false); if (autoFocusKey) setFocusDismissedKey(autoFocusKey); };

      // ---------- 📺 학생 화면 ----------
      const [studentOpen, setStudentOpen] = useState(false);
      const [stu, setStu] = useState({
        view: 'lesson', title: '', subtitle: '', prep: '', steps: [], stepIdx: 0, message: '', groups: [],
        timer: { totalMs: 300000, remainingMs: 300000, endAt: null }
      });
      const lessonTarget = classCtx.current || classCtx.next || classCtx.upcoming;
      const fillStudentFromLesson = (t = lessonTarget) => {
        if (!t) return;
        const li = getLessonInfo(t.cls, lessonPlans, classProgress);
        setStu(s => ({
          ...s, view: 'lesson',
          title: li.lesson ? li.lesson.title : `${classLabel(t.cls)} 수업`,
          subtitle: `${classLabel(t.cls)} · ${li.n}차시`,
          prep: li.lesson ? li.lesson.prep : '',
          steps: li.lesson ? li.lesson.steps : [],
          stepIdx: 0
        }));
      };
      // 수업이 바뀌면(다음 교시, 다른 반, 진도 변경) 학생 화면 내용도 저절로 바꾼다
      const autoLessonTarget = classCtx.current || (classCtx.mode === 'prep' ? classCtx.next : null);
      const autoLessonKey = autoLessonTarget ? [todayKey(now), autoLessonTarget.period, autoLessonTarget.cls, getLessonInfo(autoLessonTarget.cls, lessonPlans, classProgress).n].join('|') : null;
      const lastAutoLessonKeyRef = useRef(null);

          setWidgetLayouts(prev => {
            const cur = prev[interacting.id] || calculateExactLayouts()[interacting.id];
            let newX = cur.x, newY = cur.y, newW = cur.width, newH = cur.height;
            if (interacting.mode === 'drag') {
              newX = Math.max(0, interacting.startLeft + deltaX);
              newY = Math.max(LAYOUT_TOP, interacting.startTop + deltaY);
            } else if (interacting.mode === 'right' || interacting.mode === 'corner') {
              newW = Math.max(260, interacting.startW + deltaX);
            }
            if (interacting.mode === 'bottom' || interacting.mode === 'corner') {
              newH = Math.max(180, interacting.startH + deltaY);
            }
            return { ...prev, [interacting.id]: { x: newX, y: newY, width: newW, height: newH } };

      // ================= 구글 시트 동기화 (PC ↔ 갤럭시탭) =================
      // 항목(할 일·시간표·진도 …)마다 '마지막으로 바꾼 시각'을 기억해서,
      // 새 동기화 스크립트(Code.gs, _v:2)와 쓸 때는 더 최근에 바꾼 쪽 값만 남긴다.
      // 예전 스크립트를 쓰면 예전 방식(통째로 덮어쓰기) 그대로 동작한다.
      // 제미나이 API 키(globalApiKey)는 비밀 정보라서 구글 시트로 보내지도, 받아오지도 않는다.
      const SYNC_FIELDS = ['todos', 'events', 'bookmarks', 'folders', 'currentTheme', 'latestDocDigest', 'timetable', 'lessonPlans', 'classProgress', 'lessonVideos', 'savedVideos'];
      const syncValues = { todos, events, bookmarks, folders, currentTheme, latestDocDigest, timetable, lessonPlans: lessonPlans, classProgress: classProgress, lessonVideos, savedVideos };
      const syncValuesRef = useRef(syncValues);
      syncValuesRef.current = syncValues;
      const keyTimesRef = useRef(loadJSONKey('MODONG_SYNC_KEYTIMES', {}));
      const remoteApplyRef = useRef(new Set());
      const prevSyncValuesRef = useRef(null);
      useEffect(() => {
        const prev = prevSyncValuesRef.current;
        prevSyncValuesRef.current = syncValues;
        if (!prev) return;
        let changed = false;
        SYNC_FIELDS.forEach(k => {
          if (prev[k] === syncValues[k]) return;
          if (remoteApplyRef.current.has(k)) { remoteApplyRef.current.delete(k); return; }
          keyTimesRef.current = { ...keyTimesRef.current, [k]: Date.now() };
          changed = true;
        });
        if (changed) saveJSONKey('MODONG_SYNC_KEYTIMES', keyTimesRef.current);
      }, SYNC_FIELDS.map(k => syncValues[k]));

      const syncSetters = {
        todos: (v) => Array.isArray(v) && setTodos(v),
        events: (v) => Array.isArray(v) && setEvents(v),
        bookmarks: (v) => Array.isArray(v) && setBookmarks(v),
        folders: (v) => Array.isArray(v) && setFolders(v),
        currentTheme: (v) => { if (typeof v === 'string' && v) { setCurrentTheme(v); localStorage.setItem('MODONG_THEME', v); } },
        latestDocDigest: (v) => { if (v && typeof v === 'object') { setLatestDocDigest(v); localStorage.setItem('MODONG_LATEST_DOC_DIGEST', JSON.stringify(v)); } },
        timetable: (v) => v && typeof v === 'object' && !Array.isArray(v) && setTimetable(v),
        lessonPlans: (v) => v && typeof v === 'object' && !Array.isArray(v) && setLessonPlans(v),
        lessonVideos: (v) => v && typeof v === 'object' && !Array.isArray(v) && setLessonVideos(v),
        savedVideos: (v) => Array.isArray(v) && setSavedVideos(v),
        classProgress: (v) => v && typeof v === 'object' && !Array.isArray(v) && setClassProgress(v)
      };
      const applyRemoteValue = (k, v, t) => {
        keyTimesRef.current = { ...keyTimesRef.current, [k]: t };
        let same = false;
        try { same = JSON.stringify(v) === JSON.stringify(syncValuesRef.current[k]); } catch (e) {}
        if (!same) { remoteApplyRef.current.add(k); syncSetters[k](v); }
      };

      const pushToGoogleSheet = useCallback(async (targetUrl) => {
        const url = (targetUrl || gasUrl || '').trim();
        if (!url) return;
        setSyncStatus('syncing');
        try {
          const v = syncValuesRef.current;
          const payload = { _keyTimes: { ...keyTimesRef.current } };
          delete payload._keyTimes.globalApiKey;
          SYNC_FIELDS.forEach(k => { payload[k] = v[k]; });
          await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(payload),
            redirect: 'follow'
          });
          setSyncStatus('connected');
        } catch (e) {
          setSyncStatus('error');
        }
      }, [gasUrl]);

      const pullFromGoogleSheet = useCallback(async (targetUrl, isManual = false) => {
        const effectiveUrl = (targetUrl || gasUrl).trim();
        if (!effectiveUrl) {
          isRemoteLoadingRef.current = false;
          if (isManual) showToast('⚠️ 등록된 구글 시트 Web App URL이 없습니다.');
          return;
        }

        setSyncStatus('syncing');
        try {
          const res = await fetch(effectiveUrl, { method: 'GET', redirect: 'follow' });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const cloudData = await res.json();

          const pullStartedAt = Date.now();
          if (cloudData && cloudData._v === 2) {
            // 새 방식: 항목별로 더 최근 것만 가져오고, 내 쪽이 더 최근이면 올려 보낸다
            const times = cloudData._keyTimes || {};
            let needPush = false;
            // 받아 온 값을 화면에 넣는 동안에는 자동 업로드를 막는다 (방금 받은 걸 다시 올리지 않도록)
            isRemoteLoadingRef.current = true;
            SYNC_FIELDS.forEach(k => {
              const lt = Number(keyTimesRef.current[k] || 0);
              if (!(k in cloudData)) { needPush = true; return; }
              const ct = Number(times[k] || 0);
              // 이 기기에서 한 번도 동기화한 적 없는 항목이면 클라우드 값을 그대로 받는다 (새 PC·새 프로필)
              if (ct > lt || !(k in keyTimesRef.current)) applyRemoteValue(k, cloudData[k], ct);
              else if (lt > ct) needPush = true;
            });
            saveJSONKey('MODONG_SYNC_KEYTIMES', keyTimesRef.current);
            setTimeout(() => {
              isRemoteLoadingRef.current = false; remoteApplyRef.current.clear();
              // 받아 오는 0.4초 사이에 이 기기에서 바꾼 것이 있으면 바로 올린다
              if (!needPush && SYNC_FIELDS.some(k => Number(keyTimesRef.current[k] || 0) > pullStartedAt)) pushToGoogleSheet(effectiveUrl);
            }, 400);
            setSyncStatus('connected');
            if (isManual) showToast('🟢 구글 시트로부터 최신 데이터를 불러왔습니다.');
            if (needPush) setTimeout(() => pushToGoogleSheet(effectiveUrl), 300);
            return;
          }

          // 예전 방식 (예전 Apps Script)
          isRemoteLoadingRef.current = true;
          ['todos', 'events', 'bookmarks', 'folders', 'currentTheme', 'latestDocDigest'].forEach(k => {
            if (cloudData[k] != null) { remoteApplyRef.current.add(k); syncSetters[k](cloudData[k]); }
          });
          setSyncStatus('connected');
          if (isManual) showToast('🟢 구글 시트로부터 최신 데이터를 불러왔습니다.');
          setTimeout(() => { isRemoteLoadingRef.current = false; remoteApplyRef.current.clear(); }, 400);
        } catch (err) {
          isRemoteLoadingRef.current = false;
          setSyncStatus('error');
          if (isManual) showToast(`❌ 동기화 실패: ${err.message}`);
        }
      }, [gasUrl, pushToGoogleSheet]);
      const pullRef = useRef(pullFromGoogleSheet);
      pullRef.current = pullFromGoogleSheet;

      useEffect(() => {
        if (gasUrl) {
          pullFromGoogleSheet(gasUrl, false);
        }
      }, []);

      // 태블릿에서 바꾼 내용을 가져오도록 45초마다, 그리고 창이 다시 보일 때 확인
      useEffect(() => {
        if (!gasUrl) return;
        const iv = setInterval(() => { if (!document.hidden) pullRef.current(gasUrl, false); }, 45000);
        const onVis = () => { if (!document.hidden) pullRef.current(gasUrl, false); };
        document.addEventListener('visibilitychange', onVis);
        return () => { clearInterval(iv); document.removeEventListener('visibilitychange', onVis); };
      }, [gasUrl]);

      useEffect(() => {
        if (!gasUrl || isRemoteLoadingRef.current) return;
        const timer = setTimeout(() => pushToGoogleSheet(gasUrl), 1200);

      const getDDayBadge = (targetDateStr) => {
        if (!targetDateStr) return null;
        try {
          const parts = targetDateStr.split('-');
          if (parts.length !== 3) return null;
          const target = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
          target.setHours(0, 0, 0, 0);
          const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
          today.setHours(0, 0, 0, 0);
          const diffDays = Math.round((target.getTime() - today.getTime()) / (1000 * 60 * 60 * 24));
          if (diffDays === 0) return { label: 'D-Day', color: 'bg-rose-600 text-white font-black' };
          if (diffDays > 0) return { label: `D-${diffDays}`, color: 'bg-amber-500 text-slate-950 font-black' };
          return { label: `D+${Math.abs(diffDays)}`, color: 'bg-slate-800 text-slate-300 font-semibold' };
        } catch (e) { return null; }
      };

      const formattedDate = now.toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');

      const renderWidget = (widgetId) => {
        const layout = widgetLayouts[widgetId] || calculateExactLayouts()[widgetId];
        const style = { left: `${layout.x}px`, top: `${layout.y}px`, width: `${layout.width}px`, height: `${layout.height}px` };

        if (widgetId === 'clock') {
          return (
            <div key="clock" data-w="clock" style={style} className="widget-container glass-card rounded-2xl p-4 flex flex-col justify-between shadow-xl">
              <div className="flex items-center justify-between">
                <div className="flex items-center gap-2">
                  <span onPointerDown={(e) => handleMouseDownInteraction('clock', 'drag', e)} className={`drag-handle text-xs px-2 py-1 rounded bg-slate-900/80 border border-slate-800 transition ${isWidgetsLocked ? 'opacity-40 cursor-not-allowed text-slate-600' : 'text-slate-300 hover:text-amber-300'}`}>⠿ 이동</span>
                  <span className="wb-title text-sm font-bold text-sky-300">⏰ 오늘</span>
                </div>
                <button onClick={(e) => removeWidget('clock', e)} title="위젯 숨기기" className="widget-close w-6 h-6 rounded-md hover:bg-rose-900/60 text-slate-400 hover:text-rose-300 text-sm flex items-center justify-center transition">✕</button>
              </div>
              <div className="wb-band">
                <div className="wb-band-time">
                  {currentTheme === 'jarvis' && <PeriodRing now={now} />}
                  <div className="wb-band-time-text">
                  <div className="wb-clock text-7xl font-black font-mono tracking-tight text-slate-50">
                    {hours}:{minutes}<span className="text-3xl text-sky-300/90 ml-1">:{seconds}</span>
                  </div>
                  <div className="wb-band-date text-base text-slate-200 font-semibold mt-2">{formattedDate}</div>
                  </div>
                </div>
                {(() => {
                  const c = classCtx;
                  const t = c.current || c.next || c.upcoming;
                  const fmtGap = (m) => m >= 60 ? `${Math.floor(m / 60)}시간 ${m % 60}분` : `${m}분`;
                  const kind = c.current ? '지금 수업' : c.next ? '다음 수업' : c.upcoming ? `${c.upcoming.dayName} 첫 수업` : '내 시간표';
                  const big = c.current ? `${c.minsLeft}분 남음` : c.next ? `${fmtGap(c.minsToNext)} 뒤` : '';
                  return (
                    <button type="button" onClick={() => c.hasAny ? setFocusForced(true) : setClassSetupTab('timetable')}
                      className={`wb-next ${c.current ? 'is-now' : ''} ${c.mode === 'prep' ? 'is-soon' : ''}`}
                      title={c.hasAny ? '수업 화면 열기' : '내 시간표 입력하기'}>
                      <span className="wb-next-k">{kind}</span>
                      {t ? (
                        <>
                          <span className="wb-next-cls">{classLabel(t.cls)}</span>
                          <span className="wb-next-meta">{t.period} · {t.startStr}~{t.endStr}{t.room ? ` · ${t.room}` : ''}</span>
                          {big && <span className="wb-next-big">{big}</span>}
                        </>
                      ) : (
                        <span className="wb-next-meta wb-keep">{c.hasAny ? '이번 주 남은 수업이 없어요' : '시간표를 넣으면 다음 수업이 여기 나와요'}</span>
                      )}
                    </button>
                  );
                })()}
              </div>
              <div className="wb-band-ruler">
                <div className="wb-band-status">
                  <span className={periodInfo.isClassTime ? 'text-emerald-300' : 'text-amber-300'}>{periodInfo.label}</span>
                  {periodInfo.remainingMin != null && <span className="text-slate-400"> · {periodInfo.nextLabel && !periodInfo.isClassTime ? `${periodInfo.nextLabel}까지 ` : ''}{periodInfo.remainingMin}분 남음</span>}
                </div>
                <PeriodRuler now={now} myClasses={Object.fromEntries((classCtx.today || []).map(c => [c.period, c.cls]))} />
              </div>
              {!isWidgetsLocked && (
                <>
                  <div onPointerDown={(e) => handleMouseDownInteraction('clock', 'right', e)} className="handle-right" />
                  <div onPointerDown={(e) => handleMouseDownInteraction('clock', 'bottom', e)} className="handle-bottom" />
                  <div onPointerDown={(e) => handleMouseDownInteraction('clock', 'corner', e)} className="handle-corner" />
                </>
              )}
            </div>
          );
        }

        if (widgetId === 'tasks') {

            <div key="tasks" data-w="tasks" style={style} className="widget-container glass-card-warm rounded-2xl p-4 flex flex-col justify-between shadow-xl">

                  <span className="wb-title text-base font-bold text-amber-100">📋 오늘 할 일</span>

              <div className="flex-1 overflow-y-auto space-y-1.5 pr-1 custom-scroll my-1">

                  todos.map(t => {

                        <form key={t.id} onSubmit={(e) => handleSaveEditTodo(t.id, e)} className="p-2 rounded-xl bg-slate-950 border border-amber-400 flex flex-col gap-1.5 shadow-md">

                          </button>

                        </div>
                      </div>

              </form>

                  <div onPointerDown={(e) => handleMouseDownInteraction('tasks', 'right', e)} className="handle-right" />

            <div key="school" data-w="school" style={style} className="widget-container glass-card rounded-2xl p-4 shadow-xl">

              {!isWidgetsLocked && (
                <>
                  <div onPointerDown={(e) => handleMouseDownInteraction('school', 'right', e)} className="handle-right" />
                  <div onPointerDown={(e) => handleMouseDownInteraction('school', 'bottom', e)} className="handle-bottom" />
                  <div onPointerDown={(e) => handleMouseDownInteraction('school', 'corner', e)} className="handle-corner" />
                </>

            </div>

        if (widgetId === 'gcal') {
          return (
            <div key="gcal" data-w="gcal" style={style} className="widget-container glass-card-warm rounded-2xl p-4 shadow-xl">
              <GoogleCalendarWidget events={events} onCloseWidget={(e) => removeWidget('gcal', e)} setEvents={setEvents}
                onDragStart={(e) => handleMouseDownInteraction('gcal', 'drag', e)} 
                isLocked={isWidgetsLocked} 
                onOpenUrl={handleOpenUrl}
                googleClientId={googleClientId}
                googleAccessToken={googleAccessToken}
                googleUserEmail={googleUserEmail}
                gcalRealEvents={gcalRealEvents}
                gcalLoading={gcalLoading}
                gcalError={gcalError}
                onGoogleLogin={handleGoogleCalLogin}
                onGoogleLogout={handleGoogleCalLogout}
                onRefreshGcal={() => fetchRealGoogleEvents()}
                onOpenGcalSetup={() => setShowGcalSetupModal(true)}
                onAddRealEvent={handleAddRealGoogleEvent}
                onDeleteRealEvent={handleDeleteRealGoogleEvent}
              />
              {!isWidgetsLocked && (
                <>
                  <div onPointerDown={(e) => handleMouseDownInteraction('gcal', 'right', e)} className="handle-right" />
                  <div onPointerDown={(e) => handleMouseDownInteraction('gcal', 'bottom', e)} className="handle-bottom" />
                  <div onPointerDown={(e) => handleMouseDownInteraction('gcal', 'corner', e)} className="handle-corner" />
                </>
              )}
            </div>
          );
        }

        return null;
      };

      return (
        <div className="w-full h-full overflow-hidden flex flex-col relative select-none">
          {currentTheme === 'jarvis' && <NeuralBackdrop enabled={jvMotion} />}
          <Wanderers enabled={petsOn} />
          {toastMsg && (
            <div className="jv-toast fixed top-16 left-1/2 -translate-x-1/2 z-[10000] bg-slate-900/95 border border-amber-500/80 text-amber-200 px-5 py-2 rounded-2xl shadow-2xl text-sm font-bold backdrop-blur-md flex items-center gap-2">
              <i className="fa-solid fa-bell text-amber-400"></i>
              <span>{toastMsg}</span>
            </div>
          )}

          <div className="absolute top-0 left-0 w-full h-[52px] topbar-glass border-b border-white/10 px-3 flex items-center justify-between z-50 select-none">
            <div className="flex items-center gap-2 text-[15px] font-black text-amber-400 whitespace-nowrap">
              <i className="fa-solid fa-graduation-cap"></i>
              <span>모동중 기술 OS</span>
            </div>
            <div className="flex items-center gap-2">
              {gasUrl ? (
                <button
                  onClick={() => pullFromGoogleSheet(gasUrl, true)}
                  disabled={syncStatus === 'syncing'}
                  className="topbar-btn"
                  title="눌러서 구글 시트에서 다시 불러오기"
                >
                  <span className={`w-2.5 h-2.5 rounded-full ${syncStatus === 'connected' ? 'bg-emerald-400' : (syncStatus === 'syncing' ? 'bg-amber-400 animate-pulse' : 'bg-rose-500')}`}></span>
                  <span>{syncStatus === 'syncing' ? '동기화…' : (syncStatus === 'connected' ? '시트' : '시트 오류')}</span>
                </button>
              ) : (
                <button onClick={() => { setTempGasUrl(gasUrl); setShowSheetSyncModal(true); }} className="topbar-btn" title="구글 시트 연동 설정">
                  <span className="w-2.5 h-2.5 rounded-full bg-slate-500"></span><span>시트</span>
                </button>
              )}

              <button
                onClick={() => (showClassFocus ? dismissClassFocus() : setFocusForced(true))}

                style={showClassFocus ? { background: 'rgba(5, 150, 105, 0.9)', borderColor: '#34d399', color: '#fff' } : {}}
                title="지금 수업 · 학생 화면 조종 · 오늘 내 수업"
              >
                <i className="fa-solid fa-chalkboard-user"></i> 수업 화면
              </button>

              {displayList.length <= 1 && (
                <button
                  className="topbar-btn pc-only"
                  onClick={() => { loadDisplayList(); showToast('🖥️ 모니터가 1대로 보여요. HDMI를 연결했다면 키보드에서 [윈도우 키 + P] → "확장"을 골라 주세요. 그러면 여기 보조 모니터 버튼이 생겨요.'); }}
                  title="보조 모니터로 옮기기 (HDMI 연결 후 '확장' 모드에서 사용)"

                      className={`h-[26px] px-2.5 rounded-lg text-[13px] font-bold transition whitespace-nowrap ${i === selectedDisplayIdx ? 'bg-sky-500 text-slate-950' : 'text-slate-200 hover:bg-slate-700'}`}

                      </button>
